---
name: Generate Tests Matrix
description: >
    Generates a test matrix from a CI matrix file, applies filtering based on scheduling, and sets cluster names and scenarios.

inputs:
    cluster_name:
        description: Optional cluster name to use, otherwise a random one is generated
        default: ''
    cluster_prefix:
        description: Prefix of the cluster name in case of generated name
        default: hci-
    ref_arch:
        description: Scenario name to use for filtering during workflow_dispatch
        default: ''
    ci_matrix_file:
        description: Path to the CI matrix file
        required: true
    is_schedule:
        description: Set to true if the run is scheduled
        required: true
    is_renovate_pr:
        description: Set to true if the PR is from Renovate
        required: true

outputs:
    platform_matrix:
        description: The final platform matrix in JSON format
        value: ${{ steps.matrix.outputs.platform_matrix }}

runs:
    using: composite
    steps:
        - name: Compute tests matrix
          shell: bash
          id: matrix
          run: |
              set -euo pipefail

              # Generate cluster name.
              distro_indexes="$(yq '.matrix.distro | to_entries | .[] | .key' "${INPUTS_CI_MATRIX_FILE}")"

              for distro_index in ${distro_indexes}; do
                # limiting factor are OpenSearch domains of maximum 28 characters
                cluster_name_fallback="${INPUTS_CLUSTER_PREFIX}$(cat /proc/sys/kernel/random/uuid | head -c 5)"
                export cluster_name="${INPUTS_CLUSTER_NAME:-}"
                if [[ -z "$cluster_name" ]]; then
                  cluster_name="$cluster_name_fallback"
                fi

                export distro_index="${distro_index}"

                # Maximum lenght for OpenSearch is 28 characters
                cluster_name="${cluster_name:0:28}"
                export cluster_name="${cluster_name}"

                yq -i '.matrix.distro[env(distro_index)].clusterName = env(cluster_name)' "${INPUTS_CI_MATRIX_FILE}"
              done

              echo "Filtering the matrix with strategy IS_SCHEDULE=${INPUTS_IS_SCHEDULE} or IS_RENOVATE_PR=${INPUTS_IS_RENOVATE_PR}"
              if [[ "${INPUTS_IS_SCHEDULE}" == "true" ]]; then
                echo "This is a scheduled run, we test all scenarios without filtering."
                platform_matrix="$(yq '.matrix' --indent=0 --output-format json "${INPUTS_CI_MATRIX_FILE}")"
              elif [[ "${INPUTS_IS_RENOVATE_PR}" == "true" ]]; then
                echo "This PR is from Renovate, we include all scenarios but exclude weekly_schedule_only."
                platform_matrix="$(yq '(.matrix |= (.distro |= map(select(.weekly_schedule_only == null or .weekly_schedule_only == false)))) | .matrix' \
                  --indent=0 --output-format json "${INPUTS_CI_MATRIX_FILE}")"
              else
                echo "This is a regular PR, we exclude schedule_only and weekly_schedule_only scenarios."
                platform_matrix="$(yq '(.matrix |= (.distro |= map(select(
                    (.schedule_only == null or .schedule_only == false)
                    and (.weekly_schedule_only == null or .weekly_schedule_only == false)
                  )))) | .matrix' \
                  --indent=0 --output-format json "${INPUTS_CI_MATRIX_FILE}")"
              fi

              if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${INPUTS_REF_ARCH}" != "" ]]; then
                echo "Filtering based on supplied ref_arch: ${INPUTS_REF_ARCH}"
                platform_matrix="$(echo "${platform_matrix}" | yq '(.scenario |= map(select(.name == env(INPUTS_REF_ARCH))))' -o=json)"
              fi

              # Add shortName (short SHA of scenario.name)
              platform_matrix="$(echo "${platform_matrix}" | jq -c '.scenario[]' | while read -r scenario; do
                name=$(echo "$scenario" | jq -r '.name')
                short_sha=$(echo -n "$name" | sha1sum | cut -c1-5)
                echo "$scenario" | jq --arg short "$short_sha" '. + {shortName: $short}'
              done | jq -c -s '{scenario: .}' | jq -c ". + $(echo "$platform_matrix" | jq -c 'del(.scenario)')")"

              echo "${platform_matrix}" | jq
              echo "platform_matrix=${platform_matrix}" >> "$GITHUB_OUTPUT"
          env:
              INPUTS_CI_MATRIX_FILE: ${{ inputs.ci_matrix_file }}
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster_name }}
              INPUTS_CLUSTER_PREFIX: ${{ inputs.cluster_prefix }}
              INPUTS_IS_SCHEDULE: ${{ inputs.is_schedule }}
              INPUTS_IS_RENOVATE_PR: ${{ inputs.is_renovate_pr }}
              INPUTS_REF_ARCH: ${{ inputs.ref_arch }}
