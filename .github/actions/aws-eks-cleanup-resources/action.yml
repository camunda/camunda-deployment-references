---
name: Delete EKS resources

description: |
    This GitHub Action automates the deletion of EKS resources using a shell script.

inputs:
    s3-backend-bucket:
        description: Bucket containing the resources states
        required: true

    s3-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on AWS_REGION
        required: false

    camunda-version:
        description: Camunda Ref Arch version to only clean up certain compatible ref arch versions.
        default: ''

    max-age-hours:
        description: Maximum age of resources in hours
        default: '12'

    target:
        description: Specify an ID to destroy specific resources or "all" to destroy all resources
        default: all

    temp-dir:
        description: Temporary directory prefix used for storing resource data during processing
        default: ./tmp/eks-cleanup/

    module-name:
        description: Name of the module to destroy (e.g., "eks-cluster", "aurora", "opensearch"), or "all" to destroy all modules
        default: all

    fail-on-not-found:
        description: Whether to fail if no matching resources are found (only for target not 'all')
        default: 'true'

runs:
    using: composite
    steps:
        - name: Delete resources
          id: delete_resources
          shell: bash
          run: |
              set -euo pipefail

              if [ -n "${INPUTS_S3_BUCKET_REGION}" ]; then
                export AWS_S3_REGION="${INPUTS_S3_BUCKET_REGION}"
              fi

              # The optional flag stays unquoted so that an empty expansion adds no argument.
              "${ACTION_PATH}/scripts/destroy.sh" "${INPUTS_S3_BACKEND_BUCKET}" "${ACTION_PATH}/../../../aws/modules/" \
                "${INPUTS_TEMP_DIR}" "${INPUTS_MAX_AGE_HOURS}" "${INPUTS_TARGET}" "${INPUTS_MODULE_NAME}" "${INPUTS_CAMUNDA_VERSION}" \
                $([[ "${INPUTS_FAIL_ON_NOT_FOUND}" == "true" ]] && echo "--fail-on-not-found")
          env:
              ACTION_PATH: ${{ github.action_path }}
              INPUTS_S3_BUCKET_REGION: ${{ inputs.s3-bucket-region }}
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}
              INPUTS_TEMP_DIR: ${{ inputs.temp-dir }}
              INPUTS_MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
              INPUTS_TARGET: ${{ inputs.target }}
              INPUTS_MODULE_NAME: ${{ inputs.module-name }}
              INPUTS_CAMUNDA_VERSION: ${{ inputs.camunda-version }}
              INPUTS_FAIL_ON_NOT_FOUND: ${{ inputs.fail-on-not-found }}
