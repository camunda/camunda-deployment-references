---
name: Generic File Decryption
description: |
    This GitHub Action decrypts a base64-encoded, AES-256-CBC encrypted file
    and writes the decrypted content to a specified output path.

inputs:
    encrypted_file_base64:
        description: Base64-encoded encrypted file content
        required: true
    encryption_key:
        description: Encryption key to decrypt the file
        required: true
    output_path:
        description: Path where the decrypted file will be saved
        required: true

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -euo pipefail

              echo "${INPUTS_ENCRYPTED_FILE_BASE64}" | base64 --decode > encrypted_file.enc
              mkdir -p "$(dirname "${INPUTS_OUTPUT_PATH}")"

              openssl enc -aes-256-cbc -d \
                -in encrypted_file.enc \
                -out "${INPUTS_OUTPUT_PATH}" \
                -pass pass:"${INPUTS_ENCRYPTION_KEY}" \
                -pbkdf2
              rm encrypted_file.enc
              chmod 600 "${INPUTS_OUTPUT_PATH}"
          env:
              INPUTS_ENCRYPTED_FILE_BASE64: ${{ inputs.encrypted_file_base64 }}
              INPUTS_OUTPUT_PATH: ${{ inputs.output_path }}
              INPUTS_ENCRYPTION_KEY: ${{ inputs.encryption_key }}
