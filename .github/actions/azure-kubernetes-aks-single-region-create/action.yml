---
name: Deploy Azure Kubernetes AKS Single Region Cluster

description: |
    This GitHub Action automates the deployment of the azure/kubernetes/aks-single-region reference architecture cluster using Terraform.
    The kube context will be set on the created cluster.

inputs:
    resource-prefix:
        description: Prefix for the resources to be created
        required: true
        default: camunda
    resource-group-name:
        description: Name of the resource group
        required: true
    cluster-name:
        description: Name of the AKS cluster to deploy
        required: true
        default: camunda-aks-cluster
    kubernetes-version:
        description: |
            Version of Kubernetes to install. Leave empty to keep the version
            pinned in the reference architecture (renovate-managed), which is the
            behaviour every caller has had so far.
        required: false
        default: ''
    # using S3 backend for terraform state even with Azure, to profit from existing cleanup capabilities
    s3-backend-bucket:
        description: Name of the S3 bucket to store Terraform state
        required: true
    s3-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on aws-region
    s3-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''
    tf-modules-revision:
        description: Git revision of the tf modules to use
        default: main
        required: true
    tf-modules-path:
        description: Path where the tf eks modules will be cloned
        default: ./.action-tf-modules/azure-kubernetes-aks-single-region-create/
        required: true
    tfvars:
        description: Path to the terraform.tfvars file with the variables for the AKS cluster
        required: true
    login:
        description: Authenticate the current kube context on the created cluster
        default: 'true'
        required: true
    ref-arch:
        description: Reference architecture to deploy
        default: aks-single-region
        required: false
    location:
        description: Azure region where the AKS cluster will be deployed
        required: true
    tags:
        description: Tags to apply to the cluster and related resources, in JSON format
        default: '{}'

outputs:
    terraform-state-url:
        description: URL of the Terraform state file in the S3 bucket
        value: ${{ steps.set-terraform-variables.outputs.terraform-state-url }}

runs:
    using: composite
    steps:
        - name: Checkout Repository
          uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
          with:
              repository: camunda/camunda-deployment-references
              ref: ${{ inputs.tf-modules-revision }}
              path: ${{ inputs.tf-modules-path }}
              fetch-depth: 0

        - name: Install asdf tools with cache for the project
          uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@07d834a5174bbe971e1c0ab961a8605d389953a8 # 2.3.7

        - name: Set Terraform variables
          id: set-terraform-variables
          shell: bash
          env:
              INPUTS_RESOURCE_GROUP_NAME: ${{ inputs.resource-group-name }}
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}
              INPUTS_S3_BUCKET_KEY_PREFIX: ${{ inputs.s3-bucket-key-prefix }}
              INPUTS_S3_BUCKET_REGION: ${{ inputs.s3-bucket-region }}
          run: |
              set -euo pipefail
              export TFSTATE_BUCKET="${INPUTS_S3_BACKEND_BUCKET}"
              export TFSTATE_KEY="${INPUTS_S3_BUCKET_KEY_PREFIX}tfstate-${INPUTS_RESOURCE_GROUP_NAME}/${INPUTS_RESOURCE_GROUP_NAME}.tfstate"

              if [ -z "${INPUTS_S3_BUCKET_REGION}" ]; then
                export TFSTATE_REGION="$AWS_REGION"
              else
                export TFSTATE_REGION="${INPUTS_S3_BUCKET_REGION}"
              fi

              echo "TFSTATE_BUCKET=${TFSTATE_BUCKET}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_REGION=${TFSTATE_REGION}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_KEY=${TFSTATE_KEY}" >> "$GITHUB_OUTPUT"

              terraform_state_url="s3://${TFSTATE_BUCKET}/${TFSTATE_KEY}"
              echo "terraform-state-url=${terraform_state_url}" >> "$GITHUB_OUTPUT"

        - name: Copy config_override.tf to module root
          shell: bash
          env:
              INPUTS_REF_ARCH: ${{ inputs.ref-arch }}
              INPUTS_TF_MODULES_PATH: ${{ inputs.tf-modules-path }}
          run: |
              cp -r "${INPUTS_TF_MODULES_PATH}/azure/kubernetes/${INPUTS_REF_ARCH}/test/fixtures/ci/"fixture_* \
              "${INPUTS_TF_MODULES_PATH}/azure/kubernetes/${INPUTS_REF_ARCH}/"

        - name: Terraform Init
          id: init
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          shell: bash
          env:
              TFSTATE_BUCKET: ${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}
              TFSTATE_KEY: ${{ steps.set-terraform-variables.outputs.TFSTATE_KEY }}
              TFSTATE_REGION: ${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}
          run: |
              set -euo pipefail

              terraform version


              terraform init \
                -backend-config="bucket=${TFSTATE_BUCKET}" \
                -backend-config="key=${TFSTATE_KEY}" \
                -backend-config="region=${TFSTATE_REGION}"

              terraform validate -no-color

        - name: Terraform Prepare
          id: prepare
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          shell: bash
          # Passed as env, never interpolated into the script: the values reach
          # jq as data, so nothing below has to be quoted or escaped.
          env:
              INPUTS_RESOURCE_PREFIX: ${{ inputs.resource-prefix }}
              INPUTS_TAGS: ${{ inputs.tags }}
              CLUSTER_NAME: ${{ inputs.cluster-name }}
              RESOURCE_GROUP_NAME: ${{ inputs.resource-group-name }}
              LOCATION: ${{ inputs.location }}
              KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
          run: |
              set -euo pipefail

              echo "Adapting the files with input values"
              pwd
              ls

              # Terraform's own override mechanism, rather than rewriting in place
              # the reference files we ship to users. Terraform *rejects* an
              # override for a local that no longer exists, so a rename in the
              # reference architecture fails the plan loudly.
              #
              # That is not theoretical here: the previous `sed -i ... main.tf`
              # also targeted `aks_cluster_name` and `kubernetes_version`, which
              # both live in aks.tf, so those two substitutions silently matched
              # nothing and the kubernetes-version input was discarded.
              #
              # It also stops `sed -i` from turning the aks-single-region-rdbms
              # main.tf/aks.tf symlinks into regular files on every run.
              #
              # Module arguments are merged rather than validated, so the one we
              # set is checked explicitly below.
              overrides=$(jq -n \
                  --arg rg "${RESOURCE_GROUP_NAME}" \
                  --arg loc "${LOCATION}" \
                  --arg name "${CLUSTER_NAME}" \
                  '{
                      locals: { resource_group_name: $rg, location: $loc },
                      module: { aks: { aks_cluster_name: $name } }
                  }')

              # Empty means "keep the reference architecture's version", which is
              # renovate-pinned. The substitution never worked, so the input's own
              # default had drifted far behind; overriding with it unconditionally
              # would silently downgrade the cluster.
              if [ -n "${KUBERNETES_VERSION}" ]; then
                  overrides=$(jq --arg v "${KUBERNETES_VERSION}" '.locals.kubernetes_version = $v' <<< "${overrides}")
              fi

              # Scoped to the module block: aks_cluster_name also appears as an
              # output name in outputs.tf, and searching the whole tree would let
              # that mask a removed argument.
              if [ ! -f aks.tf ]; then
                  echo "::error::No aks.tf in $(pwd); this action only knows how to override" \
                      "the aks-single-region layout. Check the ref-arch input."
                  exit 1
              fi
              aks_block=$(awk '/^module "aks"/ { inside = 1 }
                                 inside { print; depth += gsub(/\{/, "{"); depth -= gsub(/\}/, "}"); if (depth == 0) exit }' aks.tf)
              if ! grep -qE '^[[:space:]]*aks_cluster_name[[:space:]]*=' <<< "${aks_block}"; then
                  echo "::error::No 'aks_cluster_name' argument in the aks module block of aks.tf;" \
                      "the CI override would be silently ignored. Update this action."
                  exit 1
              fi

              jq '.' <<< "${overrides}" | tee ci_override.tf.json

              # Set resource_prefix_placeholder to an empty string if not provided
              resource_prefix_placeholder="${INPUTS_RESOURCE_PREFIX}"
              if [ -z "$resource_prefix_placeholder" ]; then
                resource_prefix_placeholder=""
              fi

              echo "RESOURCE_PREFIX_PLACEHOLDER=$resource_prefix_placeholder" | tee -a "$GITHUB_OUTPUT"

              # Default tags are not supported
              # https://github.com/hashicorp/terraform-provider-azurerm/issues/13776
              raw_tags="${INPUTS_TAGS}"

              # Default tags from azure/kubernetes/aks-single-region/variables.tf
              static_tags='{
                "Environment": "Testing",
                "Purpose": "Reference Implementation"
              }'

              combined_tags=$(jq -c -s '.[0] + .[1]' <(echo "$raw_tags") <(echo "$static_tags"))
              echo "COMBINED_TAGS=$combined_tags" | tee -a "$GITHUB_OUTPUT"

        - name: Sanitize Tags
          id: sanitize-tags
          uses: ./.github/actions/internal-sanitize-tags
          with:
              raw-tags: ${{ steps.prepare.outputs.COMBINED_TAGS }}

        - name: Generate tfvars file
          id: generate-tfvars
          shell: bash
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          env:
              RESOURCE_PREFIX_PLACEHOLDER: ${{ steps.prepare.outputs.RESOURCE_PREFIX_PLACEHOLDER }}
              SANITIZED_TAGS: ${{ steps.sanitize-tags.outputs.sanitized_tags }}
          run: |
              set -euo pipefail

              cat > terraform.tfvars <<EOF
              tags = ${SANITIZED_TAGS}
              resource_prefix_placeholder = "${RESOURCE_PREFIX_PLACEHOLDER}"
              EOF

        - name: Terraform Plan
          id: plan
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          shell: bash
          env:
              INPUTS_TFVARS: ${{ inputs.tfvars }}
          run: |
              set -euo pipefail

              terraform plan \
                  -no-color \
                  -out tf.plan \
                  -var-file=terraform.tfvars \
                  -var-file="${INPUTS_TFVARS}"

        - name: Terraform Apply
          id: apply
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          shell: bash
          run: |
              set -euo pipefail
              terraform apply -no-color tf.plan

        - name: Terraform Drift Detection
          uses: ./.github/actions/internal-terraform-drift-detect
          id: drift-detect
          with:
              working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
              plan-extra-args: |
                  -var-file=terraform.tfvars \
                  -var-file="${{ inputs.tfvars }}"

        - name: Login and generate kubeconfig
          if: inputs.login == 'true'
          shell: bash
          env:
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster-name }}
              INPUTS_RESOURCE_GROUP_NAME: ${{ inputs.resource-group-name }}
          run: |
              set -euo pipefail
              az aks get-credentials --resource-group "${INPUTS_RESOURCE_GROUP_NAME}" --name "${INPUTS_CLUSTER_NAME}" --overwrite-existing

              kubectl config current-context
              kubectl get nodes

        - name: Apply and verify storage class
          shell: bash
          working-directory: ${{ inputs.tf-modules-path }}/azure/kubernetes/${{ inputs.ref-arch }}/
          run: |
              set -euo pipefail
              ./procedure/storageclass-configure.sh
              ./procedure/storageclass-verify.sh
