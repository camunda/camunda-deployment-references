---
name: Deploy AWS Kubernetes EKS Single Region Cluster

description: |
    This GitHub Action automates the deployment of the aws/kubernetes/eks-single-region(-irsa) reference architecture cluster using Terraform.
    The kube context will be set on the created cluster.
    Supports conditional deployment of Aurora PostgreSQL and OpenSearch.

inputs:
    cluster-name:
        description: Name of the EKS cluster to deploy
        required: true
    aws-region:
        description: AWS region where the EKS cluster will be deployed
        required: true
    kubernetes-version:
        description: Version of Kubernetes to install
        required: false
        # renovate: datasource=endoflife-date depName=amazon-eks versioning=loose
        default: '1.36'
    single-nat-gateway:
        description: Whether to use a single NAT gateway or not. Default is true for our tests to save on IPs.
        default: 'true'
    tags:
        description: Tags to apply to the cluster and related resources, in JSON format
        default: '{}'
    s3-backend-bucket:
        description: Name of the S3 bucket to store Terraform state
        required: true
    s3-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on aws-region
    s3-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''
    tf-modules-revision:
        description: Git revision of the tf modules to use
        default: main
        required: true
    tf-modules-path:
        description: Path where the tf eks modules will be cloned
        default: ./.action-tf-modules/aws-kubernetes-eks-single-region-create/
        required: true
    login:
        description: Authenticate the current kube context on the created cluster
        default: 'true'
        required: true
    ref-arch:
        description: Reference architecture to deploy
        default: eks-single-region-irsa
        required: false
    vpn-enabled:
        description: Enable VPN setup module (recommended when private_vpc is true), this will also configure the current runner to use it
        default: 'false'
    private-vpc:
        description: The VPC within which the cluster resides will only have private subnets, meaning that it cannot be accessed at all from the public
            Internet (empty will fallback on default value of the module)
        default: ''
    deploy-aurora:
        description: Deploy Aurora PostgreSQL database
        default: 'true'
    deploy-opensearch:
        description: Deploy OpenSearch domain
        default: 'true'
    np-capacity-type:
        description: |
            Override the node pool capacity type (ON_DEMAND or SPOT). When empty, the value
            defined in the reference cluster.tf is used. Tests use SPOT for cost efficiency
            (see https://github.com/camunda/camunda-deployment-references/issues/109).
        default: ''
    np-instance-types:
        description: |
            Override the node pool instance types as a comma-separated list (e.g.
            "m6i.xlarge,m5.xlarge,m5a.xlarge"). When empty, the value defined in the reference
            cluster.tf is used. Providing several same-size types improves SPOT availability.
        default: ''

outputs:
    terraform-state-url-cluster:
        description: URL of the Terraform state file in the S3 bucket
        value: ${{ steps.init-cluster.outputs.terraform-state-url-cluster }}


    terraform-state-url-vpn:
        description: URL of the module "vpn" Terraform state file in the S3 bucket
        value: ${{ steps.init-vpn.outputs.terraform-state-url-vpn }}


    vpn-client-configs:
        description: Map of VPN client configs
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs || '' }}
    vpn-client-config-file:
        description: Config file used by the VPN
        value: ${{ steps.vpn.outputs.vpn_client_config_file || '' }}
    vpn-endpoint:
        description: Endpoint of the VPN to access the created cluster
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_endpoint || '' }}

runs:
    using: composite
    steps:
        - name: Checkout Repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
              repository: camunda/camunda-deployment-references
              ref: ${{ inputs.tf-modules-revision }}
              path: ${{ inputs.tf-modules-path }}
              fetch-depth: 0

        - name: Install asdf tools with cache for the project
          uses: camunda/infraex-common-config/./.github/actions/asdf-install-tooling@bde1b69728d323c1c2d02e19153a8e00382eec4a # 1.8.0

        - name: Set Terraform variables
          id: set-terraform-variables
          shell: bash
          run: |
              set -euo pipefail
              export TFSTATE_BUCKET="${{ inputs.s3-backend-bucket }}"
              export TFSTATE_BASE_KEY="${{ inputs.s3-bucket-key-prefix }}tfstate-${{ inputs.cluster-name }}/"

              if [ -z "${{ inputs.s3-bucket-region }}" ]; then
                export TFSTATE_REGION="$AWS_REGION"
              else
                export TFSTATE_REGION="${{ inputs.s3-bucket-region }}"
              fi

              echo "TFSTATE_BUCKET=${TFSTATE_BUCKET}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_REGION=${TFSTATE_REGION}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_BASE_KEY=${TFSTATE_BASE_KEY}" | tee -a "$GITHUB_OUTPUT"

              echo "TF_DIR_CLUSTER=${{ inputs.tf-modules-path }}/aws/kubernetes/${{ inputs.ref-arch }}/terraform/cluster/" >> "$GITHUB_ENV"
              echo "TF_DIR_VPN=${{ inputs.tf-modules-path }}/aws/kubernetes/${{ inputs.ref-arch }}/terraform/vpn/" >> "$GITHUB_ENV"
              echo "TF_REF_ARCH_DIR=${{ inputs.tf-modules-path }}/aws/kubernetes/${{ inputs.ref-arch }}/" >> "$GITHUB_ENV"


        - name: Sanitize Tags
          id: sanitize-tags
          uses: ./.github/actions/internal-sanitize-tags
          with:
              raw-tags: ${{ inputs.tags }}

        - name: Terraform Init - Cluster
          id: init-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}cluster.tfstate"
              terraform_state_url_cluster="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-cluster=${terraform_state_url_cluster}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Generate tfvars file - Cluster
          id: generate-tfvars-cluster
          shell: bash
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          run: |
              set -euo pipefail

              cat > terraform-cluster.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              EOF

        - name: Terraform Plan - Cluster
          id: plan-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              set -euo pipefail
              echo "Adapting the files with input values"
              pwd
              ls

              # `sed -i` exits 0 when its pattern matches nothing, so any rename or
              # reformat of the reference cluster.tf silently leaves CI running
              # against the file's own defaults instead of the override we asked
              # for — a wrong-but-green run that is very hard to spot. Read each
              # value back after patching and fail loudly when it did not take.
              assert_override_applied() {
                  local key="$1" expected="$2" file="$3" actual
                  # -m 1 rather than `| head -n 1`: several of these keys appear
                  # twice (the local, then the module argument referencing it) and
                  # closing the pipe early would kill grep with SIGPIPE under
                  # `set -o pipefail`. A key that is missing entirely makes grep
                  # exit 1, which must not abort the script before the diagnostic
                  # below gets a chance to explain what happened.
                  # The sed chain strips, in order: the `key =` prefix, a trailing
                  # comment, any trailing whitespace (a formatter pass adding one
                  # must not fail an override that did apply), then the quotes.
                  actual=$(grep -m 1 -E "^[[:space:]]*${key}[[:space:]]*=" "${file}" \
                      | sed -E "s|^[[:space:]]*${key}[[:space:]]*=[[:space:]]*||; s|[[:space:]]*#.*$||; s|[[:space:]]+$||; s|^\"||; s|\"$||") || actual=""
                  if [ "${actual}" != "${expected}" ]; then
                      echo "::error::Failed to apply the '${key}' override to ${file}: expected '${expected}', found" \
                          "'${actual:-<no assignment>}'. The reference file layout probably changed; update this action."
                      exit 1
                  fi
                  echo "✅ ${file}: ${key} = ${expected}"
              }

              # Both are written into cluster.tf as bare HCL booleans, so validate
              # them here: `TRUE` or `yes` would otherwise only blow up much later
              # as an opaque Terraform parse error. single-nat-gateway is always
              # substituted, so an empty value would produce invalid HCL
              # (`single_nat_gateway = `); private-vpc is only substituted when
              # non-empty, so empty means "leave the module default alone".
              case "${{ inputs.single-nat-gateway }}" in
                true|false) ;;
                *)
                  echo "::error::Invalid single-nat-gateway '${{ inputs.single-nat-gateway }}'; expected the HCL boolean true or false."
                  exit 1
                  ;;
              esac
              case "${{ inputs.private-vpc }}" in
                ''|true|false) ;;
                *)
                  echo "::error::Invalid private-vpc '${{ inputs.private-vpc }}'; expected the HCL boolean true or false, or an empty value to keep the module default."
                  exit 1
                  ;;
              esac

              # We use sed instead of -var because the module presented to the user
              # uses locals for simplicity. Locals cannot be overwritten with the CLI.
              # The patterns are anchored to the start of the line so a comment or a
              # later reference to the same key cannot be rewritten instead.
              sed -i -E \
                     -e 's|^([[:space:]]*eks_cluster_name[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.cluster-name }}\2|' \
                     -e 's|^([[:space:]]*eks_cluster_region[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.aws-region }}\2|' \
                     -e 's|^([[:space:]]*kubernetes_version[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.kubernetes-version }}\2|' \
                     -e 's#^([[:space:]]*single_nat_gateway[[:space:]]*=[[:space:]]*)(true|false)#\1${{ inputs.single-nat-gateway }}#' \
                     cluster.tf

              assert_override_applied eks_cluster_name '${{ inputs.cluster-name }}' cluster.tf
              assert_override_applied eks_cluster_region '${{ inputs.aws-region }}' cluster.tf
              assert_override_applied kubernetes_version '${{ inputs.kubernetes-version }}' cluster.tf
              assert_override_applied single_nat_gateway '${{ inputs.single-nat-gateway }}' cluster.tf

              if [ -n "${{ inputs.private-vpc }}" ]; then
                sed -i -E "s|(^[[:space:]]*private_vpc[[:space:]]*=[[:space:]]*)[a-z]+|\1${{ inputs.private-vpc }}|" cluster.tf
                assert_override_applied private_vpc '${{ inputs.private-vpc }}' cluster.tf
              else
                echo "No private-vpc value provided, skipping private modification."
              fi

              # Optional CI-only node pool overrides (see issue #109): run tests on
              # cost-efficient SPOT capacity with diversified instance types. The reference
              # cluster.tf passes these as literal module arguments (not wired to root
              # variables), so there is no -var to override; patch the file in place instead.
              _np_capacity_type="${{ inputs.np-capacity-type }}"
              if [ -n "${_np_capacity_type}" ]; then
                # Validate early so a typo fails fast with a clear message instead of a
                # cryptic Terraform error (or a silently wrong capacity type) later on.
                if [ "${_np_capacity_type}" != "ON_DEMAND" ] && [ "${_np_capacity_type}" != "SPOT" ]; then
                  echo "::error::Invalid np-capacity-type '${_np_capacity_type}'; allowed values are ON_DEMAND or SPOT."
                  exit 1
                fi
                sed -i -E "s|^([[:space:]]*np_capacity_type[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${_np_capacity_type}\2|" cluster.tf
                assert_override_applied np_capacity_type "${_np_capacity_type}" cluster.tf
              fi
              _np_instance_types="${{ inputs.np-instance-types }}"
              if [ -n "${_np_instance_types}" ]; then
                # Convert the comma-separated list into an HCL list literal, trimming
                # surrounding whitespace and dropping empty entries so a loosely formatted
                # input (spaces or a trailing comma) still yields valid HCL.
                IFS=',' read -ra _np_types <<< "${_np_instance_types}"
                _np_hcl="["
                for _np_type in "${_np_types[@]}"; do
                  # Strip leading and trailing whitespace, then skip empty entries.
                  _np_type="${_np_type#"${_np_type%%[![:space:]]*}"}"
                  _np_type="${_np_type%"${_np_type##*[![:space:]]}"}"
                  [ -z "${_np_type}" ] && continue
                  # Validate the token against an AWS instance-type shape (family.size,
                  # both of which may contain hyphens, e.g. c7i-flex.large or
                  # m7i.metal-48xl) so stray characters (quotes, newlines, ...) can't
                  # inject invalid content into the generated HCL list.
                  if [[ ! "${_np_type}" =~ ^[a-z0-9-]+\.[a-z0-9-]+$ ]]; then
                    echo "::error::Invalid np-instance-types entry '${_np_type}'; expected an AWS instance type such as m6i.xlarge."
                    exit 1
                  fi
                  _np_hcl+="\"${_np_type}\", "
                done
                _np_hcl="${_np_hcl%, }]"
                if [ "${_np_hcl}" = "[]" ]; then
                  echo "::error::np-instance-types contained no valid entries: '${_np_instance_types}'."
                  exit 1
                fi
                sed -i -E "s|^([[:space:]]*np_instance_types[[:space:]]*=[[:space:]]*).*|\1${_np_hcl}|" cluster.tf
                assert_override_applied np_instance_types "${_np_hcl}" cluster.tf
              fi

              echo "Displaying templated cluster.tf file:"
              cat cluster.tf

              # Conditionally configure Aurora PostgreSQL
              if [[ "${{ inputs.deploy-aurora }}" == "true" ]]; then
                  echo "Configuring Aurora PostgreSQL database..."
                  sed -i -E 's|^([[:space:]]*aurora_cluster_name[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.cluster-name }}-pg\2|' \
                         db.tf
                  assert_override_applied aurora_cluster_name '${{ inputs.cluster-name }}-pg' db.tf

                  echo "Displaying templated db.tf file:"
                  cat db.tf
              else
                  echo "Skipping Aurora PostgreSQL deployment"
                  # Comment out or remove Aurora resources
                  if [[ -f "db.tf" ]]; then
                      mv db.tf db.tf.disabled
                      echo "Aurora resources disabled"
                  fi
              fi

              # Conditionally configure OpenSearch
              if [[ "${{ inputs.deploy-opensearch }}" == "true" ]]; then
                  echo "Configuring OpenSearch domain..."
                  sed -i -E 's|^([[:space:]]*opensearch_domain_name[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.cluster-name }}-os\2|' \
                         opensearch.tf
                  assert_override_applied opensearch_domain_name '${{ inputs.cluster-name }}-os' opensearch.tf
                  echo "Displaying templated opensearch.tf file:"
                  cat opensearch.tf
              else
                  echo "Skipping OpenSearch deployment"
                  # Comment out or remove OpenSearch resources
                  if [[ -f "opensearch.tf" ]]; then
                      mv opensearch.tf opensearch.tf.disabled
                      echo "OpenSearch resources disabled"
                  fi
              fi

              terraform plan -no-color -var-file=terraform-cluster.tfvars -out tf.plan

        - name: Terraform Apply - Cluster
          id: apply-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              set -euo pipefail
              terraform apply -no-color tf.plan

        - name: Export Terraform Outputs - Cluster
          id: terraform_outputs_cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - Cluster
          uses: ./.github/actions/internal-terraform-drift-detect
          id: drift-detect-cluster
          with:
              working-directory: ${{ env.TF_DIR_CLUSTER }}
              plan-extra-args: |
                  -var-file=terraform-cluster.tfvars

        - name: Terraform Init - VPN
          id: init-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}vpn.tfstate"
              terraform_state_url_vpn="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-vpn=${terraform_state_url_vpn}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Generate tfvars file - VPN
          id: generate-tfvars-vpn
          if: inputs.vpn-enabled == 'true'
          shell: bash
          working-directory: ${{ env.TF_DIR_VPN }}
          run: |
              set -euo pipefail

              cat > terraform-vpn.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              vpc_id = "${{ steps.terraform_outputs_cluster.outputs.vpc_id }}"
              EOF

        - name: Terraform Plan - VPN
          id: plan-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              echo "Adapting the files with input values"
              pwd
              ls

              sed -i -E \
                -e 's|^([[:space:]]*vpn_name[[:space:]]*=[[:space:]]*")[^"]*(")|\1${{ inputs.cluster-name }}-vpn\2|' \
                vpn.tf

              # Same guard as the cluster.tf overrides: `sed -i` succeeds even
              # when it matches nothing, so read the value back rather than
              # deploying a VPN named after the reference default. The read-back
              # is a fixed-string comparison (not a regex) so a cluster name
              # containing regex metacharacters cannot skew the match.
              _vpn_name=$(grep -m 1 -E '^[[:space:]]*vpn_name[[:space:]]*=' vpn.tf \
                  | sed -E 's|^[[:space:]]*vpn_name[[:space:]]*=[[:space:]]*||; s|[[:space:]]*#.*$||; s|[[:space:]]+$||; s|^"||; s|"$||') || _vpn_name=""
              if [ "${_vpn_name}" != '${{ inputs.cluster-name }}-vpn' ]; then
                  echo "::error::Failed to apply the 'vpn_name' override to vpn.tf: expected '${{ inputs.cluster-name }}-vpn'," \
                      "found '${_vpn_name:-<no assignment>}'. The reference file layout probably changed; update this action."
                  exit 1
              fi

              echo "Displaying templated vpn.tf file:"
              cat vpn.tf

              terraform plan -no-color -var-file=terraform-vpn.tfvars -out vpn.plan

        - name: Terraform Apply - VPN
          id: apply-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform apply -no-color vpn.plan

        - name: Export Terraform Outputs - VPN
          id: terraform_outputs_vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - VPN
          uses: ./.github/actions/internal-terraform-drift-detect
          if: inputs.vpn-enabled == 'true'
          id: drift-detect-vpn
          with:
              working-directory: ${{ env.TF_DIR_VPN }}
              plan-extra-args: |
                  -var-file=terraform-vpn.tfvars

        ### End of terraform

        - name: Configure VPN Client if enabled
          id: vpn
          shell: bash
          if: inputs.vpn-enabled == 'true'
          run: |
              sudo apt update
              sudo apt install -y openvpn openvpn-systemd-resolved

              client_name="my-client" # the client name is hard-coded in the reference
              config=$(echo '${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs }}' | jq -r --arg client "$client_name" '.[$client]')

              # Create a secure directory inside the GitHub workspace
              mkdir -p "$GITHUB_WORKSPACE/.vpn"
              vpn_client_config_file="$GITHUB_WORKSPACE/.vpn/client.ovpn"

              # Create the client's config file
              echo "$config" > "$vpn_client_config_file"
              echo "vpn_client_config_file=$vpn_client_config_file" | tee -a "$GITHUB_OUTPUT"

        - name: Connect to VPN
          if: inputs.vpn-enabled == 'true'
          uses: kota65535/github-openvpn-connect-action@cd2ed8a90cc7b060dc4e001143e811b5f7ea0af5 # v3.1.0
          with:
              config_file: ${{ steps.vpn.outputs.vpn_client_config_file }}
              echo_config: 'false'

        - name: Login and generate kubeconfig
          if: inputs.login == 'true'
          shell: bash
          run: |
              set -euo pipefail
              aws eks update-kubeconfig --region ${{ inputs.aws-region }} --name ${{ inputs.cluster-name }} --alias ${{ inputs.cluster-name }}

              kubectl config current-context
              kubectl get nodes

        - name: Apply and verify storage class
          shell: bash
          working-directory: ${{ env.TF_REF_ARCH_DIR }}
          run: |
              set -euo pipefail
              ./procedure/storageclass-configure.sh
              ./procedure/storageclass-verify.sh
