---
name: Deploy AWS Kubernetes EKS Single Region Cluster

description: |
    This GitHub Action automates the deployment of the aws/kubernetes/eks-single-region(-irsa) reference architecture cluster using Terraform.
    The kube context will be set on the created cluster.
    Supports conditional deployment of Aurora PostgreSQL and OpenSearch.

inputs:
    cluster-name:
        description: Name of the EKS cluster to deploy
        required: true
    aws-region:
        description: AWS region where the EKS cluster will be deployed
        required: true
    kubernetes-version:
        description: Version of Kubernetes to install
        required: false
        # renovate: datasource=endoflife-date depName=amazon-eks versioning=loose
        default: '1.35'
    single-nat-gateway:
        description: Whether to use a single NAT gateway or not. Default is true for our tests to save on IPs.
        default: 'true'
    tags:
        description: Tags to apply to the cluster and related resources, in JSON format
        default: '{}'
    s3-backend-bucket:
        description: Name of the S3 bucket to store Terraform state
        required: true
    s3-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on aws-region
    s3-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''
    tf-modules-revision:
        description: Git revision of the tf modules to use
        default: main
        required: true
    tf-modules-path:
        description: Path where the tf eks modules will be cloned
        default: ./.action-tf-modules/aws-kubernetes-eks-single-region-create/
        required: true
    login:
        description: Authenticate the current kube context on the created cluster
        default: 'true'
        required: true
    ref-arch:
        description: Reference architecture to deploy
        default: eks-single-region-irsa
        required: false
    vpn-enabled:
        description: Enable VPN setup module (recommended when private_vpc is true), this will also configure the current runner to use it
        default: 'false'
    private-vpc:
        description: The VPC within which the cluster resides will only have private subnets, meaning that it cannot be accessed at all from the public
            Internet (empty will fallback on default value of the module)
        default: ''
    deploy-aurora:
        description: Deploy Aurora PostgreSQL database
        default: 'true'
    deploy-opensearch:
        description: Deploy OpenSearch domain
        default: 'true'
    np-capacity-type:
        description: |
            Override the node pool capacity type (ON_DEMAND or SPOT). When empty, the value
            defined in the reference cluster.tf is used. Tests use SPOT for cost efficiency
            (see https://github.com/camunda/camunda-deployment-references/issues/109).
        default: ''
    np-instance-types:
        description: |
            Override the node pool instance types as a comma-separated list (e.g.
            "m6i.xlarge,m5.xlarge,m5a.xlarge"). When empty, the value defined in the reference
            cluster.tf is used. Providing several same-size types improves SPOT availability.
        default: ''

outputs:
    terraform-state-url-cluster:
        description: URL of the Terraform state file in the S3 bucket
        value: ${{ steps.init-cluster.outputs.terraform-state-url-cluster }}


    terraform-state-url-vpn:
        description: URL of the module "vpn" Terraform state file in the S3 bucket
        value: ${{ steps.init-vpn.outputs.terraform-state-url-vpn }}


    vpn-client-configs:
        description: Map of VPN client configs
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs || '' }}
    vpn-client-config-file:
        description: Config file used by the VPN
        value: ${{ steps.vpn.outputs.vpn_client_config_file || '' }}
    vpn-endpoint:
        description: Endpoint of the VPN to access the created cluster
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_endpoint || '' }}

runs:
    using: composite
    steps:
        - name: Checkout Repository
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
          with:
              repository: camunda/camunda-deployment-references
              ref: ${{ inputs.tf-modules-revision }}
              path: ${{ inputs.tf-modules-path }}
              fetch-depth: 0

        - name: Install asdf tools with cache for the project
          uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

        - name: Set Terraform variables
          id: set-terraform-variables
          shell: bash
          run: |  # zizmor: ignore[github-env]
              set -euo pipefail
              export TFSTATE_BUCKET="${INPUTS_S3_BACKEND_BUCKET}"
              export TFSTATE_BASE_KEY="${INPUTS_S3_BUCKET_KEY_PREFIX}tfstate-${INPUTS_CLUSTER_NAME}/"

              if [ -z "${INPUTS_S3_BUCKET_REGION}" ]; then
                export TFSTATE_REGION="$AWS_REGION"
              else
                export TFSTATE_REGION="${INPUTS_S3_BUCKET_REGION}"
              fi

              echo "TFSTATE_BUCKET=${TFSTATE_BUCKET}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_REGION=${TFSTATE_REGION}" >> "$GITHUB_OUTPUT"
              echo "TFSTATE_BASE_KEY=${TFSTATE_BASE_KEY}" | tee -a "$GITHUB_OUTPUT"

              echo "TF_DIR_CLUSTER=${INPUTS_TF_MODULES_PATH}/aws/kubernetes/${INPUTS_REF_ARCH}/terraform/cluster/" >> "$GITHUB_ENV"
              echo "TF_DIR_VPN=${INPUTS_TF_MODULES_PATH}/aws/kubernetes/${INPUTS_REF_ARCH}/terraform/vpn/" >> "$GITHUB_ENV"
              echo "TF_REF_ARCH_DIR=${INPUTS_TF_MODULES_PATH}/aws/kubernetes/${INPUTS_REF_ARCH}/" >> "$GITHUB_ENV"
          env:
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}
              INPUTS_S3_BUCKET_KEY_PREFIX: ${{ inputs.s3-bucket-key-prefix }}
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster-name }}
              INPUTS_S3_BUCKET_REGION: ${{ inputs.s3-bucket-region }}
              INPUTS_TF_MODULES_PATH: ${{ inputs.tf-modules-path }}
              INPUTS_REF_ARCH: ${{ inputs.ref-arch }}


        - name: Sanitize Tags
          id: sanitize-tags
          uses: ./.github/actions/internal-sanitize-tags
          with:
              raw-tags: ${{ inputs.tags }}

        - name: Terraform Init - Cluster
          id: init-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}cluster.tfstate"
              terraform_state_url_cluster="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-cluster=${terraform_state_url_cluster}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Generate tfvars file - Cluster
          id: generate-tfvars-cluster
          shell: bash
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          run: |
              set -euo pipefail

              cat > terraform-cluster.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              EOF

        - name: Terraform Plan - Cluster
          id: plan-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          # Passed as env, never interpolated into the script: the values reach
          # jq as data, so no quoting or escaping concern arises anywhere below.
          env:
              CLUSTER_NAME: ${{ inputs.cluster-name }}
              CLUSTER_REGION: ${{ inputs.aws-region }}
              KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
              SINGLE_NAT_GATEWAY: ${{ inputs.single-nat-gateway }}
              PRIVATE_VPC: ${{ inputs.private-vpc }}
              NP_CAPACITY_TYPE: ${{ inputs.np-capacity-type }}
              NP_INSTANCE_TYPES: ${{ inputs.np-instance-types }}
              DEPLOY_AURORA: ${{ inputs.deploy-aurora }}
              DEPLOY_OPENSEARCH: ${{ inputs.deploy-opensearch }}
          run: |
              set -euo pipefail
              echo "Adapting the files with input values"
              pwd
              ls

              # Aurora and OpenSearch are opt-in: drop their files before building
              # the override, so it never references a local that is not there.
              if [[ "${DEPLOY_AURORA}" != "true" && -f db.tf ]]; then
                  echo "Skipping Aurora PostgreSQL deployment"
                  mv db.tf db.tf.disabled
              fi
              if [[ "${DEPLOY_OPENSEARCH}" != "true" && -f opensearch.tf ]]; then
                  echo "Skipping OpenSearch deployment"
                  mv opensearch.tf opensearch.tf.disabled
              fi

              # The reference configuration is what we ship to users, so CI must
              # not rewrite it in place. Terraform's own override mechanism does
              # the job declaratively: a `*_override.tf.json` file is merged over
              # the primary configuration, and Terraform *rejects* an override for
              # a local that no longer exists ("An override file can only override
              # a local value that was already defined in a primary configuration
              # file"). A rename in the reference architecture therefore fails the
              # plan loudly, instead of silently testing the reference defaults.
              #
              # Module arguments are merged rather than validated, so those are
              # checked explicitly below.
              #
              # The file is built with jq so every value is carried as data: no
              # quoting, no regex, no shell interpolation.

              case "${SINGLE_NAT_GATEWAY}" in
                true|false) ;;
                *)
                  echo "::error::Invalid single-nat-gateway '${SINGLE_NAT_GATEWAY}'; expected the boolean true or false."
                  exit 1
                  ;;
              esac

              overrides=$(jq -n \
                  --arg name "${CLUSTER_NAME}" \
                  --arg region "${CLUSTER_REGION}" \
                  --arg k8s "${KUBERNETES_VERSION}" \
                  --argjson nat "${SINGLE_NAT_GATEWAY}" \
                  '{
                      locals: {
                          eks_cluster_name: $name,
                          eks_cluster_region: $region,
                          kubernetes_version: $k8s,
                          single_nat_gateway: $nat
                      },
                      module: { eks_cluster: {} }
                  }')

              # The reference file passes these as literal module arguments, so
              # there is no local to override and no -var to set.
              if [ -n "${PRIVATE_VPC}" ]; then
                  case "${PRIVATE_VPC}" in
                    true|false) ;;
                    *)
                      echo "::error::Invalid private-vpc '${PRIVATE_VPC}'; expected the boolean true or false, or an empty value to keep the reference default."
                      exit 1
                      ;;
                  esac
                  overrides=$(jq --argjson v "${PRIVATE_VPC}" '.module.eks_cluster.private_vpc = $v' <<< "${overrides}")
              fi

              # Optional CI-only node pool overrides (see issue #109): run tests on
              # cost-efficient SPOT capacity with diversified instance types.
              if [ -n "${NP_CAPACITY_TYPE}" ]; then
                  case "${NP_CAPACITY_TYPE}" in
                    ON_DEMAND|SPOT) ;;
                    *)
                      echo "::error::Invalid np-capacity-type '${NP_CAPACITY_TYPE}'; allowed values are ON_DEMAND or SPOT."
                      exit 1
                      ;;
                  esac
                  overrides=$(jq --arg v "${NP_CAPACITY_TYPE}" '.module.eks_cluster.np_capacity_type = $v' <<< "${overrides}")
              fi

              if [ -n "${NP_INSTANCE_TYPES}" ]; then
                  # Comma-separated input -> JSON array, trimming whitespace and
                  # dropping empty entries so a loosely formatted value still works.
                  np_types=$(jq -n --arg s "${NP_INSTANCE_TYPES}" \
                      '[$s | split(",") | .[] | sub("^\\s+";"") | sub("\\s+$";"") | select(length > 0)]')
                  if ! jq -e 'length > 0 and all(test("^[a-z0-9-]+\\.[a-z0-9-]+$"))' <<< "${np_types}" > /dev/null; then
                      echo "::error::Invalid np-instance-types '${NP_INSTANCE_TYPES}'; expected a comma-separated list of AWS instance types such as m6i.xlarge."
                      exit 1
                  fi
                  overrides=$(jq --argjson v "${np_types}" '.module.eks_cluster.np_instance_types = $v' <<< "${overrides}")
              fi

              if [[ "${DEPLOY_AURORA}" == "true" ]]; then
                  overrides=$(jq --arg v "${CLUSTER_NAME}-pg" '.locals.aurora_cluster_name = $v' <<< "${overrides}")
              fi
              if [[ "${DEPLOY_OPENSEARCH}" == "true" ]]; then
                  overrides=$(jq --arg v "${CLUSTER_NAME}-os" '.locals.opensearch_domain_name = $v' <<< "${overrides}")
              fi

              # Terraform silently ignores an unknown argument in a module
              # override block, so assert the ones we set are still there. The
              # search is scoped to the module block: the same key may legitimately
              # appear elsewhere in the file (a local, another module) and would
              # otherwise mask a removed argument.
              module_block=$(awk '/^module "eks_cluster"/ { inside = 1 }
                                 inside { print; depth += gsub(/\{/, "{"); depth -= gsub(/\}/, "}"); if (depth == 0) exit }' cluster.tf)
              if [ -z "${module_block}" ]; then
                  echo "::error::No 'module \"eks_cluster\"' block found in cluster.tf; update this action."
                  exit 1
              fi
              for key in $(jq -r '.module.eks_cluster | keys[]' <<< "${overrides}"); do
                  if ! grep -qE "^[[:space:]]*${key}[[:space:]]*=" <<< "${module_block}"; then
                      echo "::error::No '${key}' argument in the eks_cluster module block of cluster.tf;" \
                          "the CI override would be silently ignored. Update this action."
                      exit 1
                  fi
              done

              jq '.' <<< "${overrides}" | tee ci_override.tf.json

              terraform plan -no-color -var-file=terraform-cluster.tfvars -out tf.plan

        - name: Terraform Apply - Cluster
          id: apply-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              set -euo pipefail
              terraform apply -no-color tf.plan

        - name: Export Terraform Outputs - Cluster
          id: terraform_outputs_cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - Cluster
          uses: ./.github/actions/internal-terraform-drift-detect
          id: drift-detect-cluster
          with:
              working-directory: ${{ env.TF_DIR_CLUSTER }}
              plan-extra-args: |
                  -var-file=terraform-cluster.tfvars

        - name: Terraform Init - VPN
          id: init-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}vpn.tfstate"
              terraform_state_url_vpn="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-vpn=${terraform_state_url_vpn}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Generate tfvars file - VPN
          id: generate-tfvars-vpn
          if: inputs.vpn-enabled == 'true'
          shell: bash
          working-directory: ${{ env.TF_DIR_VPN }}
          run: |
              set -euo pipefail

              cat > terraform-vpn.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              vpc_id = "${{ steps.terraform_outputs_cluster.outputs.vpc_id }}"
              EOF

        - name: Terraform Plan - VPN
          id: plan-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          # Passed as env, never interpolated into the script, as in the cluster
          # plan step above.
          env:
              CLUSTER_NAME: ${{ inputs.cluster-name }}
          run: |
              set -euo pipefail

              echo "Adapting the files with input values"
              pwd
              ls

              # Same approach as the cluster plan step: override rather than edit
              # the reference file. vpn_name is a literal module argument, and
              # Terraform silently ignores an unknown argument in a module
              # override block, so check it is still there first.
              vpn_block=$(awk '/^module "vpn"/ { inside = 1 }
                                 inside { print; depth += gsub(/\{/, "{"); depth -= gsub(/\}/, "}"); if (depth == 0) exit }' vpn.tf)
              if ! grep -qE '^[[:space:]]*vpn_name[[:space:]]*=' <<< "${vpn_block}"; then
                  echo "::error::No 'vpn_name' argument in the vpn module block of vpn.tf;" \
                      "the CI override would be silently ignored. Update this action."
                  exit 1
              fi

              jq -n --arg name "${CLUSTER_NAME}-vpn" \
                  '{module: {vpn: {vpn_name: $name}}}' | tee ci_override.tf.json

              terraform plan -no-color -var-file=terraform-vpn.tfvars -out vpn.plan

        - name: Terraform Apply - VPN
          id: apply-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform apply -no-color vpn.plan

        - name: Export Terraform Outputs - VPN
          id: terraform_outputs_vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - VPN
          uses: ./.github/actions/internal-terraform-drift-detect
          if: inputs.vpn-enabled == 'true'
          id: drift-detect-vpn
          with:
              working-directory: ${{ env.TF_DIR_VPN }}
              plan-extra-args: |
                  -var-file=terraform-vpn.tfvars

        ### End of terraform

        - name: Configure VPN Client if enabled
          id: vpn
          shell: bash
          if: inputs.vpn-enabled == 'true'
          run: |
              sudo apt update
              sudo apt install -y openvpn openvpn-systemd-resolved

              client_name="my-client" # the client name is hard-coded in the reference
              config=$(echo '${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs }}' | jq -r --arg client "$client_name" '.[$client]')

              # Create a secure directory inside the GitHub workspace
              mkdir -p "$GITHUB_WORKSPACE/.vpn"
              vpn_client_config_file="$GITHUB_WORKSPACE/.vpn/client.ovpn"

              # Create the client's config file
              echo "$config" > "$vpn_client_config_file"
              echo "vpn_client_config_file=$vpn_client_config_file" | tee -a "$GITHUB_OUTPUT"

        - name: Connect to VPN
          if: inputs.vpn-enabled == 'true'
          uses: kota65535/github-openvpn-connect-action@cd2ed8a90cc7b060dc4e001143e811b5f7ea0af5 # v3.1.0
          with:
              config_file: ${{ steps.vpn.outputs.vpn_client_config_file }}
              echo_config: 'false'

        - name: Login and generate kubeconfig
          if: inputs.login == 'true'
          shell: bash
          run: |
              set -euo pipefail
              aws eks update-kubeconfig --region "${INPUTS_AWS_REGION}" --name "${INPUTS_CLUSTER_NAME}" --alias "${INPUTS_CLUSTER_NAME}"

              kubectl config current-context
              kubectl get nodes
          env:
              INPUTS_AWS_REGION: ${{ inputs.aws-region }}
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster-name }}

        - name: Apply and verify storage class
          shell: bash
          working-directory: ${{ env.TF_REF_ARCH_DIR }}
          run: |
              set -euo pipefail
              ./procedure/storageclass-configure.sh
              ./procedure/storageclass-verify.sh
