---
name: AWS Kubernetes Ingress Setup
description: Install and configure Project Contour, external-dns, and cert-manager for AWS EKS clusters

inputs:
    cluster-name:
        description: Name of the cluster (used for external-dns owner ID)
        required: true
    scenario-short-name:
        description: Short name of the scenario (used for external-dns owner ID)
        required: true
    aws-region:
        description: AWS region where the cluster is deployed
        required: true
        default: eu-west-2
    mail:
        description: Email address for Let's Encrypt certificates
        required: false
        default: admin@camunda.ie
    tld:
        description: Top-level domain for the cluster
        required: false
        default: camunda.ie
    ref-arch:
        description: Reference architecture name (eks-single-region, eks-single-region-irsa)
        required: false
        default: eks-single-region
    use-wildcard-cert:
        description: |
            Use wildcard certificate from Vault instead of ACME/Let's Encrypt.
            When true, ACME issuer is not installed and wildcard certificate is created from Vault.
        required: false
        default: 'false'
    wildcard-cert-namespace:
        description: Namespace where the wildcard TLS certificate will be created (when use-wildcard-cert is true)
        required: false
        default: camunda
    wildcard-cert-secret-name:
        description: Name of the wildcard TLS secret to create (when use-wildcard-cert is true)
        required: false
        default: camunda-tls
    vault-addr:
        description: Vault server address (required when use-wildcard-cert is true)
        required: false
    vault-role-id:
        description: Vault AppRole role ID (required when use-wildcard-cert is true)
        required: false
    vault-secret-id:
        description: Vault AppRole secret ID (required when use-wildcard-cert is true)
        required: false

runs:
    using: composite
    steps:

        - name: 🏗️ Clean cert-manager operator namespace
          uses: ./.github/actions/internal-clean-namespace
          with:
              namespace: cert-manager

        - name: 🏗️ Clean external-dns operator namespace
          uses: ./.github/actions/internal-clean-namespace
          with:
              namespace: external-dns

        - name: 🏗️ Clean contour operator namespace
          uses: ./.github/actions/internal-clean-namespace
          with:
              namespace: projectcontour

        - name: Setup ingress components for EKS cluster
          shell: bash
          run: |
              set -euo pipefail

              echo "Setting up ingress components for EKS cluster..."
              echo "Cluster: ${INPUTS_CLUSTER_NAME}-${INPUTS_SCENARIO_SHORT_NAME}"
              echo "Region: ${INPUTS_AWS_REGION}"
              echo "Mail: ${INPUTS_MAIL}"
              echo "TLD: ${INPUTS_TLD}"
              echo "Ref-arch: ${INPUTS_REF_ARCH}"
              echo "Use wildcard cert: ${INPUTS_USE_WILDCARD_CERT}"

              # Set required environment variables for ingress setup
              export REGION="${INPUTS_AWS_REGION}"
              export MAIL_OVERWRITE="${INPUTS_MAIL}"
              export TLD="${INPUTS_TLD}"

              # Source ingress setup variables
              source generic/kubernetes/single-region/procedure/export-ingress-setup-vars.sh

              # Validate that IRSA ARNs are available
              if [[ -z "$EXTERNAL_DNS_IRSA_ARN" ]]; then
                  echo "❌ ERROR: Could not retrieve external_dns_arn from Terraform outputs"
                  echo "This ARN is required for external-dns to manage Route53 DNS records."
                  echo "Ensure that the EKS cluster has been created with IRSA support."
                  exit 1
              fi
              echo "✅ Found external-dns IRSA ARN: $EXTERNAL_DNS_IRSA_ARN"

              if [[ -z "$CERT_MANAGER_IRSA_ARN" ]]; then
                  echo "❌ ERROR: Could not retrieve cert_manager_arn from Terraform outputs"
                  echo "This ARN is required for cert-manager to perform DNS-01 ACME challenges."
                  echo "Ensure that the EKS cluster has been created with IRSA support."
                  exit 1
              fi
              echo "✅ Found cert-manager IRSA ARN: $CERT_MANAGER_IRSA_ARN"

              install_script="./aws/kubernetes/${INPUTS_REF_ARCH}/procedure/install-contour.sh"

              if [[ ! -f "$install_script" ]]; then
                  echo "❌ ERROR: Contour install script not found: $install_script" >&2
                  echo "Contour is not available for ref-arch '${INPUTS_REF_ARCH}'." >&2
                  exit 1
              fi

              echo "Installing Project Contour via $install_script ..."
              "$install_script"

              # Tag the ingress controller load balancer for the AWS MAP program.
              # The NLB is provisioned by the in-tree AWS cloud provider from the Service
              # object, so it does not inherit the Terraform provider default_tags that
              # carry the map-migrated tag. The tag is applied here, in CI only, so the
              # reference procedures (which are rendered in the docs) stay free of
              # Camunda's MAP id; the cloud provider then propagates it onto the NLB.
              map_lb_service="contour-envoy"
              map_lb_namespace="projectcontour"
              # install-contour.sh does not pass --wait, so the Service may not exist yet.
              for _ in $(seq 1 30); do
                  kubectl get service "$map_lb_service" --namespace "$map_lb_namespace" >/dev/null 2>&1 && break
                  sleep 2
              done
              if ! kubectl get service "$map_lb_service" --namespace "$map_lb_namespace" >/dev/null 2>&1; then
                  echo "❌ ERROR: service ${map_lb_service} did not appear in namespace ${map_lb_namespace} within 60s of installing Contour." >&2
                  exit 1
              fi
              echo "Tagging ${map_lb_service} (${map_lb_namespace}) load balancer with map-migrated for AWS MAP ..."
              kubectl annotate service "$map_lb_service" --namespace "$map_lb_namespace" --overwrite \
                  'service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags=map-migrated=migARUADZHVWZ'

              # Install external-dns
              echo "Installing external-dns..."
              export EXTERNAL_DNS_OWNER_ID="external-dns-${INPUTS_CLUSTER_NAME}-${INPUTS_SCENARIO_SHORT_NAME}"
              ./aws/kubernetes/${INPUTS_REF_ARCH}/procedure/install-external-dns.sh

              # Install cert-manager CRDs
              echo "Installing cert-manager CRDs..."
              ./generic/kubernetes/single-region/procedure/install-cert-manager-crds.sh

              echo "Installing cert-manager..."
              ./aws/kubernetes/${INPUTS_REF_ARCH}/procedure/install-cert-manager.sh

              echo "Installing ACME/Let's Encrypt issuer..."
              ./aws/kubernetes/${INPUTS_REF_ARCH}/procedure/install-cert-manager-issuer.sh

              if [[ "${INPUTS_USE_WILDCARD_CERT}" == "true" ]]; then
                  echo "🩹 Wildcard cert in use — patching cert-manager to drop ingress-shim default issuer"
                  echo "   (keeps ClusterIssuer/letsencrypt installed but stops auto-Certificates from"
                  echo "    'kubernetes.io/tls-acme' annotations, so sub-charts cannot burn LE quota)"

                  current_args=$(kubectl -n cert-manager get deployment cert-manager \
                      -o json | jq -c '.spec.template.spec.containers[0].args // []')
                  new_args=$(jq -cn --argjson a "$current_args" \
                      '$a | map(select(test("^--default-issuer-(name|kind|group)=") | not))')

                  if [[ "$current_args" == "$new_args" ]]; then
                      echo "ℹ️  cert-manager controller already has no default-issuer args — nothing to patch"
                  else
                      kubectl -n cert-manager patch deployment cert-manager --type=json \
                          -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/args\",\"value\":${new_args}}]"
                      kubectl -n cert-manager rollout status deployment cert-manager --timeout=2m
                  fi
              fi

              echo "✅ Ingress setup completed successfully for EKS cluster."
          env:
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster-name }}
              INPUTS_SCENARIO_SHORT_NAME: ${{ inputs.scenario-short-name }}
              INPUTS_AWS_REGION: ${{ inputs.aws-region }}
              INPUTS_MAIL: ${{ inputs.mail }}
              INPUTS_TLD: ${{ inputs.tld }}
              INPUTS_REF_ARCH: ${{ inputs.ref-arch }}
              INPUTS_USE_WILDCARD_CERT: ${{ inputs.use-wildcard-cert }}

        - name: 🔐 Setup wildcard TLS certificate from Vault
          if: ${{ inputs.use-wildcard-cert == 'true' }}
          uses: ./.github/actions/kubernetes-wildcard-certificate
          with:
              tld: ${{ inputs.tld }}
              namespace: ${{ inputs.wildcard-cert-namespace }}
              secret-name: ${{ inputs.wildcard-cert-secret-name }}
              vault-addr: ${{ inputs.vault-addr }}
              vault-role-id: ${{ inputs.vault-role-id }}
              vault-secret-id: ${{ inputs.vault-secret-id }}
