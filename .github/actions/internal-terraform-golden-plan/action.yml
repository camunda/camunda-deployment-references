---
name: Terraform Golden Plan Comparison

description: >
    This GitHub Action compares the generated Terraform plan with a golden file.
    It regenerates the golden file, uploads the result, checks for differences,
    and comments on the PR if changes are detected. If no changes exist, it removes
    any previous diff comment.

inputs:
    module-dir:
        description: Module Directory
        required: true
    s3-bucket-region:
        description: S3 Bucket Region
        required: true
    s3-backend-bucket:
        description: S3 Backend Bucket
        required: true
    s3-bucket-key:
        description: S3 Bucket Key
        required: true

runs:
    using: composite
    steps:
        - name: Compute golden
          shell: bash
          id: golden-prepare
          run: |
              set -euo pipefail

              just regenerate-golden-file "${INPUTS_MODULE_DIR}" "${INPUTS_S3_BUCKET_REGION}" \
                 "${INPUTS_S3_BACKEND_BUCKET}" "${INPUTS_S3_BUCKET_KEY}" "./compare/"

              module_dir="${INPUTS_MODULE_DIR}"
              module_dir_key="${module_dir//\//-}"
              # Remove trailing . and -
              module_dir_key=$(echo "$module_dir_key" | sed 's/^[.-]*//;s/[-.]*$//')
              echo "module_dir_key=$module_dir_key" | tee -a "$GITHUB_OUTPUT"
          env:
              INPUTS_MODULE_DIR: ${{ inputs.module-dir }}
              INPUTS_S3_BUCKET_REGION: ${{ inputs.s3-bucket-region }}
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}
              INPUTS_S3_BUCKET_KEY: ${{ inputs.s3-bucket-key }}

        - name: Upload pipeline golden result
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
          with:
              name: ${{ steps.golden-prepare.outputs.module_dir_key }}
              path: ${{ inputs.module-dir }}compare/tfplan-golden.json
              retention-days: 1

        - name: Compare Terraform plan with golden file
          shell: bash
          # no caller of this action runs on pull_request_target or workflow_run
          run: |  # zizmor: ignore[github-env]
              set -euo pipefail

              delta "${INPUTS_MODULE_DIR}test/golden/tfplan-golden.json" "${INPUTS_MODULE_DIR}compare/tfplan-golden.json"
              delta_exit_code=$?
              echo "delta_exit_code=$delta_exit_code" | tee -a "$GITHUB_ENV"
              exit $delta_exit_code
          env:
              INPUTS_MODULE_DIR: ${{ inputs.module-dir }}

        - name: Manage Terraform diff comment
          if: always() && github.event_name == 'pull_request'
          shell: bash
          # no caller of this action runs on pull_request_target or workflow_run
          run: |  # zizmor: ignore[github-env]
              set -euo pipefail

              # The module directory is passed to jq as data, so the program stays a
              # constant and a quote or a backslash in the path cannot rewrite it.
              diff_comment_ids=$(gh pr view "${PR_NUMBER}" --json comments \
                  | jq -r --arg marker "## Module ${INPUTS_MODULE_DIR} - Terraform Golden Plan Diff" \
                      '.comments[] | select(.author.login == "github-actions" and (.body | startswith($marker))) | .url | sub(".*#issuecomment-"; "")')

              has_diff=false
              if [[ "${delta_exit_code:-}" != "0" ]]; then
                  has_diff=true
              fi

              keep_first=$has_diff
              for comment_id in $diff_comment_ids; do
                  if [[ "$keep_first" == "true" ]]; then
                      echo "Keeping diff comment #$comment_id"
                      keep_first=false
                      continue
                  fi
                  echo "Deleting diff comment #$comment_id"
                  gh api --method DELETE -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/issues/comments/$comment_id"
              done

              echo "update_or_create_diff_comment=$has_diff" | tee -a "$GITHUB_ENV"
          env:
              INPUTS_MODULE_DIR: ${{ inputs.module-dir }}
              PR_NUMBER: ${{ github.event.pull_request.number }}

        - name: Compute diff
          id: diff
          if: always() && github.event_name == 'pull_request' && env.update_or_create_diff_comment == 'true'
          uses: int128/diff-action@aa894cae567a18b54a7c920fb17773db2c58f355 # v2
          with:
              base: ${{ inputs.module-dir }}test/golden/tfplan-golden.json
              head: ${{ inputs.module-dir }}compare/tfplan-golden.json

        - name: Post diff on PR
          if: always() && github.event_name == 'pull_request' && env.update_or_create_diff_comment == 'true'
          uses: int128/comment-action@f48c228ccb7b328203774301f738243579d65e9c # v1
          with:
              update-if-exists: replace
              post: |
                  ## Module ${{ inputs.module-dir }} - Terraform Golden Plan Diff
                  ${{ steps.diff.outputs.comment-body || 'No diff' }}

                  🖲 **Check the delta diff**
                  in the [workflow run](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}) for a detailed comparison.

                  If the changes are expected, you can use the uploaded artifact on the workflow to update the golden file on your branch.

                  📟 **Alternatively, run the following command locally** to update the golden file:
                  ```sh
                  just regenerate-golden-file "${{ inputs.module-dir }}" "${{ inputs.s3-bucket-region }}" "${{ inputs.s3-backend-bucket }}" "${{ inputs.s3-bucket-key }}"
                  ```
