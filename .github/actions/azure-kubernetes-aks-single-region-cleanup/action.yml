---
name: Delete Azure AKS Single Region Clusters

description: |
    This GitHub Action automates the deletion of azure/kubernetes/aks-single-region reference architecture clusters using a shell script.

inputs:
    tf-bucket:
        description: Bucket containing the clusters states
        required: true

    tf-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on AWS_REGION

    tf-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''

    max-age-hours-cluster:
        description: Maximum age of clusters in hours
        default: '12'

    target:
        description: Resource group target, specify an ID to destroy specific resources or "all" to destroy all resources
        default: all

runs:
    using: composite
    steps:

        - name: Install asdf tools with cache
          uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

        - name: Delete clusters
          id: delete_clusters
          shell: bash
          run: |
              if [ -n "${INPUTS_TF_BUCKET_REGION}" ]; then
                export AWS_S3_REGION="${INPUTS_TF_BUCKET_REGION}"
              fi

              # Use repo .tool-version as global version
              cp .tool-versions ~/.tool-versions

              ${{ github.action_path }}/scripts/destroy-clusters.sh "${INPUTS_TF_BUCKET}" \
                ${INPUTS_MAX_AGE_HOURS_CLUSTER} ${INPUTS_TARGET} ${INPUTS_TF_BUCKET_KEY_PREFIX}
          env:
              INPUTS_TF_BUCKET_REGION: ${{ inputs.tf-bucket-region }}
              INPUTS_TF_BUCKET: ${{ inputs.tf-bucket }}
              INPUTS_MAX_AGE_HOURS_CLUSTER: ${{ inputs.max-age-hours-cluster }}
              INPUTS_TARGET: ${{ inputs.target }}
              INPUTS_TF_BUCKET_KEY_PREFIX: ${{ inputs.tf-bucket-key-prefix }}

        # Required for matrix jobs: without it, every scenario would upload the same
        # artifact name and the upload would fail on conflict.
        - name: Convert key prefix into slug
          id: key-prefix-slug
          if: always()
          shell: bash
          run: |
              set -euo pipefail
              SLUG=$(echo "${INPUTS_TF_BUCKET_KEY_PREFIX}" | tr '/' '-' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              echo "PREFIX_SLUG=${SLUG%-}" | tee -a "$GITHUB_OUTPUT"
          env:
              INPUTS_TF_BUCKET_KEY_PREFIX: ${{ inputs.tf-bucket-key-prefix }}

        - name: Upload cleanup logs
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          with:
              name: logs-${{ github.action }}-${{ github.job }}-${{ inputs.target }}-${{ steps.key-prefix-slug.outputs.PREFIX_SLUG }}
              path: ./logs/
              retention-days: 7
