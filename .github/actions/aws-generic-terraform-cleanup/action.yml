---
name: Delete AWS Resources with Terraform

description: |
    This GitHub Action automates the deletion of generic terraform resources using a shell script.

inputs:
    tf-bucket:
        description: Bucket containing the resources
        required: true

    tf-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on AWS_REGION

    tf-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''

    max-age-hours:
        description: Maximum age of the resources in hours
        default: '12'

    target:
        description: Specify an ID to destroy specific resources or "all" to destroy all resources
        default: all

    fail-on-not-found:
        description: Whether to fail if no matching resources are found (only for target not 'all')
        default: 'true'

    modules-order:
        description: Destruction order of modules, e.g. "vpn,cluster" or "cluster,vpn"
        required: true

    openshift:
        description: Whether to install OpenShift tooling (ROSA CLI + oc)
        default: 'false'

    rosa-cli-version:
        description: Version of the ROSA CLI to use
        default: latest

    openshift-version:
        description: Version of the OpenShift to install
        required: true
        # renovate: datasource=custom.rosa-camunda depName=red-hat-openshift versioning=semver
        default: 4.22.5

    delete-ghost-rosa-clusters:
        description: Specify whether to delete ghost rosa clusters (true or false)
        default: 'false'

    destroy-pass-timeout-minutes:
        description: |
            Wall-clock budget for each of the two destroy passes. The caller's step-level
            `timeout-minutes` must exceed twice this value plus room for the ghost pass and
            the log upload, otherwise the runner kills the step before it can report anything.
            The default is sized for the cleanup workflows' `timeout-minutes: 125`.
        default: '55'

outputs:
    stuck-rosa-clusters:
        description: >-
            Comma-separated names of the ROSA clusters this run stopped trying to delete because they
            have been on the cleanup's candidate list for longer than the threshold (24h by default).
            OCM still owns their teardown, so they are reported rather than failing the cleanup.
            Empty when nothing is stuck.
        value: ${{ steps.delete_resources.outputs.stuck_clusters }}

runs:
    using: composite
    steps:

        - name: Install asdf tools with cache
          uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

        - name: Install Cloud Nuke for retry
          shell: bash
          working-directory: /tmp
          env:
              # renovate: datasource=github-tags depName=gruntwork-io/cloud-nuke
              CLOUD_NUKE_VERSION: v0.52.0
          run: |
              curl -LO \
                  --retry 5 \
                  --max-time 15 \
                  --retry-delay 30 \
                  https://github.com/gruntwork-io/cloud-nuke/releases/download/${{ env.CLOUD_NUKE_VERSION }}/cloud-nuke_linux_amd64
              chmod +x cloud-nuke_linux_amd64
              mv cloud-nuke_linux_amd64 /usr/local/bin/cloud-nuke

        - name: Install ROSA CLI
          if: ${{ inputs.openshift == 'true' }}
          shell: bash
          working-directory: /tmp
          run: |
              set -euo pipefail

              curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/rosa/${INPUTS_ROSA_CLI_VERSION}/rosa-linux.tar.gz"
              tar -xvf rosa-linux.tar.gz
              sudo mv rosa /usr/local/bin/rosa
              chmod +x /usr/local/bin/rosa
              rm -f rosa-linux.tar.gz
              rosa version
          env:
              INPUTS_ROSA_CLI_VERSION: ${{ inputs.rosa-cli-version }}

        - name: Install CLI tools from OpenShift Mirror
          if: ${{ inputs.openshift == 'true' }}
          uses: redhat-actions/openshift-tools-installer@ebd96c3fc72fc10a62663eac5e1421192152e6aa # v2
          with:
              oc: ${{ inputs.openshift-version }}

        - name: Delete Resources
          id: delete_resources
          shell: bash
          env:
              OPENSHIFT: ${{ inputs.openshift }}   # as an indicator in the script whether EKS vs ROSA
              DISABLE_TELEMETRY: true # Disable telemetry for cloud-nuke
              INPUTS_TF_BUCKET_REGION: ${{ inputs.tf-bucket-region }}
              INPUTS_TF_BUCKET: ${{ inputs.tf-bucket }}
              INPUTS_MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
              INPUTS_TARGET: ${{ inputs.target }}
              INPUTS_MODULES_ORDER: ${{ inputs.modules-order }}
              INPUTS_TF_BUCKET_KEY_PREFIX: ${{ inputs.tf-bucket-key-prefix }}
              INPUTS_FAIL_ON_NOT_FOUND: ${{ inputs.fail-on-not-found }}
              INPUTS_DELETE_GHOST_ROSA_CLUSTERS: ${{ inputs.delete-ghost-rosa-clusters }}
              # Where cleanup-ghost-rosa-clusters.sh records when it first saw each
              # candidate. OCM exposes no deletion-start timestamp, so without a
              # store that outlives the run there is no way to tell a cluster Red Hat
              # is still working through from one it has given up on. It rides in the
              # terraform state bucket the cleanup already reads and writes; the key
              # has no `/tfstate-<id>/` segment, so the destroy pass skips over it.
              STUCK_STATE_BUCKET: ${{ inputs.tf-bucket }}
              STUCK_STATE_KEY: ${{ inputs.tf-bucket-key-prefix }}ghost-rosa-cluster-deletion-state.json
              INPUTS_DESTROY_PASS_TIMEOUT_MINUTES: ${{ inputs.destroy-pass-timeout-minutes }}
              ACTION_PATH: ${{ github.action_path }}
          run: |
              set -euo pipefail

              # The ROSA CLI is only installed when openshift is true, so a caller
              # asking for the ghost pass without it would fail on `rosa: command
              # not found` after the destroy, or — the way it actually happened —
              # never notice the repair was not wired up at all.
              if [ "${INPUTS_DELETE_GHOST_ROSA_CLUSTERS}" == "true" ] && [ "${OPENSHIFT}" != "true" ]; then
                echo "::error::delete-ghost-rosa-clusters needs openshift: 'true'; the ROSA CLI is only installed then."
                exit 1
              fi

              if [ -n "${INPUTS_TF_BUCKET_REGION}" ]; then
                export AWS_S3_REGION="${INPUTS_TF_BUCKET_REGION}"
              fi

              # Use repo .tool-version as global version
              cp .tool-versions ~/.tool-versions

              # Both passes are bounded, because an unbounded first pass can eat the
              # caller's entire step budget. On 2026-08-29 the EC2 and ECS cleanups spent
              # 109 of their 125 minutes on pass 1, then the runner killed the step
              # mid-destroy: no verdict, no uploaded log, and — worst of all — the
              # cloud-nuke pass, which exists precisely for the resources terraform cannot
              # delete on its own, never started. A pass that runs out of budget is a
              # result too, so long as the step survives to act on it.
              run_destroy_pass() {
                local label="$1" status=0

                # --kill-after: terraform ignoring TERM must not outlive the budget either.
                timeout --signal=TERM --kill-after=2m "${INPUTS_DESTROY_PASS_TIMEOUT_MINUTES}m" \
                  "${ACTION_PATH}/scripts/destroy-resources.sh" "${INPUTS_TF_BUCKET}" \
                  ${INPUTS_MAX_AGE_HOURS} ${INPUTS_TARGET} ${INPUTS_MODULES_ORDER} ${INPUTS_TF_BUCKET_KEY_PREFIX} \
                  $([[ "${INPUTS_FAIL_ON_NOT_FOUND}" == "true" ]] && echo "--fail-on-not-found") || status=$?

                if [ "$status" -eq 124 ]; then
                  echo "::warning::${label} exhausted its ${INPUTS_DESTROY_PASS_TIMEOUT_MINUTES}m budget and was stopped;" \
                       "see the uploaded cleanup logs for the module it was still on."
                fi
                return "$status"
              }

              # First attempt without RETRY_DESTROY
              destroy_status=0
              echo "🚀 First attempt: Running destroy without cloud-nuke retry..."
              if run_destroy_pass "the first destroy pass"; then
                  echo "✅ Destroy succeeded without retry"
              else
                  echo "⚠️  First attempt failed, retrying with cloud-nuke..."
                  # RETRY_DESTROY enables cloud-nuke to clean up resources created outside of Terraform
                  # such as Load Balancers created by ingress-nginx, EBS volumes, etc.
                  export RETRY_DESTROY='true'
                  run_destroy_pass "the cloud-nuke destroy pass" || destroy_status=$?
                  unset RETRY_DESTROY
              fi

              # The ghost pass repairs the very thing that makes the destroy above
              # fail: a ROSA cluster whose installer role is gone cannot be deleted
              # by OCM, so terraform cannot delete it either. Under `set -e` the
              # unguarded retry used to end the step here, leaving the repair
              # unreachable in exactly the situation it exists for. Record the
              # status instead and report it once both passes have run.
              ghost_status=0
              if [ "${INPUTS_DELETE_GHOST_ROSA_CLUSTERS}" == "true" ]; then
                ${ACTION_PATH}/scripts/cleanup-ghost-rosa-clusters.sh ${INPUTS_MAX_AGE_HOURS} || ghost_status=$?
              fi

              if [ "$destroy_status" -ne 0 ]; then
                echo "::error::Destroy failed (exit ${destroy_status}) even after the cloud-nuke retry."
              fi
              if [ "$ghost_status" -ne 0 ]; then
                echo "::error::Ghost ROSA cluster cleanup failed (exit ${ghost_status})."
              fi
              if [ "$destroy_status" -ne 0 ] || [ "$ghost_status" -ne 0 ]; then
                exit 1
              fi

        # Required for matrix jobs
        - name: Convert key prefix into slug
          id: key-prefix-slug
          # The upload below is `always()`, so this has to be too: skipping it on a failed
          # destroy leaves the artifact name without its prefix, and two matrix legs
          # failing together would then race for the same name — losing the logs in the
          # one case they are worth reading.
          if: always()
          shell: bash
          run: |
              set -euo pipefail
              SLUG=$(echo "${INPUTS_TF_BUCKET_KEY_PREFIX}" | tr '/' '-' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              echo "PREFIX_SLUG=${SLUG::-1}" | tee -a "$GITHUB_OUTPUT"
          env:
              INPUTS_TF_BUCKET_KEY_PREFIX: ${{ inputs.tf-bucket-key-prefix }}

        - name: Upload cleanup logs
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          with:
              name: logs-${{ github.action }}-${{ github.job }}-${{ inputs.target }}-${{ steps.key-prefix-slug.outputs.PREFIX_SLUG }}
              path: ./logs/
              retention-days: 7
