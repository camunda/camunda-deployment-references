---
name: Deploy AWS ROSA HCP Single Region Cluster

description: |
    This GitHub Action automates the deployment of the aws/openshift/rosa-hcp-single-region reference architecture cluster using Terraform.
    This action will also install oc, awscli, rosa cli.
    The kube context will be set on the created cluster.
    If the cluster is private, a VPN setup can also be configured.

inputs:
    rh-token:
        description: Red Hat Hybrid Cloud Console Token
        required: true
    cluster-name:
        description: Name of the ROSA cluster to deploy
        required: true
    admin-username:
        description: Admin username for the ROSA cluster
        default: kube-admin
        required: true
    aws-region:
        description: AWS region where the ROSA cluster will be deployed
        required: true
    availability-zones:
        description: Comma separated list of availability zones (letters only, e.g., a,b,c)
        required: true
        default: a,b,c
    rosa-cli-version:
        description: Version of the ROSA CLI to use
        required: true
        default: latest
    openshift-version:
        description: Version of the OpenShift to install
        required: true
        # renovate: datasource=custom.rosa-camunda depName=red-hat-openshift versioning=semver
        default: 4.22.5
    replicas:
        description: Number of replicas for the ROSA cluster (empty will fallback on default value of the module)
        default: ''
    private-vpc:
        description: The VPC within which the cluster resides will only have private subnets, meaning that it cannot be accessed at all from the public
            Internet (empty will fallback on default value of the module)
        default: ''
    s3-backend-bucket:
        description: Name of the S3 bucket to store Terraform state
        required: true
    s3-bucket-region:
        description: Region of the bucket containing the resources states, if not set, will fallback on aws-region
    s3-bucket-key-prefix:
        description: Key prefix of the bucket containing the resources states. It must contain a / at the end e.g 'my-prefix/'.
        default: ''
    tf-modules-revision:
        description: Git revision of the tf modules to use
        default: main
        required: true
    tf-modules-path:
        description: Path where the tf rosa modules will be cloned
        default: ./.action-tf-modules/aws-openshift-rosa-hcp-single-region-create/
        required: true
    login:
        description: Authenticate the current kube context on the created cluster
        default: 'true'
        required: true
    cleanup-tf-modules-path:
        description: Whether to clean up the tf modules path
        default: 'false'
    tags:
        description: Tags to apply to the cluster and related resources, in JSON format
        default: '{}'

    vpn-enabled:
        description: Enable VPN setup module (recommended when private_vpc is true), this will also configure the current runner to use it
        default: 'false'

outputs:
    openshift-server-api:
        description: The server API URL of the deployed ROSA cluster
        value: ${{ steps.cluster_info.outputs.cluster_api }}

    openshift-cluster-id:
        description: The ID of the deployed ROSA cluster
        value: ${{ steps.terraform_outputs_cluster.outputs.cluster_id }}

    terraform-state-url-cluster:
        description: URL of the module "cluster" Terraform state file in the S3 bucket
        value: ${{ steps.init-cluster.outputs.terraform-state-url-cluster }}

    terraform-state-url-vpn:
        description: URL of the module "vpn" Terraform state file in the S3 bucket
        value: ${{ steps.init-vpn.outputs.terraform-state-url-vpn }}


    vpn-client-configs:
        description: Map of VPN client configs
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs || '' }}
    vpn-client-config-file:
        description: Config file used by the VPN
        value: ${{ steps.vpn.outputs.vpn_client_config_file || '' }}
    vpn-endpoint:
        description: Endpoint of the VPN to access the created cluster
        value: ${{ steps.terraform_outputs_vpn.outputs.vpn_endpoint || '' }}


runs:
    using: composite
    steps:
        - name: Checkout Repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
              repository: camunda/camunda-deployment-references
              ref: ${{ inputs.tf-modules-revision }}
              path: ${{ inputs.tf-modules-path }}
              fetch-depth: 0

        - name: Install asdf tools with cache for the project
          uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

        # TODO: when available on asdf, migrate this to it
        - name: Install ROSA CLI
          shell: bash
          working-directory: /tmp
          run: |
              set -euo pipefail

              curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/rosa/${INPUTS_ROSA_CLI_VERSION}/rosa-linux.tar.gz"
              tar -xvf rosa-linux.tar.gz
              sudo mv rosa /usr/local/bin/rosa
              chmod +x /usr/local/bin/rosa
              rm -f rosa-linux.tar.gz
              rosa version
          env:
              INPUTS_ROSA_CLI_VERSION: ${{ inputs.rosa-cli-version }}

        - name: Install CLI tools from OpenShift Mirror
          uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3
          with:
              oc: ${{ inputs.openshift-version }}

        - name: Set AWS Region and associated AZs
          id: construct_azs
          shell: bash
          run: |  # zizmor: ignore[github-env]
              set -euo pipefail

              echo "AWS_REGION=${INPUTS_AWS_REGION}" | tee -a "$GITHUB_ENV"
          env:
              INPUTS_AWS_REGION: ${{ inputs.aws-region }}


        - name: Login to Red Hat Hybrid Cloud Console
          shell: bash
          run: |
              set -euo pipefail

              rosa login --token="${INPUTS_RH_TOKEN}"
              rosa whoami
          env:
              INPUTS_RH_TOKEN: ${{ inputs.rh-token }}

        - name: Verify and enable HCP ROSA on AWS Marketplace
          shell: bash
          run: |
              set -euo pipefail

              rosa verify quota
              rosa create account-roles --mode auto --yes
              rosa create ocm-role --mode auto --yes

        - name: Set Terraform variables
          id: set-terraform-variables
          shell: bash
          run: |  # zizmor: ignore[github-env]
              set -euo pipefail

              export TFSTATE_BUCKET="${INPUTS_S3_BACKEND_BUCKET}"
              export TFSTATE_BASE_KEY="${INPUTS_S3_BUCKET_KEY_PREFIX}tfstate-${INPUTS_CLUSTER_NAME}/"

              if [ -z "${INPUTS_S3_BUCKET_REGION}" ]; then
                export TFSTATE_REGION="$AWS_REGION"
              else
                export TFSTATE_REGION="${INPUTS_S3_BUCKET_REGION}"
              fi

              echo "TFSTATE_BUCKET=${TFSTATE_BUCKET}" | tee -a "$GITHUB_OUTPUT"
              echo "TFSTATE_REGION=${TFSTATE_REGION}" | tee -a "$GITHUB_OUTPUT"
              echo "TFSTATE_BASE_KEY=${TFSTATE_BASE_KEY}" | tee -a "$GITHUB_OUTPUT"

              echo "TF_DIR_CLUSTER=${INPUTS_TF_MODULES_PATH}/aws/openshift/rosa-hcp-single-region/terraform/cluster/" >> "$GITHUB_ENV"
              echo "TF_DIR_VPN=${INPUTS_TF_MODULES_PATH}/aws/openshift/rosa-hcp-single-region/terraform/vpn/" >> "$GITHUB_ENV"
          env:
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}
              INPUTS_S3_BUCKET_KEY_PREFIX: ${{ inputs.s3-bucket-key-prefix }}
              INPUTS_CLUSTER_NAME: ${{ inputs.cluster-name }}
              INPUTS_S3_BUCKET_REGION: ${{ inputs.s3-bucket-region }}
              INPUTS_TF_MODULES_PATH: ${{ inputs.tf-modules-path }}

        - name: Check if S3 bucket exists
          id: create-s3-bucket
          shell: bash
          run: |
              set -euo pipefail

              if aws s3api head-bucket --bucket ${INPUTS_S3_BACKEND_BUCKET} --region ${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }} 2>/dev/null; then
                echo "Bucket already exists"
              else
                echo "Bucket does not exist, creating..."
                aws s3api create-bucket --bucket ${INPUTS_S3_BACKEND_BUCKET} \
                    --region ${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }} \
                    --create-bucket-configuration LocationConstraint=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}
              fi

              aws s3api put-public-access-block --bucket ${INPUTS_S3_BACKEND_BUCKET} \
                --region ${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }} \
                --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          env:
              INPUTS_S3_BACKEND_BUCKET: ${{ inputs.s3-backend-bucket }}

        - name: Terraform Init - Cluster
          id: init-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          env:
              RHCS_TOKEN: ${{ inputs.rh-token }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}cluster.tfstate"
              terraform_state_url_cluster="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-cluster=${terraform_state_url_cluster}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Sanitize Tags
          id: sanitize-tags
          uses: ./.github/actions/internal-sanitize-tags
          with:
              raw-tags: ${{ inputs.tags }}

        - name: Generate tfvars file - Cluster
          id: generate-tfvars-cluster
          shell: bash
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          run: |
              set -euo pipefail

              cat > terraform.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              EOF

        - name: Terraform Plan - Cluster
          id: plan-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          # Passed as env, never interpolated into the script: the values reach
          # jq as data, so nothing below has to be quoted or escaped.
          env:
              RHCS_TOKEN: ${{ inputs.rh-token }}
              CLUSTER_NAME: ${{ inputs.cluster-name }}
              ADMIN_USERNAME: ${{ inputs.admin-username }}
              OPENSHIFT_VERSION: ${{ inputs.openshift-version }}
              AVAILABILITY_ZONES: ${{ inputs.availability-zones }}
              REPLICAS: ${{ inputs.replicas }}
              PRIVATE_VPC: ${{ inputs.private-vpc }}
          shell: bash
          run: |
              set -euo pipefail

              echo "Adapting the files with input values"
              pwd
              ls

              # Terraform's own override mechanism, rather than rewriting in place
              # the reference files we ship to users. Terraform *rejects* an
              # override for a local that no longer exists ("An override file can
              # only override a local value that was already defined in a primary
              # configuration file"), so a rename in the reference architecture
              # fails the plan loudly instead of silently testing the reference
              # defaults.
              #
              # Module arguments are merged rather than validated, so those get an
              # explicit presence check below.
              #
              # Building the file with jq keeps every value literal: no quoting,
              # no regex, no shell interpolation.
              zones=$(jq -n --arg region "${AWS_REGION}" --arg letters "${AVAILABILITY_ZONES}" \
                  '[$letters | split(",") | .[] | sub("^\\s+";"") | sub("\\s+$";"") | select(length > 0) | $region + .]')
              if ! jq -e 'length > 0' <<< "${zones}" > /dev/null; then
                  echo "::error::availability-zones resolved to an empty list (got '${AVAILABILITY_ZONES}')."
                  exit 1
              fi

              overrides=$(jq -n \
                  --arg name "${CLUSTER_NAME}" \
                  --arg admin "${ADMIN_USERNAME}" \
                  --argjson zones "${zones}" \
                  --arg version "${OPENSHIFT_VERSION}" \
                  '{
                      locals: {
                          rosa_cluster_name: $name,
                          rosa_admin_username: $admin,
                          rosa_cluster_zones: $zones
                      },
                      module: { rosa_cluster: { openshift_version: $version } }
                  }')

              if [ -n "${REPLICAS}" ]; then
                  # jq --argjson would reject a leading zero with an opaque parse
                  # error, so constrain the shape here and keep the clear message.
                  if ! [[ "${REPLICAS}" =~ ^[1-9][0-9]*$ ]]; then
                      echo "::error::Invalid replicas '${REPLICAS}'; expected a positive integer."
                      exit 1
                  fi
                  overrides=$(jq --argjson v "${REPLICAS}" '.module.rosa_cluster.replicas = $v' <<< "${overrides}")
              else
                  echo "No replicas value provided, keeping the reference default."
              fi

              if [ -n "${PRIVATE_VPC}" ]; then
                  case "${PRIVATE_VPC}" in
                    true|false) ;;
                    *)
                      echo "::error::Invalid private-vpc '${PRIVATE_VPC}'; expected the boolean true or false."
                      exit 1
                      ;;
                  esac
                  overrides=$(jq --argjson v "${PRIVATE_VPC}" '.locals.rosa_private_cluster = $v' <<< "${overrides}")
              else
                  echo "No private-vpc value provided, keeping the reference default."
              fi

              # Terraform silently ignores an unknown argument in a module
              # override block, so assert the ones we set are still there. The
              # search is scoped to the module block: the same key may legitimately
              # appear elsewhere in the file (a local, another module) and would
              # otherwise mask a removed argument.
              module_block=$(awk '/^module "rosa_cluster"/ { inside = 1 }
                                 inside { print; depth += gsub(/\{/, "{"); depth -= gsub(/\}/, "}"); if (depth == 0) exit }' cluster.tf)
              if [ -z "${module_block}" ]; then
                  echo "::error::No 'module \\"rosa_cluster\\"' block found in cluster.tf; update this action."
                  exit 1
              fi
              for key in $(jq -r '.module.rosa_cluster | keys[]' <<< "${overrides}"); do
                  if ! grep -qE "^[[:space:]]*${key}[[:space:]]*=" <<< "${module_block}"; then
                      echo "::error::No '${key}' argument in the rosa_cluster module block of cluster.tf;" \
                          "the CI override would be silently ignored. Update this action."
                      exit 1
                  fi
              done

              jq '.' <<< "${overrides}" | tee ci_override.tf.json

              terraform plan -no-color -var-file=terraform.tfvars -out rosa.plan

        - name: Terraform Apply - Cluster
          id: apply-cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          env:
              RHCS_TOKEN: ${{ inputs.rh-token }}
          shell: bash
          run: |
              set -euo pipefail

              # Convergent apply with retry for transient ROSA HCP compute-node
              # provisioning timeouts (see the shared helper for the rationale).
              # The helper manages `errexit` locally during its retries.
              source "${{ github.action_path }}/../../scripts/rosa-hcp-convergent-apply.sh"
              rosa_hcp_convergent_apply rosa.plan terraform.tfvars

        - name: Export Terraform Outputs - Cluster
          id: terraform_outputs_cluster
          working-directory: ${{ env.TF_DIR_CLUSTER }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - Cluster
          uses: ./.github/actions/internal-terraform-drift-detect
          id: drift-detect-cluster
          with:
              working-directory: ${{ env.TF_DIR_CLUSTER }}
              plan-extra-args: |
                  -var-file=terraform.tfvars
              fail-on-drift: 'false' # not failing on drift as there may be an expected drift due to hcp module drifting - cluster_console_url
          env:
              RHCS_TOKEN: ${{ inputs.rh-token }}

        - name: Terraform Init - VPN
          id: init-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform_state_key="${{ steps.set-terraform-variables.outputs.TFSTATE_BASE_KEY }}vpn.tfstate"
              terraform_state_url_vpn="s3://${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}/$terraform_state_key"
              echo "terraform-state-url-vpn=${terraform_state_url_vpn}" | tee -a "$GITHUB_OUTPUT"

              terraform version

              terraform init \
                -backend-config="bucket=${{ steps.set-terraform-variables.outputs.TFSTATE_BUCKET }}" \
                -backend-config="key=$terraform_state_key" \
                -backend-config="region=${{ steps.set-terraform-variables.outputs.TFSTATE_REGION }}"

              terraform validate -no-color

        - name: Generate tfvars file - VPN
          id: generate-tfvars-vpn
          shell: bash
          working-directory: ${{ env.TF_DIR_VPN }}
          run: |
              set -euo pipefail

              cat > terraform.tfvars <<EOF
              default_tags = ${{ steps.sanitize-tags.outputs.sanitized_tags }}
              vpc_id="${{ steps.terraform_outputs_cluster.outputs.vpc_id }}"
              EOF

        - name: Terraform Plan - VPN
          id: plan-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          # Passed as env, never interpolated into the script, as in the cluster
          # plan step above.
          env:
              CLUSTER_NAME: ${{ inputs.cluster-name }}
          run: |
              set -euo pipefail

              echo "Adapting the files with input values"
              pwd
              ls

              # Same approach as the cluster plan step: override rather than edit
              # the reference file. vpn_name is a literal module argument, and
              # Terraform silently ignores an unknown argument in a module
              # override block, so check it is still there first — scoped to the
              # module block, so the same key elsewhere cannot mask its removal.
              vpn_block=$(awk '/^module "vpn"/ { inside = 1 }
                                 inside { print; depth += gsub(/\{/, "{"); depth -= gsub(/\}/, "}"); if (depth == 0) exit }' vpn.tf)
              if ! grep -qE '^[[:space:]]*vpn_name[[:space:]]*=' <<< "${vpn_block}"; then
                  echo "::error::No 'vpn_name' argument in the vpn module block of vpn.tf;" \
                      "the CI override would be silently ignored. Update this action."
                  exit 1
              fi

              jq -n --arg name "${CLUSTER_NAME}-vpn" \
                  '{module: {vpn: {vpn_name: $name}}}' | tee ci_override.tf.json

              terraform plan -no-color \
                -var-file=terraform.tfvars \
                -out vpn.plan

        - name: Terraform Apply - VPN
          id: apply-vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              set -euo pipefail

              terraform apply -no-color vpn.plan

        - name: Export Terraform Outputs - VPN
          id: terraform_outputs_vpn
          if: inputs.vpn-enabled == 'true'
          working-directory: ${{ env.TF_DIR_VPN }}
          shell: bash
          run: |
              source "${{ github.workspace }}/.github/scripts/gha-functions.sh"
              export_terraform_outputs

        - name: Terraform Drift Detection - VPN
          id: drift-detect-vpn
          if: inputs.vpn-enabled == 'true'
          uses: ./.github/actions/internal-terraform-drift-detect
          with:
              working-directory: ${{ env.TF_DIR_VPN }}
              plan-extra-args: |
                  -var-file=terraform.tfvars

        ### End of terraform

        - name: Retrieve cluster information
          id: cluster_info
          shell: bash
          run: |
              set -euo pipefail

              rosa describe cluster --output=json -c "${{ steps.terraform_outputs_cluster.outputs.cluster_id }}"
              export cluster_api=$(rosa describe cluster --output=json -c "${{ steps.terraform_outputs_cluster.outputs.cluster_id }}" | jq -r '.api.url')
              echo "cluster_api=$cluster_api"
              echo "cluster_api=$cluster_api" >> "$GITHUB_OUTPUT"

        - name: Configure VPN Client if enabled
          id: vpn
          shell: bash
          if: inputs.vpn-enabled == 'true'
          run: |
              sudo apt update
              sudo apt install -y openvpn openvpn-systemd-resolved

              client_name="my-client" # the client name is hard-coded in the reference
              config=$(echo '${{ steps.terraform_outputs_vpn.outputs.vpn_client_configs }}' | jq -r --arg client "$client_name" '.[$client]')

              # Create a secure directory inside the GitHub workspace
              mkdir -p "$GITHUB_WORKSPACE/.vpn"
              vpn_client_config_file="$GITHUB_WORKSPACE/.vpn/client.ovpn"

              # Create the client's config file
              echo "$config" > "$vpn_client_config_file"
              echo "vpn_client_config_file=$vpn_client_config_file" | tee -a "$GITHUB_OUTPUT"

        - name: Connect to VPN
          if: inputs.vpn-enabled == 'true'
          uses: kota65535/github-openvpn-connect-action@cd2ed8a90cc7b060dc4e001143e811b5f7ea0af5 # v3.1.0
          with:
              config_file: ${{ steps.vpn.outputs.vpn_client_config_file }}
              echo_config: 'false'

        - name: Login and generate kubeconfig
          # we need to retry due as the cluster has just been created and the OIDC provider may not be available yet
          uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
          id: kube_config
          if: inputs.login == 'true'
          with:
              timeout_minutes: 10
              max_attempts: 40
              shell: bash
              retry_wait_seconds: 15
              command: |
                  : # see https://github.com/nick-fields/retry/issues/133
                  set -o errexit
                  set -o pipefail

                  ADMIN_PASSWORD="${{ steps.terraform_outputs_cluster.outputs.rosa_admin_password }}"
                  echo "::add-mask::${ADMIN_PASSWORD}"

                  # Check if the user is already a cluster-admin
                  if ! rosa list users --cluster="${{ inputs.cluster-name }}" | grep -q "${{ inputs.admin-username }}"; then
                    rosa grant user cluster-admin --cluster="${{ inputs.cluster-name }}" --user="${{ inputs.admin-username }}"
                  else
                    echo "✅ User '${{ inputs.admin-username }}' is already a cluster-admin on '${{ inputs.cluster-name }}'."
                  fi

                  oc login --username "${{ inputs.admin-username }}" --password "${ADMIN_PASSWORD}" "${{ steps.cluster_info.outputs.cluster_api }}"
                  oc whoami

                  echo "Show existing contexts"
                  kubectl config get-contexts
                  if kubectl config get-contexts -o name | grep -qx '${{ inputs.cluster-name }}'; then
                      echo "Context '${{ inputs.cluster-name }}' already exists. No changes made."
                  else
                      echo "Renaming oc config current context to '${{ inputs.cluster-name }}'"
                      kubectl config delete-context '${{ inputs.cluster-name }}' 2>/dev/null || true
                      kubectl config rename-context "$(oc config current-context)" "${{ inputs.cluster-name }}"
                  fi

                  kubectl config use "${{ inputs.cluster-name }}"

        - name: Clean up cloned modules
          if: always() && inputs.cleanup-tf-modules-path == 'true'
          shell: bash
          run: |
              set -euo pipefail

              rm -rf "${INPUTS_TF_MODULES_PATH}"
          env:
              INPUTS_TF_MODULES_PATH: ${{ inputs.tf-modules-path }}
