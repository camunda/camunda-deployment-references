---
name: Kubernetes Ingress Cleanup
description: Clean up Project Contour, external-dns, and cert-manager components from Kubernetes clusters

inputs:
    wait-for-dns-cleanup:
        description: Whether to wait for external-dns to clean up domain records before uninstalling
        required: false
        default: 'true'
    dns-cleanup-wait-seconds:
        description: Number of seconds to wait for DNS cleanup
        required: false
        default: '45'

runs:
    using: composite
    steps:
        - name: Clean up ingress components
          shell: bash
          run: |
              set -euo pipefail

              echo "Cleaning up ingress components..."
              echo "Wait for DNS cleanup: ${INPUTS_WAIT_FOR_DNS_CLEANUP}"
              echo "DNS cleanup wait time: ${INPUTS_DNS_CLEANUP_WAIT_SECONDS} seconds"

              # Wait for external-dns to clean up domain records if requested
              if [[ "${INPUTS_WAIT_FOR_DNS_CLEANUP}" == "true" ]]; then
                  echo "Waiting for external-dns to remove domain records..."
                  sleep "${INPUTS_DNS_CLEANUP_WAIT_SECONDS}"
              fi

              # --ignore-not-found absorbs the absent case, so the fallbacks below only see real failures.
              echo "Uninstalling Contour..."
              helm uninstall contour --namespace projectcontour --wait --ignore-not-found || echo "WARNING: uninstalling contour failed; continuing cleanup"

              echo "Uninstalling external-dns..."
              helm uninstall external-dns --namespace external-dns --wait --ignore-not-found || echo "WARNING: uninstalling external-dns failed; continuing cleanup"

              echo "Uninstalling cert-manager..."
              helm uninstall cert-manager --namespace cert-manager --wait --ignore-not-found || echo "WARNING: uninstalling cert-manager failed; continuing cleanup"

              echo "Deleting projectcontour namespace..."
              kubectl delete namespace projectcontour --wait --timeout=60s --ignore-not-found || echo "WARNING: deleting namespace projectcontour failed; continuing cleanup"

              echo "Deleting external-dns namespace..."
              kubectl delete namespace external-dns --wait --timeout=60s --ignore-not-found || echo "WARNING: deleting namespace external-dns failed; continuing cleanup"

              echo "Deleting cert-manager namespace..."
              kubectl delete namespace cert-manager --wait --timeout=60s --ignore-not-found || echo "WARNING: deleting namespace cert-manager failed; continuing cleanup"

              echo "✅ Ingress components and namespaces cleanup completed successfully."
          env:
              INPUTS_WAIT_FOR_DNS_CLEANUP: ${{ inputs.wait-for-dns-cleanup }}
              INPUTS_DNS_CLEANUP_WAIT_SECONDS: ${{ inputs.dns-cleanup-wait-seconds }}
