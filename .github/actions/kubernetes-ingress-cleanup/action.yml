---
name: Kubernetes Ingress Cleanup
description: Clean up Contour, external-dns, and cert-manager components from Kubernetes clusters

inputs:
    wait-for-dns-cleanup:
        description: Whether to wait for external-dns to clean up domain records before uninstalling
        required: false
        default: 'true'
    dns-cleanup-wait-seconds:
        description: Number of seconds to wait for DNS cleanup
        required: false
        default: '45'

runs:
    using: composite
    steps:
        - name: Clean up ingress components
          shell: bash
          run: |
              set -euo pipefail

              echo "Cleaning up ingress components..."
              echo "Wait for DNS cleanup: ${INPUTS_WAIT_FOR_DNS_CLEANUP}"
              echo "DNS cleanup wait time: ${INPUTS_DNS_CLEANUP_WAIT_SECONDS} seconds"

              # Wait for external-dns to clean up domain records if requested
              if [[ "${INPUTS_WAIT_FOR_DNS_CLEANUP}" == "true" ]]; then
                  echo "Waiting for external-dns to remove domain records..."
                  sleep "${INPUTS_DNS_CLEANUP_WAIT_SECONDS}"
              fi

              # --ignore-not-found absorbs the absent case, so the failures recorded below are real.
              cleanup_failed=0

              for release in contour:projectcontour external-dns:external-dns cert-manager:cert-manager; do
                  name="${release%%:*}"
                  namespace="${release##*:}"
                  echo "Uninstalling ${name}..."
                  if ! helm uninstall "${name}" --namespace "${namespace}" --wait --ignore-not-found; then
                      echo "WARNING: uninstalling ${name} failed; continuing cleanup" >&2
                      cleanup_failed=1
                  fi
              done

              for namespace in projectcontour external-dns cert-manager; do
                  echo "Deleting ${namespace} namespace..."
                  if ! kubectl delete namespace "${namespace}" --wait --timeout=60s --ignore-not-found; then
                      echo "WARNING: deleting namespace ${namespace} failed; continuing cleanup" >&2
                      cleanup_failed=1
                  fi
              done

              if [[ "${cleanup_failed}" -ne 0 ]]; then
                  echo "❌ Ingress cleanup finished with failures; see the warnings above." >&2
                  exit 1
              fi

              echo "✅ Ingress components and namespaces cleanup completed successfully."
          env:
              INPUTS_WAIT_FOR_DNS_CLEANUP: ${{ inputs.wait-for-dns-cleanup }}
              INPUTS_DNS_CLEANUP_WAIT_SECONDS: ${{ inputs.dns-cleanup-wait-seconds }}
