---
matrix:
    distro:
        # The renovate rule below tracks the newest OpenShift release, so this
        # entry is always "latest" and must not name a minor version: renovate
        # bumps `version` and never the label, which is how the name drifts away
        # from the cluster that actually runs.
        - name: OpenShift latest
          schedule_only: false
          # renovate: datasource=custom.rosa-camunda depName=red-hat-openshift versioning=regex:^4(\.(?<minor>\d+))?(\.(?<patch>\d+))?$
          version: 4.19.41
          clusterName: op-based # cluster name for operator-based tests
          type: openshift
        - name: EKS Latest
          schedule_only: false
          clusterName: op-based-eks # cluster name for operator-based EKS tests
          type: eks

    scenario:
        - name: operator-based
          shortName: opb

    declination:
        - name: domain
          desc: Setup operator-based stack with domain configuration.
        - name: no-domain
          desc: Setup operator-based stack without domain configuration.
