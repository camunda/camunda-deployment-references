---
name: Internal - Global - Branches Schedule Workflows

# This workflow opens throwaway pull requests whose only purpose is to trigger the
# workflows listed in .github/workflows-config/workflow-scheduler.yml on a given branch.
#
# Two of its three jobs act on the repository and are therefore never run from a pull
# request:
#
#   close-scheduled-prs  closes real schedule pull requests and deletes their branches.
#   schedule-workflows   opens them, with a GitHub App token, after running the
#                        repository's own pre-commit hooks over the checked-out branch.
#
# The branch `schedule-workflows` checks out comes from the scheduler config, which
# `define-matrix` reads from the tree it is running on. On a pull request that tree is
# the contributor's, so a pull request able to reach `schedule-workflows` could aim the
# privileged checkout at its own branch and have its pre-commit hooks executed next to
# the app token. Gating both jobs on the event closes that: on `schedule` and
# `workflow_dispatch` the config and every branch it names come from the default branch.
#
# `define-matrix` still runs on pull requests -- it only parses the config, and it holds
# no credential, which is why its checkout sets `persist-credentials: false`: the asdf
# plugins it installs come from the branch's .tool-versions.

# No job writes to the repository with GITHUB_TOKEN. Both writes -- closing pull requests
# and opening them -- are carried by the App token, minted per job. `pull-requests: write`
# used to be declared here for internal-apply-skip-label, which this workflow does not use.
permissions:
    contents: read

on:
    pull_request:
        paths:
            - .github/workflows/internal_global_branches_workflow_scheduler.yml
    schedule:
        - cron: 0 * * * *   # every hour, every day
    workflow_dispatch:
        inputs:
            schedule_name:
                description: Name of the schedule to run
                required: false
                type: string

# limit to a single execution per ref of this workflow
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    close-scheduled-prs:
        runs-on: ubuntu-latest
        # Never from a pull request: this job closes live schedule pull requests and
        # deletes their branches.
        if: github.event_name != 'pull_request'
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # Load-bearing checkout: `gh` resolves the repository from the git remote
                  # below. It does not need a credential on disk to do that -- the App token
                  # is passed to `gh` through the environment.
                  persist-credentials: false

            - name: Generate token for GitHub
              id: generate-github-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@475528365f4010480dccff71ccac554cc3352e7c # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  vault-url: ${{ secrets.VAULT_ADDR }}

            - name: Close all scheduled PRs after 24h and delete associated branches
              env:
                  GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
              run: |
                  set -euo pipefail

                  prs=$(gh pr list --state "OPEN" --label "schedule" --json number,headRefName,createdAt \
                        --jq '[.[] | select((now - (.createdAt | fromdate)) > 86400)]')

                  if [[ -z "$prs" ]]; then
                    echo "No PRs found with the label 'schedule'."
                    exit 0
                  fi

                  echo "PRs with the label 'schedule': $prs"

                  # Loop through each PR in the JSON array and process it
                  echo "$prs" | jq -c '.[]' | while IFS= read -r pr; do
                    pr_number=$(echo "$pr" | jq -r '.number')
                    branch_name=$(echo "$pr" | jq -r '.headRefName')
                    echo "Closing PR #$pr_number and deleting branch $branch_name..."
                    gh pr close "$pr_number" --delete-branch
                  done

    define-matrix:
        runs-on: ubuntu-latest
        outputs:
            schedules: ${{ steps.matrix.outputs.schedules }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The asdf step below installs plugins named by the branch's
                  # .tool-versions, which is arbitrary code on a pull request run. This job
                  # holds no App token; do not leave GITHUB_TOKEN in `.git/config` for that
                  # code to find either.
                  persist-credentials: false

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

            - id: matrix
              # The dispatch input reaches the script through the environment, not through
              # template expansion: expanded inline it is pasted into the shell before bash
              # sees it, so a schedule name containing shell metacharacters would execute.
              env:
                  SCHEDULE_NAME: ${{ github.event.inputs.schedule_name || '' }}
              run: |
                  set -euo pipefail

                  # shellcheck disable=SC2086
                  schedules="$(yq '.schedules' --indent=0 --output-format json .github/workflows-config/workflow-scheduler.yml)"

                  # Convert each workflow_files array to a string format
                  formatted_schedules=$(echo "$schedules" | jq -c '.[].workflow_files |= tostring')

                  if [[ -n "${SCHEDULE_NAME:-}" ]]; then
                    # Filter schedules based on the provided workflow name
                    filtered_schedules=$(echo "$formatted_schedules" | jq -c --arg schedule_name "${SCHEDULE_NAME}" '
                    [.[] | select(.name == $schedule_name)]
                    ')
                  else
                    current_day=$(date +%A)
                    current_hour=$(date +%-H)

                    # Filter schedules based on cron_every_day and cron_every_hours
                    filtered_schedules=$(echo "$formatted_schedules" | jq -c --arg current_day "$current_day" --arg current_hour "$current_hour" '
                        [.[] | select(
                            (.cron_every_day == null or (.cron_every_day | tostring | split(",") | index($current_day))) and
                            (.cron_every_hours == null or (.cron_every_hours | tostring | split(",") | index($current_hour)))
                        )]
                    ')
                  fi

                  echo "schedules=${filtered_schedules}" | tee -a "$GITHUB_OUTPUT"

    schedule-workflows:
        runs-on: ubuntu-latest
        # Never from a pull request: this job opens live pull requests with the App token,
        # onto a branch named by a config file that a pull request run would supply.
        if: >-
            github.event_name != 'pull_request'
            && needs.define-matrix.outputs.schedules != '[]'
            && needs.define-matrix.outputs.schedules != ''
        needs:
            - define-matrix
            - close-scheduled-prs
        strategy:
            fail-fast: false
            matrix:
                schedule: ${{ fromJson(needs.define-matrix.outputs.schedules) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ matrix.schedule.branch }}
                  # The pre-commit step below executes the checked-out branch's hooks, so
                  # this job runs repository code. Nothing here needs a git credential:
                  # create-pull-request receives the App token explicitly and does its own
                  # push, and the token is not minted until after the hooks have run.
                  persist-credentials: false

            - name: Prepare the working branch
              id: branch-update
              run: |
                  set -euo pipefail

                  stringified_branch=$(echo "${{ matrix.schedule.name }}" | tr ' ' '_' | tr -cd '[:alnum:]_')
                  echo "current_branch=schedules/$stringified_branch" | tee -a "$GITHUB_OUTPUT"

            - name: Modify workflow files to trigger the PR
              run: |
                  set -euo pipefail

                  workflow_files=$(echo '${{ matrix.schedule.workflow_files }}' | jq -r '.[]')
                  echo "Removing on.pull_request.paths from $workflow_files"

                  # Loop through each workflow file and modify it using yq
                  echo "$workflow_files" | while IFS= read -r workflow_file; do
                    yq -i 'del(.on.pull_request.paths)' "$workflow_file"

                    # remove all comments in the file as yamlfmt may conflict with yamllint
                    yq -i '... comments=""' "$workflow_file"

                    # Add a comment with the schedule trigger timestamp to ensure the PR is triggered
                    echo -e "\n# Scheduled trigger: $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${{ matrix.schedule.name }}" >> "$workflow_file"
                  done

            # pre-commit/action is deliberately not used: it resolves `actions/cache@v4`, an
            # unpinned reference. GitHub evaluates "Require actions to be pinned to a full-length
            # commit SHA" over the entire dependency tree at Set up job, so every run of this
            # workflow was refused before any step could execute.
            #
            # Inlining also drops the `pip install pre-commit` the action performs, which
            # installed the latest release over the version pinned in .tool-versions.
            - name: Install asdf tools
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

            - name: Cache pre-commit hook environments
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-1|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml', '.tool-versions') }}

            - name: Reformat yaml after yq files using pre-commit
              id: pre_commit_check_first_run
              continue-on-error: true # it will fail as we reformat the files
              run: pre-commit run --show-diff-on-failure --color=always --all-files --verbose

            # Minted last, deliberately: everything above runs repository code -- asdf
            # plugins from .tool-versions, then the pre-commit hooks -- so the token is not
            # alive while any of it executes, and no hook can have planted a PATH shim or a
            # BASH_ENV able to intercept it.
            - name: Generate token for GitHub
              id: generate-github-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@475528365f4010480dccff71ccac554cc3352e7c # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  # Pin the installation token to this repository rather than relying on the
                  # composite action's default, which derives the same value from
                  # `github.repository`.
                  repositories: ${{ github.event.repository.name }}
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  vault-url: ${{ secrets.VAULT_ADDR }}

            - name: Create the schedule PR
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
              with:
                  token: ${{ steps.generate-github-token.outputs.token }}
                  branch: ${{ steps.branch-update.outputs.current_branch }}
                  base: ${{ matrix.schedule.branch }}
                  branch-suffix: random
                  delete-branch: true
                  title: '[schedule][NO MERGE] ${{ matrix.schedule.name }}'
                  body: |
                      ## 📌 Purpose of this PR
                      This PR is automatically generated to **trigger a scheduled workflow** on a specific branch. **No manual action is required.**

                      ### ⚠️ Do Not
                      🚫 **Do not modify or merge this PR.**
                      🚫 It will be automatically closed after 24 hours.

                      ### 🔍 Details
                      - This PR is used to execute scheduled workflows defined in `.github/workflows-config/workflow-scheduler.yml`.
                      - The associated workflow files have been modified to remove the `on.pull_request.paths` trigger.
                  labels: |
                      schedule
                      automated pr
                      no merge
                  draft: true

    notify-on-failure:
        runs-on: ubuntu-latest
        if: github.event_name == 'schedule' && failure()
        needs:
            - define-matrix
            - schedule-workflows
            - close-scheduled-prs
        steps:
            - name: Notify in Slack in case of failure
              id: slack-notification
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
                  slack_channel_id: ${{ github.event_name == 'schedule' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ github.event_name == 'schedule' && '@infraex-medic' || '' }}
                  disable_silence_check: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
