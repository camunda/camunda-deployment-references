---
name: Tests - Daily Cleanup - AWS OpenShift ROSA HCP Dual Region

on:
    workflow_dispatch:
        inputs:
            max_age_hours_cluster:
                description: Maximum age of clusters in hours
                required: true
                default: '12'
    pull_request:
        paths:
            - .github/workflows/aws_rosa_hcp_dual_region_daily_cleanup.yml
            - .tool-versions
            - aws/openshift/rosa-hcp-dual-region/**
            - '!aws/openshift/rosa-hcp-dual-region/terraform/*/test/golden/**'
            - .github/actions/aws-generic-terraform-cleanup/**
            - .github/actions/aws-configure-cli/**
            - .github/actions/observe-build-status/**

    schedule:
        - cron: 0 4 * * * # At 04:00 everyday.

# limit to a single execution per actor of this workflow
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # we don't cancel the previous run, so it can finish it and let clusters in a proper state
    cancel-in-progress: false

env:
    IS_SCHEDULE: ${{ (contains(github.head_ref, 'schedules/') || github.event_name == 'schedule') && 'true' || 'false' }}

    MAX_AGE_HOURS_CLUSTER: ${{ github.event.inputs.max_age_hours_cluster || '12' }}

    # please keep those variables synced with aws_rosa_hcp_tests.yml
    AWS_PROFILE: infex
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BACKEND_BUCKET_PREFIX: aws/openshift/rosa-hcp-dual-region/ # keep it synced with the name of the module for simplicity
    S3_BUCKET_REGION: eu-central-1
    CLUSTER_0_AWS_REGION: eu-west-2
    CLUSTER_1_AWS_REGION: eu-west-3


jobs:
    triage:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip

    cleanup-clusters:
        needs:
            - triage
        if: needs.triage.outputs.should_skip == 'false'
        runs-on: ubuntu-latest
        steps:
            # Telemetry must never block the job: a monitoring outage may cost a
            # duration metric, never a teardown.
            - continue-on-error: true
              uses: camunda/infra-global-github-actions/start-build-monitor@02b3f0e49b00b98fffc76af690ebc83c28f24dae # main

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

            - name: Use repo .tool-version as global version
              run: cp .tool-versions ~/.tool-versions

            - name: Set current target branch
              id: target-branch
              run: |
                  set -euo pipefail
                  TARGET_BRANCH=$(cat .target-branch)
                  echo "TARGET_BRANCH=$TARGET_BRANCH" | tee -a "$GITHUB_OUTPUT"

            - name: Import Secrets
              id: secrets
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common RH_OPENSHIFT_TOKEN;
                      secret/data/products/infrastructure-experience/ci/common SLACK_BOT_TOKEN;


            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.CLUSTER_0_AWS_REGION }}

            - name: Delete clusters
              id: delete_clusters
              continue-on-error: true
              timeout-minutes: 125
              uses: ./.github/actions/aws-generic-terraform-cleanup
              env:
                  RHCS_TOKEN: ${{ steps.secrets.outputs.RH_OPENSHIFT_TOKEN }}
                  CLUSTER_0_AWS_REGION: ${{ env.CLUSTER_0_AWS_REGION }}
                  CLUSTER_1_AWS_REGION: ${{ env.CLUSTER_1_AWS_REGION }}
              with:
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BUCKET_REGION }}
                  max-age-hours: ${{ env.MAX_AGE_HOURS_CLUSTER }}
                  tf-bucket-key-prefix: ${{ env.S3_BACKEND_BUCKET_PREFIX }}${{ steps.target-branch.outputs.TARGET_BRANCH }}/
                  modules-order: backup_bucket,peering,clusters
                  # The ghost pass works from OCM's cluster list, not from terraform
                  # state, so it is the only thing that reaches a cluster whose state
                  # is already gone. Gating it on the retry step meant it never ran
                  # for exactly those clusters: with no state left the first pass
                  # succeeds, the retry is skipped, and nothing reclaims them. The
                  # single-region workflow already sets it on both steps.
                  #
                  # openshift installs the ROSA CLI, which the ghost script needs:
                  # the action gates that install on this input, so enabling the
                  # ghost pass without it would run the script with no `rosa`
                  # binary. single-region sets both here for the same reason.
                  openshift: 'true'
                  delete-ghost-rosa-clusters: 'true'

            # The previous step has a continue-on-error set to true in case of schedule run.
            # This means that the workflow is not marked as failed, but the step is.
            # We can't use the `if: failure()` condition here, as the overall job is succeeding.
            # Instead, we check the outcome of the previous step and if it failed, we retry the deletion.
            # If the retry fails, then the slack notification will be triggered as normally.

            # There are cases where the deletion of resources fails due to dependencies.
            - name: Retry delete clusters
              id: retry_delete_clusters
              if: steps.delete_clusters.outcome == 'failure'
              timeout-minutes: 125
              uses: ./.github/actions/aws-generic-terraform-cleanup
              env:
                  RHCS_TOKEN: ${{ steps.secrets.outputs.RH_OPENSHIFT_TOKEN }}
                  CLUSTER_0_AWS_REGION: ${{ env.CLUSTER_0_AWS_REGION }}
                  CLUSTER_1_AWS_REGION: ${{ env.CLUSTER_1_AWS_REGION }}
              with:
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BUCKET_REGION }}
                  max-age-hours: 0 # the previous step alters the age and resets it to 0
                  tf-bucket-key-prefix: ${{ env.S3_BACKEND_BUCKET_PREFIX }}${{ steps.target-branch.outputs.TARGET_BRANCH }}/
                  openshift: 'true'
                  delete-ghost-rosa-clusters: 'true'
                  modules-order: backup_bucket,peering,clusters

            # A cluster the ghost pass gave up on is not a cleanup failure: OCM
            # still owns its teardown, and re-deleting it every night is what
            # turns one wedged cluster into a permanently red daily job. It gets
            # its own alert, so the failure alert below keeps meaning "something
            # the cleanup could have fixed did not get fixed".
            #
            # Byte-identical to the block in the sibling ROSA cleanup workflow:
            # the suite names itself through github.workflow, so neither copy can
            # drift into describing the other one.
            - name: Describe ROSA clusters stuck in deletion
              id: stuck_clusters
              if: ${{ !cancelled() }}
              env:
                  # The retry step's list wins when it ran, being the later
                  # observation; the first pass's list is the fallback for the
                  # runs where the retry never happened.
                  STUCK: ${{ steps.retry_delete_clusters.outputs.stuck-rosa-clusters || steps.delete_clusters.outputs.stuck-rosa-clusters }}
                  MENTION: ${{ env.IS_SCHEDULE == 'true' && ' cc @infraex-medic' || '' }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW: ${{ github.workflow }}
              run: |
                  set -euo pipefail
                  [ -n "$STUCK" ] || exit 0

                  TEXT=":hourglass_flowing_sand: *${WORKFLOW}* — cluster(s) stuck in deletion for over 24h: \`${STUCK}\`."
                  TEXT="${TEXT} OCM still owns their teardown, so the cleanup left them alone instead of failing on them; they need a look on the Red Hat console."
                  TEXT="${TEXT} <${RUN_URL}|Cleanup run>${MENTION}"

                  {
                    echo "text<<STUCK_EOF"
                    printf '%s\n' "$TEXT"
                    echo "STUCK_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Notify in Slack about ROSA clusters stuck in deletion
              if: ${{ steps.stuck_clusters.outputs.text != '' }}
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  method: chat.postMessage
                  token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
                  payload: |
                      {
                        "channel": ${{ toJSON(env.IS_SCHEDULE == 'true' && 'C076N4G1162' || 'C07E4FF6YMB') }},
                        "unfurl_links": false,
                        "unfurl_media": false,
                        "text": ${{ toJSON(steps.stuck_clusters.outputs.text) }}
                      }

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: ${{ failure() && steps.retry_delete_clusters.outcome == 'failure' }}
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
                  slack_channel_id: ${{ env.IS_SCHEDULE == 'true' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ env.IS_SCHEDULE == 'true' && '@infraex-medic' || '' }}
                  disable_silence_check: ${{ env.IS_SCHEDULE == 'true' && 'false' || 'true' }}

            - name: Observe build status
              if: always()
              continue-on-error: true
              uses: ./.github/actions/observe-build-status
              with:
                  build_status: ${{ job.status }}
                  secret_vault_address: ${{ secrets.VAULT_ADDR }}
                  secret_vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  secret_vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
