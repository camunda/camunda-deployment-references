---
name: Internal - Global - CI Events to Google Sheet

# Reports CI events (failures = alerts, non-blocking Helm drift = warnings) into
# a Google Sheet for cross-branch grouping/triage. As a workflow_run reporter it
# lives on the default branch yet observes runs from every branch.
#
# Trigger summary:
# - workflow_run : append a row per failing run + scan annotations for warnings.
# - workflow_dispatch : (re)bootstrap the sheet structure on demand.

on:
    workflow_run:
        types:
            - completed
        workflows:
            - Tests - Integration - Azure Kubernetes AKS Single Region
            - Tests - Integration - Generic Operator based
            - Tests - Integration - AWS Kubernetes EKS Single Region (IRSA)
            - Tests - Integration - AWS Kubernetes EKS Dual Region
            - Tests - Integration - AWS OpenShift ROSA HCP Single Region
            - Tests - Integration - AWS OpenShift ROSA HCP Dual Region
            - Tests - Integration - AWS Containers ECS Single Region Fargate
            - Tests - Integration - AWS Compute EC2 Single Region
            - Tests - Integration - AWS EKS/RDS/OS Modules
            - Tests - Integration - AWS EKS Multi Region RDBMS
            - Tests - Integration - Local Kubernetes Kind Single Region
            - Tests - Integration - AWS Containers ECS Dual Region Fargate
            - Tests - Integration - Teleport - AWS Kubernetes EKS Dual Region
            - Tests - Integration - AWS EKS Cluster with an AuroraDB and OpenSearch creation and destruction
            - Tests - Integration - AWS S3 bucket for Terraform backend
            - Tests - Integration - Azure Common Procedure Storage Account Creation Test
            # Lives only on stable/8.9, so .lint/reporter-coverage cannot assert
            # it from here. Watched anyway: this reporter observes every branch
            # from the default one, and a suite that exists only on a stable
            # branch goes silent exactly the same way.
            - Tests - Integration - Generic Migration from Bitnami
    workflow_dispatch:

permissions:
    contents: read
    checks: read

env:
    # The reporting spreadsheet id (not a secret; access is controlled by sharing
    # the sheet with the service account). Sheet:
    # https://docs.google.com/spreadsheets/d/1wP6u0N4KHAU_WrogputF-6rdKjtZkf-To9VZnSWJNes
    SHEET_ID: 1wP6u0N4KHAU_WrogputF-6rdKjtZkf-To9VZnSWJNes

jobs:
    bootstrap:
        name: Bootstrap sheet
        # Manual only: the bootstrap pulls Vault secrets and runs repo code, so it
        # is never wired to PR events (no secrets-exfiltration surface).
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Import Secrets
              id: secrets
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common GOOGLE_SHEETS_SA_KEY;

            - name: Bootstrap structure and dashboard
              shell: bash
              env:
                  GOOGLE_SHEETS_SA_KEY: ${{ steps.secrets.outputs.GOOGLE_SHEETS_SA_KEY }}
                  SHEET_SPREADSHEET_ID: ${{ env.SHEET_ID }}
              run: |
                  set -uo pipefail
                  python3 -m pip install --quiet --disable-pip-version-check \
                      "google-api-python-client>=2,<3" "google-auth>=2,<3"
                  python3 .github/actions/internal-report-event-to-sheet/bootstrap_sheet.py

            - name: Sheet link
              shell: bash
              run: echo "Rendering at https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit"

    report-failure:
        name: Report failing run
        # `failure` alone misses the runs that matter most. A run that never
        # dispatched a job is delivered here with `startup_failure`, and one held
        # at a gate with `action_required` -- and because such a run emits no
        # check runs, it also shows nothing on the pull request. That is how the
        # kind suite stopped running on stable/8.8 for a fortnight without a
        # single red mark anywhere (#3336). Those two conclusions are precisely
        # the ones nothing else reports, so they belong here most of all.
        if: ${{ github.event_name == 'workflow_run' && contains(fromJSON('["failure", "startup_failure", "action_required"]'), github.event.workflow_run.conclusion)
            && github.event.workflow_run.head_repository.full_name == github.repository }}
        runs-on: ubuntu-latest
        # actions: read is what lets the job count below be read at all. Without
        # it the API call 403s, the count reads as unknown, and the guard quietly
        # never fires -- the exact shape of failure it exists to catch.
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # A run that failed and a run that never started need different
            # people doing different things, so they must not land in the sheet
            # under the same category. The number of dispatched jobs is what
            # separates them, and it is only available from the API.
            - name: Count the jobs the observed run dispatched
              id: dispatched
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
              run: |
                  set -uo pipefail
                  # Attempt-scoped: the run-level endpoint reports the latest
                  # attempt, which would misjudge a rerun of an earlier one.
                  # Best-effort, and deliberately not compared arithmetically --
                  # "unknown" must not be read as zero and raise a false alarm.
                  count=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
                      --jq '.total_count' 2>/dev/null || echo "unknown")
                  # The finished title is emitted here rather than a prefix the
                  # caller concatenates: a separator split across two places is
                  # how you end up with "never started:My Workflow", and a
                  # trailing space in a key=value output is too fragile to rely
                  # on. A delimiter block, since a display title is free text.
                  if [ "${count}" = "0" ]; then
                      echo "category=ci-never-started" | tee -a "$GITHUB_OUTPUT"
                      title="never started (0 jobs dispatched): ${DISPLAY_TITLE}"
                  else
                      echo "category=ci-failure" | tee -a "$GITHUB_OUTPUT"
                      title="${DISPLAY_TITLE}"
                  fi
                  {
                    echo "title<<TITLE_EOF"
                    printf '%s\n' "${title}"
                    echo "TITLE_EOF"
                  } >> "$GITHUB_OUTPUT"
                  echo "[debug] title: ${title}"
                  echo "[debug] dispatched jobs: ${count}"
                  if [ "${count}" = "unknown" ]; then
                      # Say so rather than let the guard lapse into silence: a
                      # never-started run would be filed as an ordinary failure.
                      echo "::warning::Could not read the dispatched job count for run ${RUN_ID}; reporting it as a plain failure."
                  fi

            - name: Append failure event
              uses: ./.github/actions/internal-report-event-to-sheet
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  spreadsheet-id: ${{ env.SHEET_ID }}
                  event-type: failure
                  category: ${{ steps.dispatched.outputs.category }}
                  # A suite that never started is worse than one that failed: it
                  # proves nothing and says nothing, on any branch.
                  severity: ${{ (steps.dispatched.outputs.category == 'ci-never-started' || startsWith(github.event.workflow_run.head_branch, 'stable/'))
                      && 'critical' || 'warning' }}
                  title: ${{ steps.dispatched.outputs.title }}
                  branch: ${{ github.event.workflow_run.head_branch }}
                  workflow-name: ${{ github.event.workflow_run.name }}
                  run-id: ${{ github.event.workflow_run.id }}
                  run-url: ${{ github.event.workflow_run.html_url }}
                  commit-sha: ${{ github.event.workflow_run.head_sha }}
                  actor: ${{ github.event.workflow_run.actor.login }}

            # The sheet is for triage after the fact. A run that never started
            # needs saying out loud, because it is the one failure that cannot
            # announce itself: no jobs means no check runs, so the pull request
            # shows nothing at all and the suite's own Slack step never runs.
            # Only an outside observer can report it, and this is the observer.
            - name: Import Slack token
              id: slack-secret
              if: ${{ steps.dispatched.outputs.category == 'ci-never-started' }}
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common SLACK_BOT_TOKEN;

            - name: Describe the run that never started
              id: never-started
              if: ${{ steps.dispatched.outputs.category == 'ci-never-started' }}
              env:
                  WORKFLOW: ${{ github.event.workflow_run.name }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  # A shared branch losing a suite affects everyone, so it goes to
                  # infraex-alerts and pings the group. Any other branch is one
                  # person's work in progress: still worth a message, but to the
                  # test channel and without waking anyone. Diagnosing #3336 meant
                  # dispatching the broken workflow repeatedly, and every attempt
                  # paged the group -- an alert that fires on someone's own branch
                  # is how a channel gets muted.
                  SHARED: ${{ github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'stable/') }}
              run: |
                  set -euo pipefail

                  if [ "${SHARED}" = "true" ]; then
                      channel=C076N4G1162   # infraex-alerts
                      # Raw Slack form. `@infraex-medic` is plain text in a
                      # chat.postMessage payload and notifies nobody, which is how
                      # it shipped. The subteam id is the one already used by
                      # internal_global_alpha_availability_check.yml.
                      mention=" cc <!subteam^S06NTRBMWUD>"
                  else
                      channel=C07E4FF6YMB   # infraex-alerts-test
                      mention=""
                  fi
                  echo "channel=${channel}" | tee -a "$GITHUB_OUTPUT"

                  TEXT=":ghost: *${WORKFLOW}* dispatched no jobs on \`${BRANCH}\` (conclusion \`${CONCLUSION}\`)."
                  TEXT="${TEXT} A run with no jobs emits no check runs, so the pull request reports nothing and the suite proves nothing --"
                  TEXT="${TEXT} treat any green on that branch as unverified for this suite."
                  TEXT="${TEXT} The reason is only on the run page: <${RUN_URL}|the run>.${mention}"

                  {
                    echo "text<<NEVER_EOF"
                    printf '%s\n' "$TEXT"
                    echo "NEVER_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Notify in Slack about the run that never started
              if: ${{ steps.dispatched.outputs.category == 'ci-never-started' }}
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  method: chat.postMessage
                  token: ${{ steps.slack-secret.outputs.SLACK_BOT_TOKEN }}
                  payload: |
                      {
                        "channel": ${{ toJSON(steps.never-started.outputs.channel) }},
                        "unfurl_links": false,
                        "unfurl_media": false,
                        "text": ${{ toJSON(steps.never-started.outputs.text) }}
                      }

    report-warnings:
        name: Report non-blocking warnings
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Non-blocking Helm drift is surfaced by internal-helm-deprecation-check as
            # ::warning:: annotations on the observed run. Scan the run's check-run
            # annotations (works for any branch, even when the run itself is green).
            - name: Scan run for Helm drift warnings
              id: scan
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  CHECK_SUITE_ID: ${{ github.event.workflow_run.check_suite_id }}
              run: |
                  set -uo pipefail
                  PATTERN='Unknown configuration keys detected|Deprecation warnings detected|Removed configuration keys detected'
                  found=no
                  title=""
                  # Best-effort: a Checks API hiccup must not fail the reporter, so any
                  # error is treated as "no warnings found".
                  CHECK_RUN_IDS=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
                      --jq ".check_runs[] | select(.check_suite.id == ${CHECK_SUITE_ID}) | .id" 2>/dev/null || true)
                  while IFS= read -r id; do
                      [[ -z "${id}" ]] && continue
                      msg=$(gh api "/repos/${REPO}/check-runs/${id}/annotations" --paginate \
                          --jq '.[].message' 2>/dev/null | grep -iE "${PATTERN}" | head -1 || true)
                      if [[ -n "${msg}" ]]; then
                          found=yes
                          title="${msg}"
                          break
                      fi
                  done <<< "${CHECK_RUN_IDS}"
                  delim="ghadelim_$(openssl rand -hex 12)"
                  {
                    echo "has_warning=${found}"
                    echo "title<<${delim}"
                    echo "${title}"
                    echo "${delim}"
                  } >> "${GITHUB_OUTPUT}"

            - name: Append warning event
              if: ${{ steps.scan.outputs.has_warning == 'yes' }}
              uses: ./.github/actions/internal-report-event-to-sheet
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  spreadsheet-id: ${{ env.SHEET_ID }}
                  event-type: warning
                  category: helm-config-drift
                  severity: info
                  title: ${{ steps.scan.outputs.title }}
                  branch: ${{ github.event.workflow_run.head_branch }}
                  workflow-name: ${{ github.event.workflow_run.name }}
                  run-id: ${{ github.event.workflow_run.id }}
                  run-url: ${{ github.event.workflow_run.html_url }}
                  commit-sha: ${{ github.event.workflow_run.head_sha }}
                  actor: ${{ github.event.workflow_run.actor.login }}
