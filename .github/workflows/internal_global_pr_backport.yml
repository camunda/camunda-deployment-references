---
name: Internal - Global - Pull Request Backporting

on:
    pull_request:
        types: [closed]
    issue_comment:
        types: [created]

permissions:
    contents: write # so it can comment
    pull-requests: write # so it can create pull requests

jobs:
    backport:
        name: Create backport PRs
        runs-on: ubuntu-latest
        # Run when pull request is merged or when a comment starting with `/backport`
        # Exclude the backport action bot (user ID 97796249) to prevent infinite loops
        #
        # `issue_comment` runs in the base repository with access to the secrets, and this
        # job mints an App token from them, so the comment path is restricted by the
        # commenter's `author_association`: the repository owner, a member of the owning
        # organisation, or an invited collaborator. That is a statement about the
        # relationship to the repository, not a permission level -- a member with read-only
        # access still passes -- but it keeps a drive-by commenter on a public pull request
        # from starting a run that holds a token with the `workflows` scope.
        if: >
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.merged
            ) || (
              github.event_name == 'issue_comment' &&
              github.event.issue.pull_request &&
              github.event.comment.user.id != 97796249 &&
              startsWith(github.event.comment.body, '/backport') &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
            )
        steps:
            # GITHUB_TOKEN cannot push anything under .github/workflows/, whatever permissions
            # the workflow declares -- `workflows` is an App/PAT scope, not a GITHUB_TOKEN one.
            # Every backport of a pull request that touched a workflow file was therefore
            # rejected with "refusing to allow a GitHub App to create or update workflow ...
            # without `workflows` permission", while this job still reported success and left
            # only a comment on the source pull request. An App token carries the scope.
            - name: Generate token for GitHub
              id: generate-github-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@475528365f4010480dccff71ccac554cc3352e7c # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  repositories: ${{ github.event.repository.name }}
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  vault-url: ${{ secrets.VAULT_ADDR }}

            # backport-action pushes with a bare `git push`, so the credential it uses is
            # whatever checkout wrote into the git config -- not its `github_token` input,
            # which only serves the API calls. The token therefore has to be in place
            # before the checkout, and has to stay in the config for the push to use it.
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  token: ${{ steps.generate-github-token.outputs.token }}
                  persist-credentials: true

            # A side effect worth knowing about: GitHub suppresses workflow runs for anything
            # created with GITHUB_TOKEN, so backport pull requests currently open with no
            # checks on them at all and get merged unvalidated. Opened by the App instead,
            # they trigger the usual `pull_request` workflows, so a backport whose paths
            # match an integration test suite will now run it.
            - name: Create backport PRs
              id: backport
              uses: korthout/backport-action@3c06f323a58619da1e8522229ebc8d5de2633e46 # v4.3.0
              with:
                  github_token: ${{ steps.generate-github-token.outputs.token }}
                  add_author_as_assignee: true
                  copy_assignees: true
                  experimental: >
                      {
                      "conflict_resolution": "draft_commit_conflicts"
                      }
                  # matches label 'backport stable/8.7'
                  label_pattern: ^backport ([^ ]+)$
                  # see https://github.com/korthout/backport-action#pull_description
                  pull_description: |-
                      # Description
                      Backport of #${pull_number} to `${target_branch}`.

                      relates to ${issue_refs}

            # The title of a backport is the source title verbatim, so a source merged
            # with the ` [ready]` tag this repository appends to a validated pull request
            # hands that tag to a backport nobody has looked at: conflict markers
            # committed by `draft_commit_conflicts`, no review, and a title claiming the
            # opposite. The tag cannot be filtered inside `pull_title` -- it is a template
            # over the raw title -- so it is dropped here, before anyone reads it.
            - name: Drop the readiness tag from the backport titles
              if: steps.backport.outputs.created_pull_numbers != ''
              env:
                  CREATED_PULL_NUMBERS: ${{ steps.backport.outputs.created_pull_numbers }}
                  GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  read -ra numbers <<< "${CREATED_PULL_NUMBERS}"
                  for number in "${numbers[@]}"; do
                      title=$(gh pr view "${number}" --repo "${REPOSITORY}" --json title --jq .title)
                      untagged=${title%" [ready]"}
                      if [ "${untagged}" = "${title}" ]; then
                          continue
                      fi
                      echo "Retitling #${number}: ${title} -> ${untagged}"
                      gh pr edit "${number}" --repo "${REPOSITORY}" --title "${untagged}"
                  done

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: failure() && (github.event_name == 'pull_request' || github.event_name == 'issue_comment')
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
                  slack_channel_id: ${{ github.event_name == 'schedule' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ github.event_name == 'schedule' && '@infraex-medic' || '' }}
                  disable_silence_check: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
