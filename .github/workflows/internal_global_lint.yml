---
name: Internal - Global - Lint

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

jobs:
    lint:
        permissions:
            contents: read
            id-token: write # required for Vault JWT login
        uses: camunda/infraex-common-config/.github/workflows/lint-global.yml@37bcb8168f0990c0c1786f55a350206289519c2d # 3.0.2
        with:
            # Runs Renovate over the repository and fails on an annotation it reads and then
            # drops as unusable -- a dependency that looks tracked and can never be updated.
            # Pins deliberately parked on a branch or a pre-release carry `renovate-inert-ok`.
            check-renovate-lookup: true
        secrets: inherit
