---
name: Tests - Daily Cleanup - AWS Containers ECS Dual Region Fargate
permissions:
    contents: read
on:
    workflow_dispatch:
        inputs:
            max_age_hours_cluster:
                description: Maximum age of clusters in hours
                required: true
                default: '12'
    pull_request: {}
    schedule:
        - cron: 0 5 * * *
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false
env:
    MAX_AGE_HOURS_CLUSTER: ${{ github.event.inputs.max_age_hours_cluster || '12' }}
    AWS_PROFILE: infraex
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BUCKET_REGION: eu-central-1
    AWS_REGION: eu-west-2
    TF_VAR_region_0: eu-west-2
    TF_VAR_region_1: eu-west-3
jobs:
    triage:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip
    cleanup-clusters:
        needs: [triage]
        if: needs.triage.outputs.should_skip == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 240
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Import artifact encryption key
              id: artifact-key
              continue-on-error: true
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common CI_ENCRYPTION_KEY;
            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Move stray Aurora writers home
              timeout-minutes: 60
              env:
                  RESTORE_BUDGET_SECONDS: '3300'
                  REGION_0: ${{ env.TF_VAR_region_0 }}
                  STATE_BUCKET: ${{ env.S3_BACKEND_BUCKET }}
                  STATE_BUCKET_REGION: ${{ env.S3_BUCKET_REGION }}
                  STATE_PREFIX: aws/containers/ecs-dual-region-fargate/
              run: ./aws/containers/ecs-dual-region-fargate/test/restore-aurora-writers.sh "^e2e-.*-global-db$" "${MAX_AGE_HOURS_CLUSTER}"
            - name: Delete stacks
              if: always()
              timeout-minutes: 170
              uses: ./.github/actions/aws-generic-terraform-cleanup
              with:
                  encryption-key: ${{ steps.artifact-key.outputs.CI_ENCRYPTION_KEY }}
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BUCKET_REGION }}
                  max-age-hours: ${{ env.MAX_AGE_HOURS_CLUSTER }}
                  tf-bucket-key-prefix: aws/containers/ecs-dual-region-fargate/
                  destroy-pass-timeout-minutes: '120'
                  cleanup-regions: ${{ env.TF_VAR_region_0 }} ${{ env.TF_VAR_region_1 }}
                  modules-order: app/terraform,infra/terraform,vpc/terraform,fixture/terraform
                  tf-config-path: aws/containers/ecs-dual-region-fargate/terraform/cleanup/config-dual-region-fargate
    cleanup-lifecycle-lane:
        needs: [triage]
        if: needs.triage.outputs.should_skip == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 240
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Import artifact encryption key
              id: artifact-key
              continue-on-error: true
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common CI_ENCRYPTION_KEY;
            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Resolve the lifecycle lane's state prefix
              id: lane
              run: echo "prefix=aws/containers/ecs-dual-region-fargate/$(cat .target-branch)/" >> "$GITHUB_OUTPUT"
            - name: Move stray Aurora writers home
              timeout-minutes: 60
              env:
                  RESTORE_BUDGET_SECONDS: '3300'
                  REGION_0: ${{ env.TF_VAR_region_0 }}
                  STATE_BUCKET: ${{ env.S3_BACKEND_BUCKET }}
                  STATE_BUCKET_REGION: ${{ env.S3_BUCKET_REGION }}
                  STATE_PREFIX: ${{ steps.lane.outputs.prefix }}
              run: ./aws/containers/ecs-dual-region-fargate/test/restore-aurora-writers.sh "^ecsdr-.*-global-db$" "${MAX_AGE_HOURS_CLUSTER}"
            - name: Delete stacks
              if: always()
              timeout-minutes: 170
              uses: ./.github/actions/aws-generic-terraform-cleanup
              with:
                  encryption-key: ${{ steps.artifact-key.outputs.CI_ENCRYPTION_KEY }}
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BUCKET_REGION }}
                  max-age-hours: ${{ env.MAX_AGE_HOURS_CLUSTER }}
                  tf-bucket-key-prefix: ${{ steps.lane.outputs.prefix }}
                  destroy-pass-timeout-minutes: '120'
                  cleanup-regions: ${{ env.TF_VAR_region_0 }} ${{ env.TF_VAR_region_1 }}
                  modules-order: app/terraform,infra/terraform,vpc/terraform
                  tf-config-path: aws/containers/ecs-dual-region-fargate/terraform/cleanup/config-dual-region-fargate
    report-failure:
        if: failure() && github.event_name == 'schedule'
        needs: [cleanup-clusters, cleanup-lifecycle-lane]
        runs-on: ubuntu-latest
        permissions:
            issues: read
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Notify in Slack in case of failure
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@e2923304b40dfc031b3f595bcc1445e90c981adb
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
                  vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
                  vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

