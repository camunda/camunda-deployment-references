---
name: Tests - BYO-VPC - AWS Containers ECS Dual Region Fargate

# BYO-VPC end-to-end. Spins up throwaway VPCs via aws/test-fixtures/byo-vpcs/,
# applies the ecs-dual-region-fargate stack with byo_vpc = true, asserts on
# Raft quorum, destroys everything. Heavier and slower than the greenfield
# integration test (extra ~5 minutes for the fixture VPC setup) — runs on a
# less-frequent schedule once enabled.
#
# NOT yet scheduled. Invoke via workflow_dispatch until the sandbox-account
# smoke run validates the suite end-to-end.

on:
    workflow_dispatch:

# Never cancel a running suite: after a cancellation GitHub kills the job within
# minutes, before "Destroy the states of this run" can finish, and the stacks
# leak until the daily sweep. A new push waits for the previous run instead.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    AWS_PROFILE: infraex
    AWS_REGION: eu-west-2
    TEST_DIR: ./aws/containers/ecs-dual-region-fargate/test/src
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BACKEND_REGION: eu-central-1

jobs:
    triage:
        runs-on: ubuntu-slim
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip

    byo_vpc:
        runs-on: ubuntu-latest
        needs:
            - triage
        if: needs.triage.outputs.should_skip == 'false'
        # 240 for the job itself, plus up to 90 waiting for a capacity slot.
        timeout-minutes: 330
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Import artifact encryption key
              id: artifact-key
              # A key import failure must not block infrastructure teardown.
              continue-on-error: true
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common CI_ENCRYPTION_KEY;

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@e2923304b40dfc031b3f595bcc1445e90c981adb # 3.0.0

            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}

            # Wait for a slot and for free quota instead of failing at terraform apply.
            # `needs` is per region: the fixture VPC with a single NAT gateway and its transit gateway,
            # one ALB, two NLBs and one Aurora cluster with one instance.
            - name: Acquire a capacity slot
              id: capacity
              uses: ./.github/actions/aws-capacity-slot
              with:
                  mode: acquire
                  pool: aws-ecs-dual-region-fargate-byo-vpc
                  slots: '3'
                  regions: eu-west-2 eu-west-3
                  needs: |
                      rds-clusters=1
                      db-subnet-groups=1
                      rds-instances=1
                      vpcs=1
                      elastic-ips=1
                      transit-gateways=1
                      albs=1
                      nlbs=2

            - name: Cache Go modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: go-${{ runner.os }}-${{ hashFiles('aws/containers/ecs-dual-region-fargate/test/src/go.sum') }}

            - name: Run BYO-VPC Terratest
              working-directory: ${{ env.TEST_DIR }}
              env:
                  TEST_AWS_PROFILE: ${{ env.AWS_PROFILE }}
                  TEST_REGION_0: eu-west-2
                  TEST_REGION_1: eu-west-3
                  TEST_BACKEND_BUCKET: ${{ env.S3_BACKEND_BUCKET }}
                  TEST_BACKEND_REGION: ${{ env.S3_BACKEND_REGION }}
                  # Suffixes every state group of this run, and names its stacks.
                  TEST_RUN_ID: ${{ github.run_id }}
              run: |
                  go test -v -timeout 90m -run TestEndToEnd_BYO_VPC_TGW_RDBMS ./...

            # t.Cleanup destroys each stack when the tests end normally. It does not run
            # when go test times out or the job is cancelled, so reclaim this run's
            # states here too. The daily cleanup catches what this step cannot reach.
            - name: Destroy the states of this run
              if: always()
              timeout-minutes: 130
              uses: ./.github/actions/aws-generic-terraform-cleanup
              env:
                  TF_VAR_region_0: eu-west-2
                  TF_VAR_region_1: eu-west-3
              with:
                  encryption-key: ${{ steps.artifact-key.outputs.CI_ENCRYPTION_KEY }}
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BACKEND_REGION }}
                  tf-bucket-key-prefix: aws/containers/ecs-dual-region-fargate/
                  max-age-hours: '0'
                  target: run${{ github.run_id }}/
                  fail-on-not-found: 'false'
                  modules-order: app/terraform,infra/terraform,vpc/terraform,fixture/terraform
                  destroy-pass-timeout-minutes: '60'
                  retry-destroy-pass-timeout-minutes: '60'
                  tf-config-path: aws/containers/ecs-dual-region-fargate/terraform/cleanup/config-dual-region-fargate
                  # The VPC sweep and the cloud-nuke retry only run for the regions listed here.
                  cleanup-regions: eu-west-2 eu-west-3

            # Last, so the slot is held until this run's resources are gone.
            - name: Release the capacity slot
              if: always()
              uses: ./.github/actions/aws-capacity-slot
              with:
                  mode: release
                  pool: aws-ecs-dual-region-fargate-byo-vpc
                  slot-key: ${{ steps.capacity.outputs.slot-key }}
