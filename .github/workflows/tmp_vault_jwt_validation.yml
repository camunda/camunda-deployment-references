---
name: TEMP - Vault JWT validation

permissions:
    contents: read

on:
    pull_request:
        paths:
            - .github/workflows/tmp_vault_jwt_validation.yml

jobs:
    vault-jwt:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Import secret with JWT login
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: jwt
                  path: ${{ secrets.VAULT_JWT_PATH }}
                  role: ${{ secrets.VAULT_JWT_ROLE }}
                  jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common DOCKERHUB_USER;
