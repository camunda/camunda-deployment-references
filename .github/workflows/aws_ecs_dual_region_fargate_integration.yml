---
name: Tests - Terratest - AWS Containers ECS Dual Region Fargate

# The full Terratest sweep: every test in
# aws/containers/ecs-dual-region-fargate/test/src, each applying its own
# vpc/ → infra/ → app/ stack against the sandbox AWS account, waiting for
# Raft quorum, asserting, then destroying.
#
# Dispatch-only, and deliberately so: the suite is several clusters' worth of
# spend per run. The pull-request lane is
# aws_ecs_dual_region_fargate_tests.yml, which covers one combination on one
# cluster — that workflow owns the "Tests - Integration - ..." display name.

on:
    workflow_dispatch:
        inputs:
            test_name:
                description: Which test to run (empty = all)
                required: false
                default: ''
                type: string
            enable_load_tests:
                description: Also deploy the load test overlay (greenfield RDBMS test only)
                required: false
                default: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    AWS_PROFILE: infraex
    AWS_REGION: eu-west-2

    TEST_DIR: ./aws/containers/ecs-dual-region-fargate/test/src
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BACKEND_REGION: eu-central-1

jobs:
    triage:
        runs-on: ubuntu-slim
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip

    integration:
        name: ${{ matrix.test }}
        runs-on: ubuntu-latest
        needs:
            - triage
        if: needs.triage.outputs.should_skip == 'false'
        # One test: provision, assert, destroy.
        timeout-minutes: 120
        # One test per runner leg, not all of them in one `go test`.
        #
        # The suite is serial within a process — every test drives
        # `terraform init -reconfigure` against the same three module
        # directories (see test/src/doc.go) — and each test provisions and
        # destroys a complete dual-region stack, roughly 45-60 minutes. Run
        # end to end that is several hours, well past any job budget. A matrix
        # gives each test its own runner and therefore its own checkout, so the
        # shared-directory race does not apply across legs and the wall clock
        # is one test, not all of them.
        #
        # max-parallel bounds how many full stacks exist at once, which is the
        # real limit here: Elastic IPs and NAT gateways per region run out
        # before anything else does.
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                test: >-
                    ${{ inputs.test_name != ''
                    && fromJSON(format('["{0}"]', inputs.test_name))
                    || fromJSON('["TestEndToEnd_Greenfield_TGW_RDBMS","TestEndToEnd_Greenfield_VpcPeering_OpenSearch"]') }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6

            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}

            # The failover/failback tests shell out to procedure/failover.sh
            # and procedure/failback.sh, which reach the Zeebe management API
            # over ECS Exec.
            - name: Install session-manager-plugin
              uses: ./.github/actions/internal-install-session-manager-plugin

            - name: Cache Go modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: go-${{ runner.os }}-${{ hashFiles('aws/containers/ecs-dual-region-fargate/test/src/go.sum') }}

            - name: Run Terratest
              working-directory: ${{ env.TEST_DIR }}
              env:
                  TEST_AWS_PROFILE: ${{ env.AWS_PROFILE }}
                  TEST_REGION_0: eu-west-2
                  TEST_REGION_1: eu-west-3
                  TEST_ENABLE_LOAD_TESTS: ${{ inputs.enable_load_tests }}
                  TEST_BACKEND_BUCKET: ${{ env.S3_BACKEND_BUCKET }}
                  TEST_BACKEND_REGION: ${{ env.S3_BACKEND_REGION }}
                  MATRIX_TEST: ${{ matrix.test }}
              run: |
                  set -e
                  # The dispatch input overrides the matrix leg, so a single
                  # test can still be run on demand without editing the matrix.
                  TEST_FILTER="${MATRIX_TEST}"
                  # `go test -run` exits 0 when the pattern matches nothing, so a
                  # typo'd dispatch would report success having tested nothing.
                  if ! grep -rqE "func ${TEST_FILTER}\\(" ./*_test.go; then
                      echo "::error::no test named ${TEST_FILTER} in $(pwd)"
                      exit 1
                  fi
                  go test -v -timeout 110m -run "^${TEST_FILTER}$" ./...
