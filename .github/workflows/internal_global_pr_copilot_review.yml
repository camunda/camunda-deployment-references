---
name: Internal - Global - PR Copilot review

on:
    pull_request_target:
        types: [opened, ready_for_review, labeled]

permissions: {}

jobs:
    copilot-review:
        permissions:
            pull-requests: write
        uses: camunda/infraex-common-config/.github/workflows/copilot-review-global.yml@0b61f2d2aff816cd7527ae859bae5450a47b27c6
        with:
            skip-authors: '["renovate[bot]", "smx-misc[bot]"]'
            slack-channel-id: C07E4FF6YMB
        secrets:
            VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
            VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
