---
name: Internal - Global - PR Copilot review

on:
    # no checkout in this file; it calls the pinned shared review workflow
    pull_request_target: # zizmor: ignore[dangerous-triggers]
        types: [opened, ready_for_review, labeled]

permissions: {}

jobs:
    copilot-review:
        permissions:
            issues: read
            pull-requests: write
            id-token: write # required for Vault JWT login
        uses: camunda/infraex-common-config/.github/workflows/copilot-review-global.yml@ab4b2b3604eea14f2b41b77bbc9a66bbf2e51df4 # 3.0.13
        secrets:
            VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
            VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
            VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
            VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
