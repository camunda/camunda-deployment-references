---
# This workflow updates an artifact containing the ROSA versions,
# it's used by renovate and published at https://camunda.github.io/camunda-deployment-references/rosa_versions.txt
#
# TODO: [release-duty] delete this workflow from the new `stable/8.x` when `main` is
# cut. The artifact is global -- one `gh-pages` branch, one URL per artifact in the
# shared Renovate preset -- so a copy on a maintenance branch can only publish a
# staler version of it. See MAINTENANCE.md, "Release duty".
name: Internal - OpenShift - Save ROSA Versions as an artifact

on:
    schedule:
        - cron: 0 0 * * *
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/internal_openshift_artifact_rosa_versions.yml

# The five workflows that publish to `gh-pages` share one lock, so a publish never
# races another publish -- `! [rejected] ... (fetch first)` happened three times on
# 2026-08-20 -- and is never cancelled midway. A pull request run validates the
# generation without publishing, so it gets its own per-ref group and may be
# superseded.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'gh-pages-publish' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    save-rosa-versions:
        runs-on: ubuntu-latest
        permissions:
            contents: write # push the generated files to the gh-pages branch

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Import Secrets
              id: secrets
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common RH_OPENSHIFT_TOKEN;

            - name: Switch to gh-pages branch
              run: |
                  cp .tool-versions /tmp/.tool-versions
                  git fetch origin gh-pages
                  git checkout gh-pages
                  cp /tmp/.tool-versions .tool-versions

            - name: Install ROSA CLI and output rosa versions
              shell: bash
              run: |
                  set -euo pipefail

                  # Download and install rosa CLI in /tmp (we don't need it in the repo).
                  pushd /tmp >/dev/null
                  curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz"
                  tar -xvf rosa-linux.tar.gz
                  sudo mv rosa /usr/local/bin/rosa
                  chmod +x /usr/local/bin/rosa
                  rm -f rosa-linux.tar.gz
                  popd >/dev/null

                  rosa version
                  rosa login --token=${{ steps.secrets.outputs.RH_OPENSHIFT_TOKEN }}

                  # Write the artifact into the repo working tree (gh-pages branch is currently checked out).
                  mkdir -p docs
                  # We deploy ROSA HCP (Hosted Control Planes), so `--hosted-cp` is the list the
                  # pins in the test matrices have to satisfy; the classic `rosa list versions`
                  # output described a product this repo never creates and dragged the artifact
                  # down to 4.11.
                  #
                  # This does not make the artifact EOL-free -- `--hosted-cp` still reports
                  # minors that are past end of life (4.14 and up as of writing), and the CLI
                  # exposes no end-of-life field to filter on. It cannot: a pinned minor going
                  # EOL is what broke the 4.18 matrix entry, and no filter here would have saved
                  # it, because Renovate is only ever offered patches within the minor the pin
                  # names. Bumping the minor stays a manual step. What this does buy is that
                  # every version published is at least one HCP knows about.
                  rosa list versions --hosted-cp --output json \
                    | jq '.[].raw_id' --raw-output \
                    | sort -V -u -r > docs/rosa_versions.txt

                  echo "::group::Generated docs/rosa_versions.txt ($(wc -l < docs/rosa_versions.txt) lines)"
                  cat docs/rosa_versions.txt
                  echo "::endgroup::"

                  # Guard: never publish an empty/invalid artifact (see commit fa56123).
                  if [ ! -s docs/rosa_versions.txt ] || ! grep -qE '[0-9]' docs/rosa_versions.txt; then
                    echo "::error::Generated 'docs/rosa_versions.txt' is empty or has no version numbers; aborting to avoid publishing an empty artifact."
                    exit 1
                  fi

            - name: Commit and push ROSA versions file to gh-pages
              # A pull request run is here to prove this workflow still produces a valid
              # artifact, not to publish one: it targets a branch the pull request never
              # merges into, so nothing about that write is reviewed, and two of them at
              # once is what rejected the push three times on 2026-08-20.
              if: github.event_name != 'pull_request'
              shell: bash
              run: |
                  set -euo pipefail

                  echo "::group::Diff against gh-pages"
                  git --no-pager diff -- docs/rosa_versions.txt || true
                  echo "::endgroup::"

                  git diff --exit-code docs/rosa_versions.txt || {
                    git config --local user.name "github-actions[bot]"
                    git config --local user.email "github-actions[bot]@users.noreply.github.com"
                    git add docs/rosa_versions.txt
                    git commit -m "Update ROSA versions"
                    for attempt in 1 2 3; do
                      if git push origin gh-pages; then
                        exit 0
                      fi
                      echo "::warning::gh-pages rejected the push (attempt ${attempt}/3); rebasing onto the remote and retrying."
                      git pull --rebase origin gh-pages
                    done
                    echo "::error::could not push to gh-pages after three attempts."
                    exit 1
                  }
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: failure() && github.event_name == 'schedule'
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@9d485973624ec326ef0e92c73191b6c0f26ad39e # 2.3.6
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
