---
name: Tests - Failover - AWS Containers ECS Dual Region Fargate

# Failover and failback end-to-end. Deploys baseline, runs procedure/failover.sh
# (planned/unplanned) and procedure/failback.sh (with/without --switch-writer),
# asserts on Aurora Global writer-region transitions.
#
# Expensive: each variant is a full deploy + the failover sequence. Rotation
# across Camunda versions is intentional — fewer concurrent deploys, lower
# AWS spend. Schedule added once the suite passes against the sandbox.
#
# NOT yet scheduled. Runs on pull requests that touch the stack, its
# procedures or its tests (skip with the `skip_<workflow>` label), and via
# workflow_dispatch.

on:
    workflow_dispatch:
        inputs:
            test_name:
                description: >-
                    Failover tests to run, separated by | (default = all four): TestPlannedFailover,
                    TestUnplannedFailover, TestFailback_NoSwitchWriter, TestFailback_SwitchWriter
                required: false
                default: ''
                type: string
    pull_request:
        paths:
            - .github/actions/internal-encrypted-upload-artifact/**
            - .github/workflows/aws_ecs_dual_region_fargate_failover.yml
            - .github/actions/aws-capacity-slot/**
            - .github/actions/aws-configure-cli/**
            - .github/actions/aws-generic-terraform-cleanup/**
            - .tool-versions
            - aws/containers/ecs-dual-region-fargate/procedure/**
            - aws/containers/ecs-dual-region-fargate/terraform/**
            - '!aws/containers/ecs-dual-region-fargate/terraform/*/test/golden/**'
            - aws/containers/ecs-dual-region-fargate/test/**
            - aws/modules/ecs/**
            - aws/modules/aurora-global/**

# Never cancel a running suite: after a cancellation GitHub kills the job within
# minutes, before "Destroy the states of this run" can finish, and the stacks
# leak until the daily sweep. A new push waits for the previous run instead.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    AWS_PROFILE: infraex
    AWS_REGION: eu-west-2
    TEST_DIR: ./aws/containers/ecs-dual-region-fargate/test/src
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BACKEND_REGION: eu-central-1

jobs:
    triage:
        runs-on: ubuntu-slim
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip

    failover:
        runs-on: ubuntu-latest
        needs:
            - triage
        if: needs.triage.outputs.should_skip == 'false'
        # 315 for the suite and its teardown, plus up to 45 waiting for a capacity slot:
        # GitHub-hosted jobs stop at 360 minutes.
        timeout-minutes: 360
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
              continue-on-error: true

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Import artifact encryption key
              id: artifact-key
              continue-on-error: true # never block cleanup; upload is skipped without a key
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common CI_ENCRYPTION_KEY;

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@e2923304b40dfc031b3f595bcc1445e90c981adb # 3.0.0

            - name: Configure AWS CLI
              uses: ./.github/actions/aws-configure-cli
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}

            # A wave of pull requests (Renovate on the stable branches) once started
            # enough runs at the same time to exhaust the account's RDS cluster quota.
            # Wait for a slot and for free quota instead of failing at terraform apply.
            # `needs` is per region: four parallel tests, each with its own stack of
            # one VPC with a single NAT gateway, one ALB, two
            # NLBs and one Aurora cluster with one instance.
            - name: Acquire a capacity slot
              id: capacity
              uses: ./.github/actions/aws-capacity-slot
              with:
                  mode: acquire
                  wait-minutes: '45'
                  pool: ecs-dual-region-failover
                  slots: '3'
                  regions: eu-west-2 eu-west-3
                  needs: |
                      rds-clusters=4
                      db-subnet-groups=4
                      rds-instances=4
                      vpcs=4
                      elastic-ips=4
                      albs=4
                      nlbs=8

            - name: Cache Go modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: go-${{ runner.os }}-${{ hashFiles('aws/containers/ecs-dual-region-fargate/test/src/go.sum') }}

            - name: Run failover Terratest
              working-directory: ${{ env.TEST_DIR }}
              env:
                  TEST_AWS_PROFILE: ${{ env.AWS_PROFILE }}
                  TEST_REGION_0: eu-west-2
                  TEST_REGION_1: eu-west-3
                  TEST_BACKEND_BUCKET: ${{ env.S3_BACKEND_BUCKET }}
                  TEST_BACKEND_REGION: ${{ env.S3_BACKEND_REGION }}
                  # Suffixes every state group of this run, and names its stacks.
                  TEST_RUN_ID: ${{ github.run_id }}
                  INPUTS_TEST_NAME: ${{ inputs.test_name }}
              run: |
                  set -e
                  # The capacity slot reserves the stacks of these four tests only, so a
                  # dispatch may pick among them but not widen the run to other tests.
                  tests='TestPlannedFailover|TestUnplannedFailover|TestFailback_NoSwitchWriter|TestFailback_SwitchWriter'
                  TEST_FILTER="${INPUTS_TEST_NAME:-$tests}"
                  if [[ ! "$TEST_FILTER" =~ ^($tests)(\|($tests))*$ ]]; then
                      echo "::error::test_name must be one or more of ${tests}, separated by |."
                      exit 1
                  fi
                  go test -v -timeout 120m -run "^(${TEST_FILTER})\$" ./...

            # A run killed after failover.sh can leave the Aurora writer in region 1,
            # where terraform destroy may hang. Move it home before the destroy.
            - name: Move the Aurora writers of this run home
              if: always()
              timeout-minutes: 45
              env:
                  # Stops starting clusters 5 minutes before the step timeout.
                  RESTORE_BUDGET_SECONDS: '2400'
                  REGION_0: eu-west-2
                  RUN_ID: ${{ github.run_id }}
              run: |
                  digits=0123456789abcdefghijklmnopqrstuvwxyz
                  number=$RUN_ID
                  tag=''
                  while (( number > 0 )); do
                      tag="${digits:number%36:1}${tag}"
                      number=$((number / 36))
                  done
                  ./aws/containers/ecs-dual-region-fargate/test/restore-aurora-writers.sh "-${tag}-global-db\$" 0

            # t.Cleanup destroys each stack when the tests end normally. It does not run
            # when go test times out or the job is cancelled, so reclaim this run's
            # states here too. The daily cleanup catches what this step cannot reach.
            - name: Destroy the states of this run
              if: always()
              timeout-minutes: 130
              uses: ./.github/actions/aws-generic-terraform-cleanup
              env:
                  TF_VAR_region_0: eu-west-2
                  TF_VAR_region_1: eu-west-3
              with:
                  encryption-key: ${{ steps.artifact-key.outputs.CI_ENCRYPTION_KEY }}
                  tf-bucket: ${{ env.S3_BACKEND_BUCKET }}
                  tf-bucket-region: ${{ env.S3_BACKEND_REGION }}
                  tf-bucket-key-prefix: aws/containers/ecs-dual-region-fargate/
                  max-age-hours: '0'
                  target: run${{ github.run_id }}/
                  fail-on-not-found: 'false'
                  modules-order: app/terraform,infra/terraform,vpc/terraform,fixture/terraform
                  destroy-pass-timeout-minutes: '60'
                  retry-destroy-pass-timeout-minutes: '60'
                  tf-config-path: aws/containers/ecs-dual-region-fargate/terraform/cleanup/config-dual-region-fargate
                  # The VPC sweep and the cloud-nuke retry only run for the regions listed here.
                  cleanup-regions: eu-west-2 eu-west-3

            # Last, so the slot is held until this run's resources are gone.
            - name: Release the capacity slot
              if: always()
              uses: ./.github/actions/aws-capacity-slot
              with:
                  mode: release
                  pool: ecs-dual-region-failover
                  slot-key: ${{ steps.capacity.outputs.slot-key }}

            - name: Submit build status
              if: always()
              continue-on-error: true
              uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
              with:
                  build_status: ${{ job.status }}
