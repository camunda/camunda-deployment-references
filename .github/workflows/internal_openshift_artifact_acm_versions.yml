---
# This workflow updates an artifact containing the OpenShift ACM versions,
# it's used by renovate and published at https://camunda.github.io/camunda-deployment-references/openshift_acm_versions.txt
#
# TODO: [release-duty] delete this workflow from the new `stable/8.x` when `main` is
# cut. The artifact is global -- one `gh-pages` branch, one URL per artifact in the
# shared Renovate preset -- so a copy on a maintenance branch can only publish a
# staler version of it. See MAINTENANCE.md, "Release duty".
name: Internal - OpenShift - Save OpenShift ACM Versions as an artifact

on:
    schedule:
        - cron: 0 0 * * *
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/internal_openshift_artifact_acm_versions.yml
            - .github/scripts/get_acm_versions.py
            - .github/scripts/test_get_acm_versions.py
            - .github/scripts/fixtures/acm_versions/**

# The five workflows that publish to `gh-pages` share one lock, so a publish never
# races another publish -- `! [rejected] ... (fetch first)` happened three times on
# 2026-08-20 -- and is never cancelled midway. A pull request run validates the
# generation without publishing, so it gets its own per-ref group and may be
# superseded.
#
# A source outage is not a failure right away. The script exits 3 when docs.redhat.com
# (which blocks GitHub-hosted runners from time to time) and the upstream branches are
# both unreachable. A scheduled or dispatched run then warns and keeps the published
# file as long as it was confirmed within the last STALE_AFTER_DAYS days, and fails --
# which alerts Slack -- after that. A run that reaches a source records a confirmation
# on `gh-pages` (an `Update` commit when the list changed, a `Confirm` commit when not),
# and the age of the newest one is what the rule reads. A pull request run never
# touches Red Hat: it checks the parser against saved fixtures.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'gh-pages-publish' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    save-acm-versions:
        runs-on: ubuntu-latest
        permissions:
            issues: read # the Slack action looks up silence issues
            contents: write # push the generated files to the gh-pages branch
            id-token: write # required for Vault JWT login
        env:
            # How long the published file may go without a confirmation while every
            # source is unreachable before the run fails.
            STALE_AFTER_DAYS: 7

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Test the ACM versions script offline
              run: |
                  # Copied out of the working tree because the next step switches branch.
                  rm -rf /tmp/acm-scripts
                  mkdir -p /tmp/acm-scripts
                  cp -r .github/scripts/get_acm_versions.py .github/scripts/test_get_acm_versions.py \
                      .github/scripts/fixtures /tmp/acm-scripts/
                  python3 -I -m unittest discover -v -s /tmp/acm-scripts -p 'test_*.py'

            - name: Switch to gh-pages branch
              if: github.event_name != 'pull_request'
              run: |
                  git fetch origin gh-pages
                  git checkout gh-pages

            - name: Retrieve OpenShift ACM versions
              id: versions
              if: github.event_name != 'pull_request'
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  status=0
                  python3 /tmp/acm-scripts/get_acm_versions.py || status=$?

                  if [ "$status" -eq 3 ]; then
                    # Every source is blocked or unreachable: an upstream outage.
                    since=$(date -u -d "${STALE_AFTER_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
                    confirmed=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=gh-pages&since=${since}&per_page=100" \
                      --jq '[.[] | select(.commit.message | test("^(Update|Confirm) OpenShift ACM versions"))]
                            | (.[0].commit.committer.date // "")')
                    if [ -n "$confirmed" ]; then
                      echo "::warning::Every OpenShift ACM version source is unreachable. Keeping the published file," \
                        "last confirmed ${confirmed}; this fails after ${STALE_AFTER_DAYS} days without a confirmation."
                      echo "fetched=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    echo "::error::Every OpenShift ACM version source is unreachable and the published file was not confirmed in the last ${STALE_AFTER_DAYS} days."
                    exit 3
                  elif [ "$status" -ne 0 ]; then
                    exit "$status"
                  fi

                  echo "Printing: ./docs/openshift_acm_versions.txt"
                  cat "./docs/openshift_acm_versions.txt"

                  # Guard: never publish an empty/invalid artifact (see commit fa56123).
                  if [ ! -s ./docs/openshift_acm_versions.txt ] || ! grep -qE '[0-9]' ./docs/openshift_acm_versions.txt; then
                    echo "::error::Generated './docs/openshift_acm_versions.txt' is empty or has no version numbers; aborting to avoid publishing an empty artifact."
                    exit 1
                  fi
                  echo "fetched=true" >> "$GITHUB_OUTPUT"

            - name: Commit and push OpenShift ACM versions file to gh-pages
              # A pull request run is here to prove this workflow still produces a valid
              # artifact, not to publish one: it targets a branch the pull request never
              # merges into, so nothing about that write is reviewed, and two of them at
              # once is what rejected the push three times on 2026-08-20. A run whose
              # sources were all unreachable has nothing new to record.
              if: github.event_name != 'pull_request' && steps.versions.outputs.fetched == 'true'
              shell: bash
              run: |
                  set -euo pipefail

                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet docs/openshift_acm_versions.txt; then
                    echo "No change, recording a confirmation on gh-pages"
                    git commit --allow-empty -m "Confirm OpenShift ACM versions"
                  else
                    echo "Changes detected, committing and pushing to gh-pages"
                    git add docs/openshift_acm_versions.txt
                    git commit -m "Update OpenShift ACM versions"
                  fi
                  for attempt in 1 2 3; do
                    if git push origin gh-pages; then
                      exit 0
                    fi
                    echo "::warning::gh-pages rejected the push (attempt ${attempt}/3); rebasing onto the remote and retrying."
                    git pull --rebase origin gh-pages
                  done
                  echo "::error::could not push to gh-pages after three attempts."
                  exit 1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: failure()
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@7c8262dcc14dcaf3f96d59e65e51efdd3787584f # 3.0.1
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
                  vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
                  vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
                  slack_channel_id: ${{ github.event_name == 'schedule' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ github.event_name == 'schedule' && '<!subteam^S0CBB7Y72SV>' || '' }}
                  disable_silence_check: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
