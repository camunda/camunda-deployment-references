---
# This workflow updates the artifacts containing the Aurora PostgreSQL and Aurora MySQL versions,
# they are used by renovate and published at
# https://camunda.github.io/camunda-deployment-references/aurora_postgres_versions.txt
# and https://camunda.github.io/camunda-deployment-references/aurora_mysql_versions.txt
name: Internal - AWS - Save Aurora Versions as an artifact

on:
    schedule:
        - cron: 0 1 * * *
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/internal_aws_artifact_aurora_versions.yml

env:
    AWS_REGION: eu-west-2
    AWS_PROFILE: infraex

jobs:
    save-aurora-versions:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/./.github/actions/asdf-install-tooling@4e5ecdb4100b2a50e46b3517cc8c285c80f7ccd5 # 2.0.1

            - uses: camunda/camunda-deployment-references/.github/actions/aws-configure-cli@d4bccfaaa2ac2e33ced96a73a4354edee55bf428 # main
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Switch to gh-pages branch
              run: |
                  cp .tool-versions /tmp/.tool-versions
                  git fetch origin gh-pages
                  git checkout gh-pages
                  cp /tmp/.tool-versions .tool-versions

            - name: Output Aurora PostgreSQL versions to file
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p docs
                  aws rds describe-db-engine-versions \
                    --engine aurora-postgresql \
                    --no-cli-pager \
                    | jq -r '.DBEngineVersions[].EngineVersion' \
                    | sort -V \
                    > docs/aurora_postgres_versions.txt
                  cat docs/aurora_postgres_versions.txt

                  # Guard: never publish an empty/invalid artifact (see commit fa56123).
                  if [ ! -s docs/aurora_postgres_versions.txt ] || ! grep -qE '[0-9]' docs/aurora_postgres_versions.txt; then
                    echo "::error::Generated 'docs/aurora_postgres_versions.txt' is empty or has no version numbers; aborting to avoid publishing an empty artifact."
                    exit 1
                  fi

            - name: Output Aurora MySQL versions to file
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p docs
                  aws rds describe-db-engine-versions \
                    --engine aurora-mysql \
                    --no-cli-pager \
                    | jq -r '.DBEngineVersions[].EngineVersion' \
                    | sort -V \
                    > docs/aurora_mysql_versions.txt
                  cat docs/aurora_mysql_versions.txt

                  # Guard: never publish an empty/invalid artifact (see commit fa56123).
                  if [ ! -s docs/aurora_mysql_versions.txt ] || ! grep -qE '[0-9]' docs/aurora_mysql_versions.txt; then
                    echo "::error::Generated 'docs/aurora_mysql_versions.txt' is empty or has no version numbers; aborting to avoid publishing an empty artifact."
                    exit 1
                  fi

            - name: Commit and push Aurora versions files to gh-pages
              shell: bash
              run: |
                  set -euo pipefail

                  # Stage first: `git diff` alone ignores untracked files, so a brand new
                  # artifact (e.g. the first Aurora MySQL publication) would be skipped.
                  git add docs/aurora_postgres_versions.txt docs/aurora_mysql_versions.txt

                  git diff --cached --quiet || {
                    echo "Changes detected, committing and pushing to gh-pages"
                    git config --local user.name "github-actions[bot]"
                    git config --local user.email "github-actions[bot]@users.noreply.github.com"
                    git commit -m "Update Aurora versions"
                    git push origin gh-pages
                  }
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: failure()
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@4e5ecdb4100b2a50e46b3517cc8c285c80f7ccd5 # 2.0.1
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
                  slack_channel_id: ${{ github.event_name == 'schedule' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ github.event_name == 'schedule' && '@infraex-medic' || '' }}
                  disable_silence_check: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
