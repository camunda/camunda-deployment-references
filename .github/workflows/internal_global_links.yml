---
name: Internal - Global - Check external links
on:
    workflow_dispatch:
    schedule:
        - cron: 0 3 * * *
    pull_request: {}
env:
    IS_SCHEDULE: ${{ (contains(github.head_ref, 'schedules/') || github.event_name == 'schedule') && 'true' || 'false' }}
jobs:
    lint:
        name: links-check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
            id-token: write
        steps:
            - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81
              continue-on-error: true
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Link Checker
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
              with:
                  fail: true
                  args: -c ./lychee-links.toml . --verbose --no-progress '*.md' './**/*.md'
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Create Issue From File
              if: failure() && env.IS_SCHEDULE == 'true'
              uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710
              with:
                  issue-number: 3472
                  title: Link Checker Report
                  content-filepath: ./lychee/out.md
                  labels: report, automated issue
                  assignees: '@camunda/smx-medic'
            - name: Reopen Link Checker Report
              if: failure() && env.IS_SCHEDULE == 'true' && hashFiles('lychee/out.md') != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/3472" -f state=open >/dev/null
            - name: Notify in Slack in case of failure
              id: slack-notification
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@7c8262dcc14dcaf3f96d59e65e51efdd3787584f
              if: failure()
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
                  vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
                  vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
                  slack_channel_id: ${{ env.IS_SCHEDULE == 'true' && 'C076N4G1162' || 'C07E4FF6YMB' }}
                  slack_mention_people: ${{ env.IS_SCHEDULE == 'true' && '<!subteam^S0CBB7Y72SV>' || '' }}
                  disable_silence_check: ${{ env.IS_SCHEDULE == 'true' && 'false' || 'true' }}
            - name: Submit build status
              if: always()
              continue-on-error: true
              uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45
              with:
                  build_status: ${{ job.status }}

