---
name: Internal - Global - Maintenance

# This workflow performs automated maintenance tasks on Renovate pull requests:
# - Runs 'go mod tidy' to ensure Go dependencies are up to date
# - Automatically commits any changes detected
#
# This helps keep the repository in sync with dependency updates.
#
# It is split in two jobs on purpose, and the split is a security boundary:
#
#   regenerate  runs the repository's own code -- asdf plugins and `go mod tidy`,
#               both taken from the Renovate branch, i.e. from whatever the
#               dependency update brought in. It therefore holds no credential at
#               all: no app token, no Vault approle, and `persist-credentials:
#               false` so the job's own GITHUB_TOKEN is not left in `.git/config`
#               either. It emits a patch as an artifact.
#
#   commit      holds the Vault-backed GitHub App token, and runs no repository
#               code: only SHA-pinned third-party actions plus `git apply` of the
#               artifact. Applying a patch does not execute it. The token is
#               minted last, after the untrusted patch has been measured and
#               applied.
#
# Before the split both lived in one job, so a dependency update could execute
# arbitrary code next to a GitHub App token with write access to this repository.
# That is the shape of INC-7027, where a malicious payload reached a Renovate pull
# request.
#
# This branch has no golden file regeneration, so `regenerate` needs no cloud
# credentials and the separation is complete: nothing worth stealing is present in
# the job that runs branch code. On the branches that do regenerate golden files,
# the Vault approle has to stay behind and the boundary is weaker.

# The workflow-level default is the floor for both jobs: neither of them writes to the
# repository with GITHUB_TOKEN. The write is carried by the app token in `commit` alone.
permissions:
    contents: read

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
    AWS_PROFILE: infraex
    AWS_REGION: eu-west-2
    S3_BACKEND_BUCKET: tests-ra-aws-rosa-hcp-tf-state-eu-central-1
    S3_BUCKET_REGION: eu-central-1
    S3_BUCKET_KEY: golden.tfstate
    PATCH_ARTIFACT_NAME: maintenance-patch
    PATCH_FILE_NAME: maintenance.patch
    # Refuse to auto-commit a patch larger than this. `go mod tidy` rewrites a handful of
    # lines across go.mod and go.sum, so the limit is far above anything legitimate. It is
    # not an injection defence either -- a hostile patch needs three lines. What it catches
    # is a runaway: a broken toolchain rewriting the tree, or bulk content smuggled in
    # behind a plausible-looking commit message.
    MAX_PATCH_BYTES: 1048576

jobs:
    regenerate:
        name: Automated maintenance
        runs-on: ubuntu-latest
        permissions:
            contents: read # this job must never be able to write to the repository
        # Renovate branches live in this repository. A fork pull request would get no
        # secrets anyway, but stating it keeps the trust boundary readable.
        if: >-
            github.event.pull_request.user.login == 'renovate[bot]'
            && github.event.pull_request.head.repo.full_name == github.repository
        outputs:
            changes: ${{ steps.build-patch.outputs.changes }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # The head branch, not the default `refs/pull/N/merge`: the patch is
                  # produced here and replayed onto the same commit by the `commit` job,
                  # so both jobs have to stand on the same tree or the patch will not apply.
                  ref: ${{ github.event.pull_request.head.ref }}
                  # Everything below this point runs code coming from the pull request.
                  # Leaving a credential in `.git/config` would hand it to that code.
                  persist-credentials: false

            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@193a21e1e56c9a65517a822224ac3b4ffa4d6ae4 # 1.5.9

            - name: Run go mod tidy
              run: |
                  echo "Running 'go mod tidy' on all go.mod files..."
                  find . -name 'go.mod' -execdir sh -c 'echo "Processing $(pwd)/go.mod" && go mod tidy' \;
                  echo "✅ 'go mod tidy' completed successfully"

            - name: Build the patch
              id: build-patch
              run: |
                  set -euo pipefail

                  # `git add -A` honours .gitignore, so build caches stay out of the patch.
                  git add -A

                  if git diff --cached --quiet; then
                      echo "No changes produced by maintenance."
                      echo "changes=false" | tee -a "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  git diff --cached --binary > "${RUNNER_TEMP}/${PATCH_FILE_NAME}"
                  echo "changes=true" | tee -a "$GITHUB_OUTPUT"

                  echo "Patch summary:"
                  git diff --cached --stat

                  # Resource guard only, NOT a security control: branch code has already
                  # run in this job, so anything measured here can be lied to. It exists to
                  # avoid uploading a multi-gigabyte artifact and minting a token for a patch
                  # the `commit` job is going to refuse anyway. The authoritative check runs
                  # there, on a runner where no branch code has executed.
                  bytes=$(wc -c < "${RUNNER_TEMP}/${PATCH_FILE_NAME}" | tr -d ' ')
                  if [ "$bytes" -gt "$MAX_PATCH_BYTES" ]; then
                      echo "::error::Maintenance produced a ${bytes}-byte patch, over the ${MAX_PATCH_BYTES}-byte limit; not auto-committing it."
                      echo "::error::Run 'go mod tidy' locally and commit the result yourself, or raise MAX_PATCH_BYTES."
                      exit 1
                  fi

            - name: Upload the patch
              if: steps.build-patch.outputs.changes == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ${{ env.PATCH_ARTIFACT_NAME }}
                  path: ${{ runner.temp }}/${{ env.PATCH_FILE_NAME }}
                  if-no-files-found: error
                  retention-days: 1

    commit:
        name: Commit maintenance changes
        runs-on: ubuntu-latest
        needs: regenerate
        if: needs.regenerate.outputs.changes == 'true'
        permissions:
            contents: read # the write is carried by the app token, not by GITHUB_TOKEN
        steps:
            # No step in this job may run code from the pull request: that is the whole
            # point of the split. Keep it to SHA-pinned third-party actions and git.
            - name: Checkout the pull request branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # The job's own GITHUB_TOKEN is enough to read the branch, and the commit
                  # is created through the GitHub API by the last step, which receives the
                  # app token explicitly. Nothing here needs a write credential, so the app
                  # token does not have to exist yet.
                  ref: ${{ github.event.pull_request.head.ref }}
                  persist-credentials: false

            - name: Download the patch
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: ${{ env.PATCH_ARTIFACT_NAME }}
                  path: ${{ runner.temp }}

            - name: Check the patch is safe to auto-commit
              # The patch content is untrusted: it was produced by branch code in the
              # `regenerate` job. What is trustworthy here is the toolchain measuring it --
              # no branch code has run on this runner, so `git`, `wc` and `grep` cannot
              # have been shimmed to under-report.
              run: |
                  set -euo pipefail

                  patch_path="${RUNNER_TEMP}/${PATCH_FILE_NAME}"

                  numstat=$(git apply --numstat --binary "$patch_path")
                  bytes=$(wc -c < "$patch_path" | tr -d ' ')
                  files=$(printf '%s\n' "$numstat" | grep -c . || true)
                  echo "Patch: ${files} file(s), ${bytes} byte(s)."
                  printf '%s\n' "$numstat"

                  if [ "$bytes" -gt "$MAX_PATCH_BYTES" ]; then
                      echo "::error::The maintenance patch is ${bytes} bytes, over the ${MAX_PATCH_BYTES}-byte limit; not auto-committing it."
                      echo "::error::Run 'go mod tidy' locally and commit the result yourself, or raise MAX_PATCH_BYTES."
                      exit 1
                  fi

                  # getsentry/action-github-commit sends every file to the API as
                  # Buffer.from(content).toString(), i.e. decoded as UTF-8, and hardcodes mode
                  # 100644. Binary content comes out mangled and permissions are lost. The
                  # patch itself carries both faithfully -- it is built and applied with
                  # --binary -- so nothing upstream of here notices; refuse instead of
                  # producing a commit that is quietly wrong.
                  #
                  # Binary hunks report "-" for both counts in --numstat.
                  if printf '%s\n' "$numstat" | awk '$1 == "-" && $2 == "-" { found = 1 } END { exit !found }'; then
                      echo "::error::The patch changes binary files, which the commit step would corrupt."
                      echo "::error::Run the maintenance commands locally and commit the result yourself."
                      exit 1
                  fi

                  if grep -qE '^(old|new) mode ' "$patch_path" \
                     || grep -E '^new file mode ' "$patch_path" | grep -qv ' 100644$'; then
                      echo "::error::The patch changes file modes, which the commit step would flatten to 100644."
                      echo "::error::Run the maintenance commands locally and commit the result yourself."
                      exit 1
                  fi

                  # The maintenance commands regenerate Go module files. They have no business rewriting CI
                  # logic, so a patch that does is either a broken recipe or a dependency writing
                  # itself a workflow. That matters because the result lands on the pull request
                  # branch as an app commit, after any review already given: unless the branch
                  # requires re-approval on push, an approval predating it still stands.
                  #
                  # Scoped to the CI entrypoints rather than all of `.github/`: main and stable/8.9
                  # carry a real Go module at .github/skills/ci-feedback-loop that `go mod tidy`
                  # legitimately updates, so a blanket refusal is wrong there and the branches
                  # should not diverge.
                  # `cut -f3-` keeps the whole path field, so a rename with either side inside
                  # those directories is caught too.
                  if printf '%s\n' "$numstat" | cut -f3- | grep -qE '\.github/(workflows|actions)/|(^|/)\.gitmodules$'; then
                      echo "::error::The patch touches CI definitions (.github/workflows, .github/actions or .gitmodules); maintenance never needs to."
                      echo "::error::Inspect the pull request: this is a broken recipe, or a dependency writing itself CI logic."
                      exit 1
                  fi

            - name: Apply the patch
              run: |
                  set -euo pipefail

                  patch_path="${RUNNER_TEMP}/${PATCH_FILE_NAME}"

                  # `git apply` refuses paths outside the working tree, so the patch cannot
                  # reach the runner's filesystem. It is applied, never executed.
                  #
                  # The changes are left unstaged on purpose: action-github-commit collects
                  # them with `git ls-files -om`, which compares the working tree against
                  # the index.
                  git apply --stat --binary "$patch_path"
                  git apply --check --binary "$patch_path"
                  if ! git apply --binary "$patch_path"; then
                      echo "::error::Could not apply the maintenance patch, most likely because the branch moved between jobs. Re-run the workflow."
                      exit 1
                  fi

            # Minted last, deliberately: the token only needs to exist for the commit call,
            # so it is not alive while the untrusted patch is downloaded, measured and
            # applied.
            - name: Generate token for GitHub
              id: generate-github-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@66bf6e260f2beb42a83284fef490bb96672e8f36 # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  # Pin the installation token to this repository rather than relying on
                  # the composite action's default, which derives the same value from
                  # `github.repository`. Identical scope today; stated so it cannot drift
                  # if that default ever changes.
                  repositories: ${{ github.event.repository.name }}
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  vault-url: ${{ secrets.VAULT_ADDR }}

            - name: Commit changes
              uses: getsentry/action-github-commit@5972d5f578ad77306063449e718c0c2a6fbc4ae1 # main
              with:
                  github-token: ${{ steps.generate-github-token.outputs.token }}
                  message: 'chore: update from scheduled maintenance (go mod tidy & just regenerate)'
