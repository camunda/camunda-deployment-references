---
name: Tests - Integration - Local Kind Operator Based PostgreSQL
permissions:
    contents: read
on:
    schedule:
        - cron: 0 5 * * 3
    pull_request: {}
    workflow_dispatch:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    triage:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip
    postgresql-ha-tests:
        name: PostgreSQL HA defaults
        needs: triage
        if: needs.triage.outputs.should_skip == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@bc213900ffa03aff635a3df98eaecb7d92cea665
            - name: Run the PostgreSQL HA integration test
              run: ./generic/kubernetes/operator-based/tests/postgresql-ha/run-tests.sh

