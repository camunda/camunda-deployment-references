---
name: Tests - Integration - Local Kind Operator Based PostgreSQL
permissions:
    contents: read
on:
    schedule:
        - cron: 0 5 * * 3
    pull_request: {}
    workflow_dispatch:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    triage:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Check labels
              id: skip_check
              uses: ./.github/actions/internal-triage-skip
    postgresql-ha-tests:
        name: PostgreSQL HA defaults
        needs: triage
        if: needs.triage.outputs.should_skip == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81
              continue-on-error: true
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Install asdf tools with cache
              uses: camunda/infraex-common-config/.github/actions/asdf-install-tooling@7c8262dcc14dcaf3f96d59e65e51efdd3787584f
            - name: Run the PostgreSQL HA integration test
              run: ./generic/kubernetes/operator-based/tests/postgresql-ha/run-tests.sh
            - name: Submit build status
              if: always()
              continue-on-error: true
              uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45
              with:
                  build_status: ${{ job.status }}

