# Ignore all private link (such as localhost) to avoid errors
exclude_all_private = true
# HTTP status code: 429 (Too Many Requests) will also be treated as a valid link if Lychee gets rate limited
accept = ["200", "429"]
# retry
max_retries = 6
retry_wait_time = 10
timeout = 60
max_concurrency = 3

# Exclude all unsupported versioned_docs
exclude_path = [
]

# Explicitly exclude some URLs
exclude = [
  "^file:",
  "https://developer.hashicorp.com/*", # vercel security check causing issues
  "^https://docs\\.openshift\\.com/", # redirects to docs.redhat.com, which blocks automated requests with 403
]
