# Cache the results of Lychee if ran locally in order to minimise the chance of rate limiting
cache = true
# Ignore all private link (such as localhost) to avoid errors
exclude_all_private = true
# HTTP status code: 429 (Too Many Requests) will also be treated as a valid link if Lychee gets rate limited
accept = ["200", "403", "429"]
# retry
max_retries = 6
retry_wait_time = 10
max_concurrency = 3

# Exclude all unsupported versioned_docs
exclude_path = [
]

# Explicitly exclude some URLs
exclude = [
  "^file:",
  "https://developer.hashicorp.com/*", # vercel security check causing issues
  "^https?://keycloak-service(:|/)", # in-cluster service hostname documented in smoke-test action, only resolvable inside the cluster
  # TODO: [release-duty] drop both entries once camunda/camunda-docs#9739 is merged and the pages are published.
  "^https://docs\\.camunda\\.io/docs/next/self-managed/deployment/helm/cloud-providers/amazon/amazon-eks/multi-region-rdbms/$", # published by camunda/camunda-docs#9739
  "^https://docs\\.camunda\\.io/docs/next/self-managed/deployment/helm/operational-tasks/multi-region-rdbms-ops/$", # published by camunda/camunda-docs#9739
]
