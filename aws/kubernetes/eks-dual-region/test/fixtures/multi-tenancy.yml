---
# The chart renders `camunda.multiTenancy.checksEnabled` into the orchestration
# ConfigMap from these values (templates/orchestration/files/_application.yaml).
# Setting them here rather than through `extraConfiguration` keeps the chart's
# own rendering from overriding the intent with its default of false.
#
# Scoped to `orchestration` on purpose: `global.multitenancy.enabled` also
# turns on Identity multi-tenancy, which the chart refuses unless Identity runs
# against an external database. The dual-region suite only needs the
# orchestration-side checks.
orchestration:
    multitenancy:
        checks:
            enabled: true
        api:
            enabled: true
