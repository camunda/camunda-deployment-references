---
orchestration:
    # Broker numbering across failure domains. `global.multiregion.*` is
    # deprecated since chart v15 (Camunda 8.10) and removed in v16; the fields
    # moved here and were renamed with it. Both blocks cannot be set at once --
    # the chart fails the render rather than picking one.
    partitioning:
        # number of failure domains this Camunda Platform instance is stretched across
        numberOfZones: 2
        # zero-based index of the zone this release is deployed to. Node IDs are
        # derived as `<ordinal> * numberOfZones + zoneIndex`.
        zoneIndex: 1
