---
# This file contains specific values used during the integration tests


# Auth to avoid Docker download rate limit.
# https://docs.docker.com/docker-hub/download-rate-limit/
identityKeycloak:
    image:
        # Mirror chart defaults so c8-sm-checks aws-irsa.sh can match the
        # 'camunda/keycloak' substring in helm get values output.
        #
        # Not annotated for Renovate on purpose: this has to equal whatever the chart
        # ships as its default, and Renovate would track the registry instead, moving the
        # tag ahead of the chart and breaking the mirror it exists for. It follows the
        # chart version above it, by hand. The annotation that used to sit here read the
        # `repository:` line below rather than the tag, so it extracted 'camunda/keycloak'
        # as a version and updated nothing anyway.
        repository: camunda/keycloak
        tag: 26.3.3
        pullSecrets:
            - name: index-docker-io

global:
    image:
        pullSecrets:
            - name: index-docker-io

elasticsearch:
    global:
        imagePullSecrets:
            - name: index-docker-io
