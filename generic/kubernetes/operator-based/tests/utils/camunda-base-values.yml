---
# Optimize configuration
optimize:
    enabled: true

# Connectors configuration
connectors:
    enabled: true

# Chart 15.x consolidates WebModeler (and the Console feature) under Camunda
# Hub. `webModeler.enabled` is deprecated in favour of `camundaHub.enabled`.
camundaHub:
    enabled: true
    # TODO: [release-duty] drop this SNAPSHOT pin once
    # camunda/camunda-platform-helm#6567 is fixed. The chart's default Hub image
    # rejects the `hub`/`admin` cluster app types; the rolling SNAPSHOT tag
    # accepts them (as kind already does).
    image:
        tag: SNAPSHOT

identity:
    enabled: true
