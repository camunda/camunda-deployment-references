---
# Optimize configuration
optimize:
    # Interim OpenJDK Base64 mitigation (CVE-2026-114938), remove once the JDK is patched.
    env:
        - name: JDK_JAVA_OPTIONS
          value: -XX:-UseBASE64Intrinsics
    enabled: true

# Connectors configuration
connectors:
    # Interim OpenJDK Base64 mitigation (CVE-2026-114938), remove once the JDK is patched.
    env:
        - name: JDK_JAVA_OPTIONS
          value: -XX:-UseBASE64Intrinsics
    enabled: true

# Console configuration
console:
    enabled: true

webModeler:
    enabled: true
    restapi:
        # Interim OpenJDK Base64 mitigation (CVE-2026-114938), remove once the JDK is patched.
        env:
            - name: JDK_JAVA_OPTIONS
              value: -XX:-UseBASE64Intrinsics

identity:
    # Interim OpenJDK Base64 mitigation (CVE-2026-114938), remove once the JDK is patched.
    env:
        - name: JDK_JAVA_OPTIONS
          value: -XX:-UseBASE64Intrinsics
    enabled: true

orchestration:
    # Interim OpenJDK Base64 mitigation (CVE-2026-114938), remove once the JDK is patched.
    env:
        - name: JDK_JAVA_OPTIONS
          value: -XX:-UseBASE64Intrinsics
