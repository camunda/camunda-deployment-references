---
# instances and walStorage follow postgresql-clusters.yml; see its header.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: pg-camunda
spec:
    instances: 2
    description: PostgreSQL cluster for Camunda orchestration secondary storage (RDBMS mode)
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4
    storage:
        size: 15Gi
    walStorage:
        size: 5Gi
    superuserSecret:
        name: pg-camunda-superuser-secret
    # OpenShift Security Context - let SCC manage the security context
    seccompProfile:
        type: RuntimeDefault
    bootstrap:
        initdb:
            database: camunda
            owner: camunda
            dataChecksums: true
            secret:
                name: pg-camunda-secret
