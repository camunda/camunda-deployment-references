---
# Two instances keep the node hosting a database drainable; a dedicated WAL volume keeps
# replication-slot retention out of PGDATA. Both are one-way changes, and single-node
# environments pass PG_INSTANCES=1 to deploy.sh instead. Rationale, sizing, and the
# migration for existing deployments:
# https://docs.camunda.io/docs/self-managed/deployment/helm/configure/operator-based-infrastructure/#high-availability-and-node-maintenance
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: pg-identity
spec:
    instances: 2
    affinity:
        enablePodAntiAffinity: true
        topologyKey: kubernetes.io/hostname
        # required, not the CloudNativePG default of preferred: under scheduler pressure
        # preferred silently co-locates both instances, and draining that node then has no
        # switchover target, which is the failure these defaults exist to prevent. A cluster
        # with fewer schedulable nodes than instances should set PG_INSTANCES instead.
        podAntiAffinityType: required
    description: PostgreSQL cluster for Camunda Identity
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4
    storage:
        size: 15Gi
    walStorage:
        size: 5Gi
    superuserSecret:
        name: pg-identity-superuser-secret
    # OpenShift Security Context - let SCC manage the security context
    seccompProfile:
        type: RuntimeDefault
    bootstrap:
        initdb:
            database: identity
            owner: identity
            dataChecksums: true
            secret:
                name: pg-identity-secret
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: pg-keycloak
spec:
    instances: 2
    affinity:
        enablePodAntiAffinity: true
        topologyKey: kubernetes.io/hostname
        # required, not the CloudNativePG default of preferred: under scheduler pressure
        # preferred silently co-locates both instances, and draining that node then has no
        # switchover target, which is the failure these defaults exist to prevent. A cluster
        # with fewer schedulable nodes than instances should set PG_INSTANCES instead.
        podAntiAffinityType: required
    description: PostgreSQL cluster for Keycloak
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4
    storage:
        size: 15Gi
    walStorage:
        size: 5Gi
    superuserSecret:
        name: pg-keycloak-superuser-secret
    # OpenShift Security Context - let SCC manage the security context
    seccompProfile:
        type: RuntimeDefault
    postgresql:
        parameters:
            lock_timeout: 30s
            statement_timeout: '0'
    bootstrap:
        initdb:
            database: keycloak
            owner: keycloak
            dataChecksums: true
            secret:
                name: pg-keycloak-secret
---
# Renamed from `pg-webmodeler` with the 8.10 Web Modeler to Camunda Hub rename, along
# with its database, user and secrets. Applying this to an existing deployment creates
# a new empty cluster and leaves the old one untouched, so Camunda Hub starts without
# the existing Web Modeler data: this is a fresh-install reference, not an upgrade
# path. To keep an existing database, override the identifiers back to the
# `pg-webmodeler` names rather than renaming the cluster, or dump and restore into the
# new one before pointing Hub at it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: pg-hub
spec:
    instances: 2
    affinity:
        enablePodAntiAffinity: true
        topologyKey: kubernetes.io/hostname
        # required, not the CloudNativePG default of preferred: under scheduler pressure
        # preferred silently co-locates both instances, and draining that node then has no
        # switchover target, which is the failure these defaults exist to prevent. A cluster
        # with fewer schedulable nodes than instances should set PG_INSTANCES instead.
        podAntiAffinityType: required
    description: PostgreSQL cluster for Camunda Hub
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4
    superuserSecret:
        name: pg-hub-superuser-secret
    # OpenShift Security Context - let SCC manage the security context
    seccompProfile:
        type: RuntimeDefault
    bootstrap:
        initdb:
            database: hub
            owner: hub
            secret:
                name: pg-hub-secret
    storage:
        size: 15Gi
    walStorage:
        size: 5Gi
