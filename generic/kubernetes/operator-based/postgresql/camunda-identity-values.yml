---
# Camunda Platform 8 Values - CNPG Identity Snippet
# This configuration uses external services managed by Kubernetes operators:
# - PostgreSQL: CloudNativePG operator with a dedicated cluster for Identity
#
# Authentication Secrets:
# - pg-identity-secret: Contains the PostgreSQL password for Identity
#
# The chart only reads the password from the secret; the username must be set
# here explicitly. It has to match the owner role the CNPG cluster bootstraps
# (see postgresql-clusters.yml, pg-identity: bootstrap.initdb.owner).

identity:
    enabled: true

    # Use external PostgreSQL
    externalDatabase:
        enabled: true
        host: pg-identity-rw
        port: 5432
        database: identity
        username: identity
        # Use the new secret configuration format
        secret:
            existingSecret: pg-identity-secret
            existingSecretKey: password
