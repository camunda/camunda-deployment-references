---
# Camunda Platform Helm values for Kind local development WITHOUT domain
#
# This configuration enables:
# - No Ingress (access via port-forward)
# - Local access via localhost with port forwarding
# - OIDC authentication via Keycloak
#
# Used in combination with operator-based values from generic/kubernetes/operator-based/:
# - camunda-elastic-values.yml (Elasticsearch via ECK)
# - camunda-keycloak-no-domain-values.yml (Keycloak via operator, no-domain mode)
# - camunda-identity-values.yml (PostgreSQL for Identity via CloudNativePG)
# - camunda-hub-values.yml (PostgreSQL for Camunda Hub via CloudNativePG)

global:
    ingress:
        enabled: false

    identity:
        auth:
            admin:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-admin-client-token

            optimize:
                redirectUrl: http://localhost:8083
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-optimize-client-token

            webModeler:
                redirectUrl: http://localhost:8070

connectors:
    enabled: true
    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 1000m
            memory: 1Gi
    security:
        authentication:
            oidc:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-connectors-client-token

identity:
    enabled: true
    fullURL: http://localhost:8085

    # Identity provisions the `camunda-platform` Keycloak realm on startup, and
    # every other component blocks on that realm for OIDC discovery. If Identity
    # is starved it is OOMKilled or throttled before the realm exists, and the
    # whole platform crash-loops with a misleading 503/404 on the issuer URL.
    # A Spring Boot JVM needs more than 512Mi/500m to get there reliably on a
    # contended laptop, so keep this component comfortable.
    resources:
        requests:
            cpu: 100m
            memory: 512Mi
        limits:
            cpu: 1000m
            memory: 1Gi

    firstUser:
        enabled: true
        username: admin
        email: admin@camunda.local
        firstName: Admin
        lastName: User
        secret:
            existingSecret: camunda-credentials
            existingSecretKey: identity-first-user-password

optimize:
    enabled: true
    resources:
        requests:
            cpu: 200m
            memory: 256Mi
        limits:
            cpu: 1000m
            memory: 1Gi

# Reduce Zeebe resources for local development
orchestration:
    clusterSize: '1'
    env:
        - name: CAMUNDA_CLUSTER_PARTITIONCOUNT
          value: '1'
        - name: CAMUNDA_CLUSTER_REPLICATIONFACTOR
          value: '1'
    pvcSize: 10Gi
    resources:
        requests:
            cpu: 300m
            memory: 512Mi
        limits:
            cpu: 2000m
            memory: 2Gi
    security:
        authentication:
            oidc:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-orchestration-client-token
        initialization:
            defaultRoles:
                admin:
                    users:
                        - admin
camundaHub:
    enabled: true

    # TODO: [release-duty] drop this SNAPSHOT pin once
    # camunda/camunda-platform-helm#6567 is fixed. The chart's default Hub image
    # rejects the `hub`/`admin` cluster app types introduced in chart 15.x; the
    # rolling SNAPSHOT tag for camunda/hub and camunda/hub-websockets accepts
    # them.
    image:
        tag: SNAPSHOT

    restapi:
        # The Pusher secret and app key must come from an existing secret.
        # Without this, the chart auto-generates a new random Pusher secret on
        # every `helm upgrade`, breaking WebSocket auth.
        pusher:
            secret:
                existingSecret: camunda-credentials
                existingSecretKey: webmodeler-pusher-app-secret
            client:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: webmodeler-pusher-app-key
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 1000m
                memory: 1Gi

    websockets:
        resources:
            requests:
                cpu: 50m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi
