---
# Camunda Platform Helm values for Kind local development WITH domain
#
# This configuration enables:
# - Ingress with TLS (via mkcert certificates)
# - Domain-based access (camunda.example.com)
# - OIDC authentication via Keycloak
#
# Prerequisites:
# - TLS certificates generated by: certs-create-secret.sh
# - Hosts file configured by: hosts-add.sh
# - For mkcert CA trust in pods, also use: values-mkcert.yml
#
# Used in combination with operator-based values from generic/kubernetes/operator-based/:
# - camunda-elastic-values.yml (Elasticsearch via ECK)
# - camunda-keycloak-domain-values.yml (Keycloak via operator, domain mode)
# - camunda-identity-values.yml (PostgreSQL for Identity via CloudNativePG)
# - camunda-hub-values.yml (PostgreSQL for Camunda Hub via CloudNativePG)

global:
    identity:
        auth:
            admin:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-admin-client-token

            optimize:
                redirectUrl: https://camunda.example.com/optimize
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-optimize-client-token

            webModeler:
                redirectUrl: https://camunda.example.com/modeler

    host: camunda.example.com
    ingress:
        enabled: true
        className: contour
        tls:
            enabled: true
            secretName: camunda-platform

connectors:
    enabled: true
    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 1000m
            memory: 1Gi
    security:
        authentication:
            oidc:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-connectors-client-token

identity:
    enabled: true
    contextPath: /managementidentity
    fullURL: https://camunda.example.com/managementidentity

    # Identity provisions the `camunda-platform` Keycloak realm on startup, and
    # every other component blocks on that realm for OIDC discovery. If Identity
    # is starved it is OOMKilled or throttled before the realm exists, and the
    # whole platform crash-loops with a misleading 503/404 on the issuer URL.
    # A Spring Boot JVM needs more than 512Mi/500m to get there reliably on a
    # contended laptop, so keep this component comfortable.
    resources:
        requests:
            cpu: 100m
            memory: 512Mi
        limits:
            cpu: 1000m
            memory: 1Gi

    firstUser:
        enabled: true
        username: admin
        email: admin@camunda.local
        firstName: Admin
        lastName: User
        secret:
            existingSecret: camunda-credentials
            existingSecretKey: identity-first-user-password

optimize:
    enabled: true
    contextPath: /optimize
    resources:
        requests:
            cpu: 200m
            memory: 256Mi
        limits:
            cpu: 1000m
            memory: 1Gi

# Reduce Zeebe resources for local development
orchestration:
    contextPath: /
    clusterSize: '1'
    env:
        - name: CAMUNDA_CLUSTER_PARTITIONCOUNT
          value: '1'
        - name: CAMUNDA_CLUSTER_REPLICATIONFACTOR
          value: '1'
    pvcSize: 10Gi
    resources:
        requests:
            cpu: 300m
            memory: 512Mi
        limits:
            cpu: 2000m
            memory: 2Gi
    ingress:
        grpc:
            enabled: true
            className: contour
            host: zeebe-camunda.example.com
            tls:
                enabled: true
                secretName: camunda-platform
    security:
        authentication:
            oidc:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: identity-orchestration-client-token
        initialization:
            defaultRoles:
                admin:
                    users:
                        - admin

camundaHub:
    enabled: true
    contextPath: /modeler

    # TODO: [release-duty] drop this SNAPSHOT pin once
    # camunda/camunda-platform-helm#6567 is fixed. The chart's default Hub image
    # rejects the `hub`/`admin` cluster app types introduced in chart 15.x; the
    # rolling SNAPSHOT tag for camunda/hub and camunda/hub-websockets accepts
    # them.
    image:
        tag: SNAPSHOT

    restapi:
        # The Pusher secret and app key must come from an existing secret.
        # Without this, the chart auto-generates a new random Pusher secret on
        # every `helm upgrade`, breaking WebSocket auth.
        pusher:
            secret:
                existingSecret: camunda-credentials
                existingSecretKey: hub-pusher-app-secret
            client:
                secret:
                    existingSecret: camunda-credentials
                    existingSecretKey: hub-pusher-app-key
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 1000m
                memory: 1Gi

    websockets:
        resources:
            requests:
                cpu: 50m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi
